<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>換鈔金分配</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#245b9b">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --field-line: #b8c6cc;
      --primary: #245b9b;
      --primary-soft: #e7f0fb;
      --green: #1f6f64;
      --green-soft: #e4f0ee;
      --gold: #8a5a00;
      --gold-soft: #fff4d8;
      --danger: #b42318;
      --danger-soft: #fff5f4;
      --shadow: 0 7px 18px rgba(23, 33, 38, 0.06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    button,
    input { font: inherit; }

    input {
      min-width: 0;
      min-height: 40px;
      border: 1px solid var(--field-line);
      border-radius: 8px;
      padding: 0 8px;
      background: #fff;
      color: var(--ink);
      text-align: center;
      font-weight: 900;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 91, 155, 0.16);
      outline: none;
    }

    .shell {
      width: min(1060px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 8px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 42px;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.12;
    }

    h1 { font-size: 1.3rem; }
    h2 { font-size: 1rem; }

    .status {
      min-height: 16px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.3;
    }

    .button,
    .mini-button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .button { padding: 0 10px; }

    .mini-button {
      min-height: 30px;
      padding: 0 8px;
      font-size: 0.78rem;
      color: var(--primary);
      background: var(--primary-soft);
      border-color: transparent;
    }

    .button.primary,
    .mini-button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .mini-button.danger {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .header-actions,
    .quick-actions,
    .summary,
    .custom-summary,
    .settings-actions {
      display: grid;
      gap: 6px;
    }

    .header-actions { grid-template-columns: 1fr 1fr; }
    .quick-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .custom-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .settings-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .panel,
    .metric,
    .result,
    .modal-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel,
    .result {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .section-title {
      display: grid;
      gap: 3px;
    }

    .section-title span,
    .metric span,
    .note {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.35;
    }

    .metric {
      min-height: 64px;
      padding: 8px;
      display: grid;
      gap: 2px;
      align-content: center;
      min-width: 0;
    }

    .metric strong {
      color: var(--primary);
      font-size: 1.12rem;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .metric.warn strong {
      color: var(--danger);
    }

    .money-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px;
    }

    .custom-grid,
    .target-grid,
    .diff-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .money-field,
    .custom-cell,
    .diff-cell {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .money-field span,
    .custom-head,
    .diff-head {
      min-height: 28px;
      border-radius: 8px;
      background: #eef2f4;
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 0.76rem;
      font-weight: 950;
      text-align: center;
    }

    .money-field.receipt span {
      color: var(--gold);
      background: var(--gold-soft);
    }

    .custom-head.total-head {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .custom-total {
      min-height: 40px;
      border: 1px solid rgba(36, 91, 155, 0.26);
      border-radius: 8px;
      background: #f2f7fd;
      color: var(--primary);
      display: grid;
      place-items: center;
      padding: 0 6px;
      font-size: 0.9rem;
      font-weight: 950;
      text-align: center;
      white-space: nowrap;
    }

    .custom-total.negative {
      border-color: rgba(180, 35, 24, 0.34);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .diff-value {
      min-height: 40px;
      border: 1px solid var(--field-line);
      border-radius: 8px;
      background: #fbfcfc;
      display: grid;
      place-items: center;
      padding: 0 6px;
      font-size: 0.9rem;
      font-weight: 950;
      text-align: center;
      white-space: nowrap;
    }

    .diff-value.add {
      border-color: rgba(31, 111, 100, 0.34);
      background: var(--green-soft);
      color: var(--green);
    }

    .diff-value.remove {
      border-color: rgba(138, 90, 0, 0.38);
      background: var(--gold-soft);
      color: var(--gold);
    }

    .diff-value.same {
      color: var(--muted);
    }

    .result.ok {
      border-color: rgba(31, 111, 100, 0.34);
      background: var(--green-soft);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      padding: max(12px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      background: rgba(23, 33, 38, 0.42);
      overflow-y: auto;
    }

    .modal.open {
      display: grid;
      align-items: start;
    }

    .modal-card {
      width: min(840px, 100%);
      margin: 0 auto;
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .total-setting {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px;
      gap: 6px;
      align-items: end;
    }

    .setting-label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 850;
    }

    .settings-check {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      display: grid;
      align-content: center;
      gap: 2px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 900;
    }

    .settings-check.warn {
      border-color: rgba(180, 35, 24, 0.34);
      background: var(--danger-soft);
      color: var(--danger);
    }

    @media (max-width: 860px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .money-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .custom-grid,
      .target-grid,
      .diff-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 460px) {
      .shell { padding-left: 8px; padding-right: 8px; }
      header { grid-template-columns: 1fr; }
      h1 { font-size: 1.18rem; }
      .panel,
      .result,
      .modal-card { padding: 8px; }
      .quick-actions,
      .settings-actions,
      .total-setting { grid-template-columns: 1fr; }
      .money-grid,
      .custom-grid,
      .target-grid,
      .diff-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .section-title span,
      .metric span,
      .note { font-size: 0.7rem; }
    }

    @media (max-width: 460px) and (min-height: 680px) {
      .shell {
        gap: 5px;
        padding-top: max(6px, env(safe-area-inset-top));
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }

      header {
        min-height: 34px;
        gap: 5px;
      }

      h1 { font-size: 1.06rem; }

      .status,
      .section-title span,
      .note {
        display: none;
      }

      .header-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .button {
        min-height: 30px;
        padding: 0 8px;
        font-size: 0.82rem;
      }

      .summary {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
      }

      .custom-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
      }

      .metric {
        min-height: 48px;
        padding: 5px;
      }

      .metric span {
        display: block;
        font-size: 0.62rem;
        line-height: 1.1;
      }

      .metric strong {
        font-size: 0.82rem;
      }

      .panel,
      .result {
        gap: 5px;
        padding: 6px;
      }

      .section-title {
        gap: 0;
      }

      .section-title h2 {
        font-size: 0.9rem;
      }

      .quick-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
      }

      .mini-button {
        min-height: 28px;
        font-size: 0.76rem;
      }

      .money-grid,
      .custom-grid,
      .diff-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
      }

      .money-field,
      .custom-cell,
      .diff-cell {
        gap: 3px;
      }

      .money-field span,
      .custom-head,
      .diff-head {
        min-height: 21px;
        font-size: 0.68rem;
        border-radius: 6px;
      }

      input,
      .custom-total,
      .diff-value {
        min-height: 32px;
        border-radius: 7px;
        font-size: 0.8rem;
        padding: 0 4px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>換鈔金分配</h1>
        <div class="status" id="status">輸入庫存數量與收據金額，自動算出補充建議。</div>
      </div>
      <div class="header-actions">
        <button class="button" id="settings-button" type="button">設定</button>
        <a class="button" href="../../index.html">工具箱</a>
      </div>
    </header>

    <section class="summary" aria-label="總覽">
      <div class="metric">
        <span>庫存現金</span>
        <strong id="stock-total">$0</strong>
      </div>
      <div class="metric">
        <span>收據金額</span>
        <strong id="receipt-total">$0</strong>
      </div>
      <div class="metric">
        <span>庫存 + 收據</span>
        <strong id="available-total">$0</strong>
      </div>
      <div class="metric" id="balance-card">
        <span>差額</span>
        <strong id="balance-diff">$0</strong>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>庫存數量</h2>
        <span>可直接貼上：1000、500、100、50、10、5、1、收據，欄位之間用 Tab 或空白分隔。</span>
      </div>
      <div class="quick-actions">
        <button class="mini-button primary" id="paste-stock" type="button">貼上庫存資料</button>
        <button class="mini-button danger" id="clear-stock" type="button">庫存與收據清空</button>
      </div>
      <div class="money-grid" id="stock-grid"></div>
      <div class="note" id="saved-note"></div>
    </section>

    <section class="result ok">
      <div class="section-title">
        <h2>補充建議</h2>
        <span id="result-text">下方直接顯示各幣種要拿出或補進的數量。</span>
      </div>
      <div class="diff-grid" id="diff-grid"></div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>自行分配</h2>
        <span>填入自行分配數量後，下方會自動顯示庫存加分配後的結果；負數代表拿走。</span>
      </div>
      <div class="custom-summary" aria-label="自行分配總覽">
        <div class="metric">
          <span>調整金額</span>
          <strong id="custom-add-total">$0</strong>
        </div>
        <div class="metric" id="custom-balance-card">
          <span>分配差額</span>
          <strong id="custom-balance-diff">$0</strong>
        </div>
      </div>
      <div class="custom-grid" id="custom-input-grid"></div>
      <div class="custom-grid" id="custom-total-grid"></div>
    </section>
  </main>

  <section class="modal" id="settings-modal" aria-modal="true" role="dialog">
    <section class="modal-card">
      <div class="modal-head">
        <h2>分配設定</h2>
        <button class="button" id="close-settings" type="button">關閉</button>
      </div>
      <div class="total-setting">
        <label class="setting-label">
          目標總額
          <input id="target-total-input" type="number" min="0" step="1" inputmode="numeric">
        </label>
        <button class="mini-button" id="reset-settings" type="button">恢復預設</button>
      </div>
      <div class="target-grid" id="target-settings-grid"></div>
      <div class="settings-check" id="settings-check"></div>
      <div class="settings-actions">
        <button class="button primary" id="done-settings" type="button">完成</button>
        <button class="button" id="close-settings-bottom" type="button">關閉</button>
      </div>
    </section>
  </section>

  <script>
    const DENOMS = [
      { key: "1000", label: "1000", unit: "張", value: 1000 },
      { key: "500", label: "500", unit: "張", value: 500 },
      { key: "100", label: "100", unit: "張", value: 100 },
      { key: "50", label: "50", unit: "枚", value: 50 },
      { key: "10", label: "10", unit: "枚", value: 10 },
      { key: "5", label: "5", unit: "枚", value: 5 },
      { key: "1", label: "1", unit: "枚", value: 1 },
    ];

    const DEFAULT_SETTINGS = {
      targetTotal: 10000,
      target: {
        "1000": 0,
        "500": 0,
        "100": 60,
        "50": 50,
        "10": 100,
        "5": 80,
        "1": 100,
      },
    };
    const STOCK_STORAGE_KEY = "cashChangePlannerStockV2";
    const SETTINGS_STORAGE_KEY = "cashChangePlannerSettingsV1";

    const stockGrid = document.getElementById("stock-grid");
    const diffGrid = document.getElementById("diff-grid");
    const customInputGrid = document.getElementById("custom-input-grid");
    const customTotalGrid = document.getElementById("custom-total-grid");
    const status = document.getElementById("status");
    const savedNote = document.getElementById("saved-note");
    const settingsModal = document.getElementById("settings-modal");
    const targetSettingsGrid = document.getElementById("target-settings-grid");
    const targetTotalInput = document.getElementById("target-total-input");
    const settingsCheck = document.getElementById("settings-check");
    const balanceCard = document.getElementById("balance-card");
    const customBalanceCard = document.getElementById("custom-balance-card");

    let settings = loadSettings();

    function parseCount(value) {
      const number = Number.parseInt(String(value || "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(number) && number > 0 ? number : 0;
    }

    function parseSignedCount(value) {
      const number = Number.parseInt(String(value || "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(number) ? number : 0;
    }

    function formatCurrency(value) {
      const number = Math.round(Number(value) || 0);
      const sign = number < 0 ? "-" : "";
      return `${sign}$${Math.abs(number).toLocaleString("zh-TW")}`;
    }

    function fieldId(key) {
      return `stock-${key}`;
    }

    function targetFieldId(key) {
      return `target-${key}`;
    }

    function customFieldId(key) {
      return `custom-${key}`;
    }

    function stockKeys() {
      return [...DENOMS.map((denom) => denom.key), "receipt"];
    }

    function blankStock() {
      return Object.fromEntries(stockKeys().map((key) => [key, 0]));
    }

    function normalizeSettings(value) {
      return {
        targetTotal: parseCount(value?.targetTotal) || DEFAULT_SETTINGS.targetTotal,
        target: Object.fromEntries(DENOMS.map((denom) => [
          denom.key,
          parseCount(value?.target?.[denom.key] ?? DEFAULT_SETTINGS.target[denom.key]),
        ])),
      };
    }

    function loadSettings() {
      try {
        return normalizeSettings(JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || "null"));
      } catch {
        return normalizeSettings(DEFAULT_SETTINGS);
      }
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
    }

    function readStock() {
      const values = Object.fromEntries(DENOMS.map((denom) => {
        const input = document.getElementById(fieldId(denom.key));
        return [denom.key, parseCount(input?.value)];
      }));
      values.receipt = parseCount(document.getElementById("stock-receipt")?.value);
      return values;
    }

    function readCustomAdds() {
      return Object.fromEntries(DENOMS.map((denom) => {
        const input = document.getElementById(customFieldId(denom.key));
        return [denom.key, parseSignedCount(input?.value)];
      }));
    }

    function setStock(values, shouldSave = true) {
      const next = { ...blankStock(), ...(values || {}) };
      DENOMS.forEach((denom) => {
        const input = document.getElementById(fieldId(denom.key));
        if (input) input.value = String(parseCount(next[denom.key]));
      });
      const receipt = document.getElementById("stock-receipt");
      if (receipt) receipt.value = String(parseCount(next.receipt));
      calculate(shouldSave);
    }

    function clearCustomAdds() {
      DENOMS.forEach((denom) => {
        const input = document.getElementById(customFieldId(denom.key));
        if (input) input.value = "0";
      });
    }

    function stockCashTotal(stock) {
      return DENOMS.reduce((sum, denom) => sum + (parseCount(stock[denom.key]) * denom.value), 0);
    }

    function customAddCashTotal(adds) {
      return DENOMS.reduce((sum, denom) => sum + (parseSignedCount(adds[denom.key]) * denom.value), 0);
    }

    function targetCashTotal() {
      return DENOMS.reduce((sum, denom) => sum + ((settings.target[denom.key] || 0) * denom.value), 0);
    }

    function parseStockLine(text) {
      const values = String(text || "")
        .trim()
        .split(/[\t,\s]+/)
        .filter(Boolean)
        .map(parseCount);
      if (values.length < 8) return null;
      const stock = {};
      DENOMS.forEach((denom, index) => {
        stock[denom.key] = values[index] || 0;
      });
      stock.receipt = values[7] || 0;
      return stock;
    }

    function saveStock(stock) {
      const payload = {
        savedAt: new Date().toISOString(),
        stock,
      };
      localStorage.setItem(STOCK_STORAGE_KEY, JSON.stringify(payload));
      savedNote.textContent = `已紀錄上一次庫存：${new Date(payload.savedAt).toLocaleString("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      })}`;
    }

    function loadSavedStock() {
      try {
        const payload = JSON.parse(localStorage.getItem(STOCK_STORAGE_KEY) || "null");
        if (!payload?.stock) return null;
        return payload;
      } catch {
        return null;
      }
    }

    function renderStockFields() {
      stockGrid.innerHTML = [
        ...DENOMS.map((denom) => `
          <label class="money-field">
            <span>${denom.label}</span>
            <input
              id="${fieldId(denom.key)}"
              data-stock-input
              data-denom="${denom.key}"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              value="0"
              aria-label="${denom.label} 庫存數量"
            >
          </label>
        `),
        `<label class="money-field receipt">
          <span>收據</span>
          <input
            id="stock-receipt"
            data-stock-input
            data-denom="receipt"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            value="0"
            aria-label="收據金額"
          >
        </label>`,
      ].join("");
    }

    function renderCustomFields() {
      customInputGrid.innerHTML = DENOMS.map((denom) => `
        <label class="custom-cell">
          <span class="custom-head">${denom.label} 分配</span>
          <input
            id="${customFieldId(denom.key)}"
            data-custom-input
            data-denom="${denom.key}"
            type="number"
            step="1"
            inputmode="decimal"
            value="0"
            aria-label="${denom.label} 自行分配數量"
          >
        </label>
      `).join("");
      renderCustomTotals(readStock());
    }

    function renderSettingsFields() {
      targetTotalInput.value = String(settings.targetTotal);
      targetSettingsGrid.innerHTML = DENOMS.map((denom) => `
        <label class="money-field">
          <span>${denom.label}</span>
          <input
            id="${targetFieldId(denom.key)}"
            data-target-input
            data-denom="${denom.key}"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            value="${settings.target[denom.key] || 0}"
            aria-label="${denom.label} 目標數量"
          >
        </label>
      `).join("");
      renderSettingsCheck();
    }

    function diffLabel(diff, unit) {
      if (diff === 0) return `0${unit}`;
      return `${diff > 0 ? "+" : "-"}${Math.abs(diff)}${unit}`;
    }

    function renderDiff(stock) {
      diffGrid.innerHTML = DENOMS.map((denom) => {
        const diff = (settings.target[denom.key] || 0) - (stock[denom.key] || 0);
        const className = diff > 0 ? "add" : diff < 0 ? "remove" : "same";
        return `
          <div class="diff-cell">
            <div class="diff-head">${denom.label}</div>
            <div class="diff-value ${className}">${diffLabel(diff, denom.unit)}</div>
          </div>
        `;
      }).join("");
    }

    function renderCustomTotals(stock) {
      const adds = readCustomAdds();
      customTotalGrid.innerHTML = DENOMS.map((denom) => {
        const total = (stock[denom.key] || 0) + (adds[denom.key] || 0);
        return `
          <div class="custom-cell">
            <div class="custom-head total-head">${denom.label} 合計</div>
            <div class="custom-total ${total < 0 ? "negative" : ""}">${total}${denom.unit}</div>
          </div>
        `;
      }).join("");
      const cashTotal = stockCashTotal(stock);
      const addTotal = customAddCashTotal(adds);
      const finalTotal = cashTotal + addTotal;
      const balance = settings.targetTotal - finalTotal;
      document.getElementById("custom-add-total").textContent = formatCurrency(addTotal);
      document.getElementById("custom-balance-diff").textContent = formatCurrency(balance);
      customBalanceCard.classList.toggle("warn", balance !== 0);
    }

    function renderSettingsCheck() {
      const total = targetCashTotal();
      const diff = total - settings.targetTotal;
      settingsCheck.classList.toggle("warn", diff !== 0);
      settingsCheck.textContent = diff === 0
        ? `已對齊設定總額：${formatCurrency(total)}`
        : `目前比例合計 ${formatCurrency(total)}，與設定總額相差 ${formatCurrency(diff)}。`;
    }

    function calculate(shouldSave = true) {
      const stock = readStock();
      const cashTotal = stockCashTotal(stock);
      const receipt = stock.receipt || 0;
      const availableTotal = cashTotal + receipt;
      const balance = settings.targetTotal - availableTotal;

      document.getElementById("stock-total").textContent = formatCurrency(cashTotal);
      document.getElementById("receipt-total").textContent = formatCurrency(receipt);
      document.getElementById("available-total").textContent = formatCurrency(availableTotal);
      document.getElementById("balance-diff").textContent = formatCurrency(balance);
      balanceCard.classList.toggle("warn", balance !== 0);

      renderDiff(stock);
      renderCustomTotals(stock);
      document.getElementById("result-text").textContent = balance === 0
        ? "庫存加收據已對齊設定總額。"
        : `庫存加收據與設定總額相差 ${formatCurrency(balance)}。`;

      if (shouldSave) saveStock(stock);
    }

    async function pasteStock() {
      try {
        const text = await navigator.clipboard.readText();
        const parsed = parseStockLine(text);
        if (!parsed) {
          setStatus("貼上格式需要 8 個數字：1000、500、100、50、10、5、1、收據。", true);
          return;
        }
        setStock(parsed);
        setStatus("已貼上庫存資料。");
      } catch {
        setStatus("無法讀取剪貼簿，請直接點第一個欄位後貼上。", true);
      }
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function clearStock() {
      setStock(blankStock());
      clearCustomAdds();
      calculate();
      setStatus("庫存與收據已清空。");
    }

    function openSettings() {
      renderSettingsFields();
      settingsModal.classList.add("open");
    }

    function closeSettings() {
      settingsModal.classList.remove("open");
      calculate(false);
    }

    function updateSettingsFromInputs() {
      settings.targetTotal = parseCount(targetTotalInput.value);
      DENOMS.forEach((denom) => {
        settings.target[denom.key] = parseCount(document.getElementById(targetFieldId(denom.key))?.value);
      });
      saveSettings();
      renderSettingsCheck();
      calculate(false);
    }

    function resetSettings() {
      settings = normalizeSettings(DEFAULT_SETTINGS);
      saveSettings();
      renderSettingsFields();
      calculate(false);
      setStatus("分配設定已恢復預設。");
    }

    renderStockFields();
    renderCustomFields();
    renderSettingsFields();
    const saved = loadSavedStock();
    setStock(saved?.stock || blankStock(), false);
    if (saved?.savedAt) {
      savedNote.textContent = `已載入上一次庫存：${new Date(saved.savedAt).toLocaleString("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      })}`;
    } else {
      savedNote.textContent = "尚未紀錄庫存。";
    }

    document.body.addEventListener("input", (event) => {
      if (event.target.matches("[data-stock-input]")) calculate();
      if (event.target.matches("[data-custom-input]")) calculate(false);
      if (event.target.matches("#target-total-input, [data-target-input]")) updateSettingsFromInputs();
    });

    document.body.addEventListener("focusin", (event) => {
      if (event.target.matches("input")) setTimeout(() => event.target.select(), 0);
    });

    stockGrid.addEventListener("paste", (event) => {
      const text = event.clipboardData?.getData("text");
      const parsed = parseStockLine(text);
      if (!parsed) return;
      event.preventDefault();
      setStock(parsed);
      setStatus("已貼上庫存資料。");
    });

    document.getElementById("paste-stock").addEventListener("click", pasteStock);
    document.getElementById("clear-stock").addEventListener("click", clearStock);
    document.getElementById("settings-button").addEventListener("click", openSettings);
    document.getElementById("close-settings").addEventListener("click", closeSettings);
    document.getElementById("close-settings-bottom").addEventListener("click", closeSettings);
    document.getElementById("done-settings").addEventListener("click", closeSettings);
    document.getElementById("reset-settings").addEventListener("click", resetSettings);
    settingsModal.addEventListener("click", (event) => {
      if (event.target === settingsModal) closeSettings();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../../sw.js", { updateViaCache: "none" }).catch(() => undefined);
      });
    }
  </script>
</body>
</html>
