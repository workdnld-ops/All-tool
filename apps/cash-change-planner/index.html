<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>換鈔金分配</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#245b9b">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #245b9b;
      --primary-soft: #e7f0fb;
      --green: #1f6f64;
      --green-soft: #e4f0ee;
      --gold: #8a5a00;
      --gold-soft: #fff4d8;
      --danger: #b42318;
      --danger-soft: #fff5f4;
      --shadow: 0 7px 18px rgba(23, 33, 38, 0.06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    button,
    input { font: inherit; }

    input {
      min-width: 0;
      min-height: 36px;
      border: 1px solid #b8c6cc;
      border-radius: 8px;
      padding: 0 8px;
      background: #fff;
      color: var(--ink);
      text-align: center;
      font-weight: 850;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 91, 155, 0.16);
      outline: none;
    }

    .shell {
      width: min(980px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 8px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 42px;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.12;
    }

    h1 { font-size: 1.3rem; }
    h2 { font-size: 1rem; }

    .status {
      min-height: 16px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.3;
    }

    .button,
    .mini-button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .button { padding: 0 10px; }

    .mini-button {
      min-height: 30px;
      padding: 0 8px;
      font-size: 0.78rem;
      color: var(--primary);
      background: var(--primary-soft);
      border-color: transparent;
    }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.feedback {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }

    .header-actions,
    .actions,
    .quick-actions,
    .settings-grid,
    .summary {
      display: grid;
      gap: 6px;
    }

    .header-actions { grid-template-columns: 1fr; }
    .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .quick-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .panel,
    .metric,
    .row-card,
    .result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel,
    .result {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .section-title {
      display: grid;
      gap: 3px;
    }

    .section-title span,
    .metric span,
    .note {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.35;
    }

    .metric {
      min-height: 64px;
      padding: 8px;
      display: grid;
      gap: 2px;
      align-content: center;
      min-width: 0;
    }

    .metric strong {
      color: var(--primary);
      font-size: 1.12rem;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 850;
    }

    .denom-grid,
    .diff-list {
      display: grid;
      gap: 6px;
    }

    .denom-grid {
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .denom-field {
      display: grid;
      gap: 4px;
    }

    .denom-field span {
      min-height: 24px;
      border-radius: 8px;
      background: #eef2f4;
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 0.76rem;
      font-weight: 900;
    }

    .row-card {
      padding: 8px;
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr) 92px;
      gap: 8px;
      align-items: center;
    }

    .denom-name {
      font-size: 1rem;
      font-weight: 950;
    }

    .diff-main {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .diff-title {
      font-size: 0.9rem;
      font-weight: 950;
      line-height: 1.2;
    }

    .diff-meta {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.3;
    }

    .diff-value {
      text-align: right;
      font-size: 0.88rem;
      font-weight: 950;
      line-height: 1.2;
    }

    .row-card.add {
      border-color: rgba(31, 111, 100, 0.34);
      background: var(--green-soft);
    }

    .row-card.remove {
      border-color: rgba(138, 90, 0, 0.36);
      background: var(--gold-soft);
    }

    .row-card.same {
      background: #fbfcfc;
    }

    .result.ok {
      border-color: rgba(31, 111, 100, 0.34);
      background: var(--green-soft);
    }

    .result.warn {
      border-color: rgba(180, 35, 24, 0.34);
      background: var(--danger-soft);
    }

    @media (max-width: 760px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .denom-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 460px) {
      .shell { padding-left: 8px; padding-right: 8px; }
      header { grid-template-columns: 1fr; }
      h1 { font-size: 1.18rem; }
      .panel,
      .result { padding: 8px; }
      .actions { grid-template-columns: 1fr; }
      .quick-actions,
      .settings-grid { grid-template-columns: 1fr; }
      .denom-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .row-card { grid-template-columns: 48px minmax(0, 1fr) 76px; gap: 6px; }
      .diff-title { font-size: 0.82rem; }
      .diff-meta,
      .section-title span,
      .note { font-size: 0.7rem; }
      .diff-value { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>換鈔金分配</h1>
        <div class="status" id="status">預設用圖片第一列，目前總額 8572，目標補到 10000。</div>
      </div>
      <div class="header-actions">
        <a class="button" href="../../index.html">工具箱</a>
      </div>
    </header>

    <section class="summary" aria-label="總覽">
      <div class="metric">
        <span>目前總額</span>
        <strong id="current-total">$0</strong>
      </div>
      <div class="metric">
        <span>目標合計</span>
        <strong id="target-count-total">$0</strong>
      </div>
      <div class="metric">
        <span>目標金額</span>
        <strong id="desired-total-label">$10,000</strong>
      </div>
      <div class="metric">
        <span>淨增加</span>
        <strong id="net-total">$0</strong>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>目前數量</h2>
        <span>輸入現在手上的張數或枚數。下面兩個範例就是圖片裡的兩列。</span>
      </div>
      <div class="quick-actions">
        <button class="mini-button" type="button" data-current-preset="first">套用圖片第 1 列</button>
        <button class="mini-button" type="button" data-current-preset="second">套用圖片第 2 列</button>
      </div>
      <div class="denom-grid" id="current-grid"></div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>目標設定</h2>
        <span>千鈔和 500 預設為 0；100 預設至少 50 張，其餘會用 50、10、5、1 分散補足。</span>
      </div>
      <div class="settings-grid">
        <label>
          目標總額
          <input id="desired-total" type="number" min="0" step="1" inputmode="numeric" value="10000">
        </label>
        <label>
          100 至少幾張
          <input id="min-hundreds" type="number" min="0" step="1" inputmode="numeric" value="50">
        </label>
      </div>
      <button class="button primary" id="apply-suggestion" type="button">套用建議分配</button>
      <div class="denom-grid" id="target-grid"></div>
      <div class="note" id="target-note"></div>
    </section>

    <section class="result ok" id="result-panel">
      <div class="section-title">
        <h2 id="result-title">補充建議</h2>
        <span id="result-text">輸入數量後會自動計算要補進或拿出的張數。</span>
      </div>
      <div class="diff-list" id="diff-list"></div>
    </section>

    <div class="actions">
      <button class="button" id="reset-current" type="button">清空目前</button>
      <button class="button" id="copy-summary" type="button">複製明細</button>
      <button class="button primary" id="focus-target" type="button">回到目標</button>
    </div>
  </main>

  <script>
    const DENOMS = [
      { key: "1000", label: "1000", unit: "張", value: 1000 },
      { key: "500", label: "500", unit: "張", value: 500 },
      { key: "100", label: "100", unit: "張", value: 100 },
      { key: "50", label: "50", unit: "枚", value: 50 },
      { key: "10", label: "10", unit: "枚", value: 10 },
      { key: "5", label: "5", unit: "枚", value: 5 },
      { key: "1", label: "1", unit: "枚", value: 1 },
    ];

    const CURRENT_PRESETS = {
      first: { "1000": 5, "500": 0, "100": 23, "50": 16, "10": 17, "5": 60, "1": 2 },
      second: { "1000": 6, "500": 0, "100": 14, "50": 14, "10": 17, "5": 60, "1": 2 },
    };

    const DEFAULT_TARGET = {
      "1000": 0,
      "500": 0,
      "100": 50,
      "50": 40,
      "10": 200,
      "5": 160,
      "1": 200,
    };

    const currentGrid = document.getElementById("current-grid");
    const targetGrid = document.getElementById("target-grid");
    const desiredTotalInput = document.getElementById("desired-total");
    const minHundredsInput = document.getElementById("min-hundreds");
    const currentTotal = document.getElementById("current-total");
    const targetCountTotal = document.getElementById("target-count-total");
    const desiredTotalLabel = document.getElementById("desired-total-label");
    const netTotal = document.getElementById("net-total");
    const targetNote = document.getElementById("target-note");
    const resultPanel = document.getElementById("result-panel");
    const resultTitle = document.getElementById("result-title");
    const resultText = document.getElementById("result-text");
    const diffList = document.getElementById("diff-list");
    const status = document.getElementById("status");
    const copySummaryButton = document.getElementById("copy-summary");

    function parseCount(value) {
      const number = Number.parseInt(String(value || "").replace(/[^\d]/g, ""), 10);
      return Number.isFinite(number) && number > 0 ? number : 0;
    }

    function formatCurrency(value) {
      return `$${Math.round(Number(value) || 0).toLocaleString("zh-TW")}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fieldId(type, key) {
      return `${type}-${key}`;
    }

    function renderFields(container, type, values) {
      container.innerHTML = DENOMS.map((denom) => `
        <label class="denom-field">
          <span>${denom.label}</span>
          <input
            id="${fieldId(type, denom.key)}"
            data-type="${type}"
            data-denom="${denom.key}"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            value="${values[denom.key] || 0}"
            aria-label="${denom.label} ${type === "current" ? "目前數量" : "目標數量"}"
          >
        </label>
      `).join("");
    }

    function readValues(type) {
      return Object.fromEntries(DENOMS.map((denom) => {
        const input = document.getElementById(fieldId(type, denom.key));
        return [denom.key, parseCount(input?.value)];
      }));
    }

    function setValues(type, values) {
      DENOMS.forEach((denom) => {
        const input = document.getElementById(fieldId(type, denom.key));
        if (input) input.value = String(values[denom.key] || 0);
      });
      calculate();
    }

    function valueOf(values) {
      return DENOMS.reduce((sum, denom) => sum + (parseCount(values[denom.key]) * denom.value), 0);
    }

    function suggestedTarget() {
      const desired = parseCount(desiredTotalInput.value) || 10000;
      const minHundreds = parseCount(minHundredsInput.value);
      const target = { "1000": 0, "500": 0, "100": minHundreds, "50": 0, "10": 0, "5": 0, "1": 0 };
      let remaining = desired - (minHundreds * 100);
      if (remaining < 0) return null;

      const shares = [
        { key: "50", value: 50, share: 0.4 },
        { key: "10", value: 10, share: 0.4 },
        { key: "5", value: 5, share: 0.16 },
      ];

      shares.forEach((item) => {
        const amount = Math.floor((remaining * item.share) / item.value) * item.value;
        target[item.key] = amount / item.value;
        remaining -= amount;
      });
      target["1"] = remaining;
      return target;
    }

    function renderDiff(current, target) {
      const rows = DENOMS.map((denom) => {
        const currentCount = parseCount(current[denom.key]);
        const targetCount = parseCount(target[denom.key]);
        const diff = targetCount - currentCount;
        const abs = Math.abs(diff);
        const value = abs * denom.value;
        const stateClass = diff > 0 ? "add" : diff < 0 ? "remove" : "same";
        const action = diff > 0 ? "補進" : diff < 0 ? "拿出" : "不用調整";
        const title = diff === 0
          ? `${denom.label} 維持 ${currentCount}${denom.unit}`
          : `${action} ${abs}${denom.unit} ${denom.label}`;
        return `
          <article class="row-card ${stateClass}">
            <div class="denom-name">${denom.label}</div>
            <div class="diff-main">
              <div class="diff-title">${escapeHtml(title)}</div>
              <div class="diff-meta">目前 ${currentCount}${denom.unit}，目標 ${targetCount}${denom.unit}</div>
            </div>
            <div class="diff-value">${diff === 0 ? "$0" : formatCurrency(value)}</div>
          </article>
        `;
      });
      diffList.innerHTML = rows.join("");
    }

    function buildSummary(data) {
      const lines = [
        "換鈔金分配建議",
        "",
        `目前總額：${formatCurrency(data.currentTotal)}`,
        `目標合計：${formatCurrency(data.targetTotal)}`,
        `淨增加：${formatCurrency(data.net)}`,
        `需要補進：${formatCurrency(data.addTotal)}`,
        `需要拿出：${formatCurrency(data.removeTotal)}`,
        "",
        "目標數量：",
        ...DENOMS.map((denom) => `${denom.label}：${data.target[denom.key] || 0}${denom.unit}`),
        "",
        "調整明細：",
        ...DENOMS.map((denom) => {
          const diff = (data.target[denom.key] || 0) - (data.current[denom.key] || 0);
          if (diff === 0) return `${denom.label}：不用調整`;
          return `${denom.label}：${diff > 0 ? "補進" : "拿出"} ${Math.abs(diff)}${denom.unit}`;
        }),
      ];
      return lines.join("\n");
    }

    let lastSummary = "";

    function calculate() {
      const current = readValues("current");
      const target = readValues("target");
      const desired = parseCount(desiredTotalInput.value) || 0;
      const currentValue = valueOf(current);
      const targetValue = valueOf(target);
      const net = targetValue - currentValue;
      let addTotal = 0;
      let removeTotal = 0;

      DENOMS.forEach((denom) => {
        const diff = (target[denom.key] || 0) - (current[denom.key] || 0);
        if (diff > 0) addTotal += diff * denom.value;
        if (diff < 0) removeTotal += Math.abs(diff) * denom.value;
      });

      currentTotal.textContent = formatCurrency(currentValue);
      targetCountTotal.textContent = formatCurrency(targetValue);
      desiredTotalLabel.textContent = formatCurrency(desired);
      netTotal.textContent = formatCurrency(net);
      renderDiff(current, target);

      const data = { current, target, currentTotal: currentValue, targetTotal: targetValue, net, addTotal, removeTotal };
      lastSummary = buildSummary(data);

      resultPanel.classList.toggle("warn", targetValue !== desired);
      resultPanel.classList.toggle("ok", targetValue === desired);
      if (targetValue !== desired) {
        resultTitle.textContent = "目標合計還沒對齊";
        resultText.textContent = `目前目標數量加起來是 ${formatCurrency(targetValue)}，和目標金額 ${formatCurrency(desired)} 差 ${formatCurrency(targetValue - desired)}。`;
      } else {
        resultTitle.textContent = "補充建議";
        resultText.textContent = `需要補進 ${formatCurrency(addTotal)}，拿出 ${formatCurrency(removeTotal)}，淨增加 ${formatCurrency(net)}。`;
      }

      const hundredCount = target["100"] || 0;
      const minHundreds = parseCount(minHundredsInput.value);
      targetNote.textContent = `目前 100 元目標 ${hundredCount} 張，${hundredCount >= minHundreds ? "已達到" : "還沒達到"}至少 ${minHundreds} 張的設定。`;
    }

    function applySuggestion() {
      const suggestion = suggestedTarget();
      if (!suggestion) {
        status.textContent = "100 元張數太高，已經超過目標總額。";
        status.style.color = "var(--danger)";
        return;
      }
      setValues("target", suggestion);
      status.textContent = "已套用建議分配。";
      status.style.color = "var(--muted)";
    }

    async function copySummary() {
      try {
        await navigator.clipboard.writeText(lastSummary);
        flashCopyButton("已複製");
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = lastSummary;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.append(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        flashCopyButton("已複製");
      }
    }

    function flashCopyButton(label) {
      const original = copySummaryButton.dataset.originalLabel || copySummaryButton.textContent;
      copySummaryButton.dataset.originalLabel = original;
      window.clearTimeout(Number(copySummaryButton.dataset.timer || 0));
      copySummaryButton.textContent = label;
      copySummaryButton.classList.add("feedback");
      copySummaryButton.dataset.timer = String(window.setTimeout(() => {
        copySummaryButton.textContent = original;
        copySummaryButton.classList.remove("feedback");
      }, 1300));
    }

    renderFields(currentGrid, "current", CURRENT_PRESETS.first);
    renderFields(targetGrid, "target", DEFAULT_TARGET);
    calculate();

    document.body.addEventListener("input", (event) => {
      if (event.target.matches("input")) calculate();
    });

    document.body.addEventListener("focusin", (event) => {
      if (event.target.matches("input")) setTimeout(() => event.target.select(), 0);
    });

    document.body.addEventListener("click", (event) => {
      const presetButton = event.target.closest("[data-current-preset]");
      if (presetButton) {
        setValues("current", CURRENT_PRESETS[presetButton.dataset.currentPreset]);
        status.textContent = presetButton.dataset.currentPreset === "first"
          ? "已套用圖片第 1 列。"
          : "已套用圖片第 2 列。";
        status.style.color = "var(--muted)";
      }
    });

    document.getElementById("apply-suggestion").addEventListener("click", applySuggestion);
    document.getElementById("reset-current").addEventListener("click", () => setValues("current", {}));
    document.getElementById("copy-summary").addEventListener("click", copySummary);
    document.getElementById("focus-target").addEventListener("click", () => {
      document.getElementById("target-100").focus();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../../sw.js", { updateViaCache: "none" }).catch(() => undefined);
      });
    }
  </script>
</body>
</html>
