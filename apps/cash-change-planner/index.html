<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>換鈔金分配</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#245b9b">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --field-line: #b8c6cc;
      --primary: #245b9b;
      --primary-soft: #e7f0fb;
      --green: #1f6f64;
      --green-soft: #e4f0ee;
      --gold: #8a5a00;
      --gold-soft: #fff4d8;
      --danger: #b42318;
      --danger-soft: #fff5f4;
      --shadow: 0 7px 18px rgba(23, 33, 38, 0.06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    button,
    input { font: inherit; }

    input {
      min-width: 0;
      min-height: 40px;
      border: 1px solid var(--field-line);
      border-radius: 8px;
      padding: 0 8px;
      background: #fff;
      color: var(--ink);
      text-align: center;
      font-weight: 900;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 91, 155, 0.16);
      outline: none;
    }

    .shell {
      width: min(1060px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 8px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 42px;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.12;
    }

    h1 { font-size: 1.3rem; }
    h2 { font-size: 1rem; }

    .status {
      min-height: 16px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.3;
    }

    .button,
    .mini-button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .button { padding: 0 10px; }

    .mini-button {
      min-height: 30px;
      padding: 0 8px;
      font-size: 0.78rem;
      color: var(--primary);
      background: var(--primary-soft);
      border-color: transparent;
    }

    .button.primary,
    .mini-button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.danger {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .button.feedback {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }

    .header-actions,
    .actions,
    .quick-actions,
    .summary {
      display: grid;
      gap: 6px;
    }

    .header-actions { grid-template-columns: 1fr; }
    .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .quick-actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .panel,
    .metric,
    .result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel,
    .result {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .section-title {
      display: grid;
      gap: 3px;
    }

    .section-title span,
    .metric span,
    .note {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.35;
    }

    .metric {
      min-height: 64px;
      padding: 8px;
      display: grid;
      gap: 2px;
      align-content: center;
      min-width: 0;
    }

    .metric strong {
      color: var(--primary);
      font-size: 1.12rem;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .money-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px;
    }

    .money-field {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .money-field span,
    .diff-head {
      min-height: 28px;
      border-radius: 8px;
      background: #eef2f4;
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 0.76rem;
      font-weight: 950;
      text-align: center;
    }

    .money-field.receipt span {
      color: var(--gold);
      background: var(--gold-soft);
    }

    .diff-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .diff-cell {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .diff-value {
      min-height: 40px;
      border: 1px solid var(--field-line);
      border-radius: 8px;
      background: #fbfcfc;
      display: grid;
      place-items: center;
      padding: 0 6px;
      font-size: 0.9rem;
      font-weight: 950;
      text-align: center;
      white-space: nowrap;
    }

    .diff-value.add {
      border-color: rgba(31, 111, 100, 0.34);
      background: var(--green-soft);
      color: var(--green);
    }

    .diff-value.remove {
      border-color: rgba(138, 90, 0, 0.38);
      background: var(--gold-soft);
      color: var(--gold);
    }

    .diff-value.same {
      color: var(--muted);
    }

    .target-display {
      min-height: 40px;
      border: 1px solid var(--field-line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      place-items: center;
      padding: 0 6px;
      font-size: 0.92rem;
      font-weight: 950;
      text-align: center;
    }

    .result.ok {
      border-color: rgba(31, 111, 100, 0.34);
      background: var(--green-soft);
    }

    @media (max-width: 860px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .money-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .diff-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .quick-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 460px) {
      .shell { padding-left: 8px; padding-right: 8px; }
      header { grid-template-columns: 1fr; }
      h1 { font-size: 1.18rem; }
      .panel,
      .result { padding: 8px; }
      .actions,
      .quick-actions { grid-template-columns: 1fr; }
      .money-grid,
      .diff-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .section-title span,
      .metric span,
      .note { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>換鈔金分配</h1>
        <div class="status" id="status">輸入庫存數量與收據金額，自動算出補到固定 $10,000 的建議。</div>
      </div>
      <div class="header-actions">
        <a class="button" href="../../index.html">工具箱</a>
      </div>
    </header>

    <section class="summary" aria-label="總覽">
      <div class="metric">
        <span>庫存現金</span>
        <strong id="stock-total">$0</strong>
      </div>
      <div class="metric">
        <span>收據金額</span>
        <strong id="receipt-total">$0</strong>
      </div>
      <div class="metric">
        <span>庫存 + 收據</span>
        <strong id="available-total">$0</strong>
      </div>
      <div class="metric">
        <span>固定目標</span>
        <strong>$10,000</strong>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>庫存數量</h2>
        <span>可直接貼上：1000、500、100、50、10、5、1、收據，欄位之間用 Tab 或空白分隔。</span>
      </div>
      <div class="quick-actions">
        <button class="mini-button primary" id="paste-stock" type="button">貼上庫存資料</button>
        <button class="mini-button" id="copy-stock" type="button">複製庫存資料</button>
        <button class="mini-button" id="restore-stock" type="button">帶入上次庫存</button>
        <button class="mini-button" id="clear-stock" type="button">庫存與收據清空</button>
      </div>
      <div class="money-grid" id="stock-grid"></div>
      <div class="note" id="saved-note"></div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>固定分配比例</h2>
        <span>總額一律 $10,000。</span>
      </div>
      <div class="diff-grid" id="target-grid"></div>
    </section>

    <section class="result ok">
      <div class="section-title">
        <h2>補充建議</h2>
        <span id="result-text">下方直接顯示各幣種要拿出或補進的數量。</span>
      </div>
      <div class="diff-grid" id="diff-grid"></div>
    </section>

    <div class="actions">
      <button class="button" id="copy-summary" type="button">複製明細</button>
      <button class="button" id="copy-diff" type="button">複製建議列</button>
      <button class="button danger" id="clear-stock-bottom" type="button">庫存與收據清空</button>
    </div>
  </main>

  <script>
    const DENOMS = [
      { key: "1000", label: "1000", unit: "張", value: 1000 },
      { key: "500", label: "500", unit: "張", value: 500 },
      { key: "100", label: "100", unit: "張", value: 100 },
      { key: "50", label: "50", unit: "枚", value: 50 },
      { key: "10", label: "10", unit: "枚", value: 10 },
      { key: "5", label: "5", unit: "枚", value: 5 },
      { key: "1", label: "1", unit: "枚", value: 1 },
    ];

    const TARGET = {
      "1000": 0,
      "500": 0,
      "100": 60,
      "50": 50,
      "10": 100,
      "5": 80,
      "1": 100,
    };
    const TARGET_TOTAL = 10000;
    const STORAGE_KEY = "cashChangePlannerStockV2";

    const stockGrid = document.getElementById("stock-grid");
    const targetGrid = document.getElementById("target-grid");
    const diffGrid = document.getElementById("diff-grid");
    const status = document.getElementById("status");
    const savedNote = document.getElementById("saved-note");
    const copySummaryButton = document.getElementById("copy-summary");
    const copyDiffButton = document.getElementById("copy-diff");

    let lastSummary = "";
    let lastDiffLine = "";

    function parseCount(value) {
      const number = Number.parseInt(String(value || "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(number) && number > 0 ? number : 0;
    }

    function formatCurrency(value) {
      return `$${Math.round(Number(value) || 0).toLocaleString("zh-TW")}`;
    }

    function fieldId(key) {
      return `stock-${key}`;
    }

    function stockKeys() {
      return [...DENOMS.map((denom) => denom.key), "receipt"];
    }

    function blankStock() {
      return Object.fromEntries(stockKeys().map((key) => [key, 0]));
    }

    function readStock() {
      const values = Object.fromEntries(DENOMS.map((denom) => {
        const input = document.getElementById(fieldId(denom.key));
        return [denom.key, parseCount(input?.value)];
      }));
      values.receipt = parseCount(document.getElementById("stock-receipt")?.value);
      return values;
    }

    function setStock(values, shouldSave = true) {
      const next = { ...blankStock(), ...(values || {}) };
      DENOMS.forEach((denom) => {
        const input = document.getElementById(fieldId(denom.key));
        if (input) input.value = String(parseCount(next[denom.key]));
      });
      const receipt = document.getElementById("stock-receipt");
      if (receipt) receipt.value = String(parseCount(next.receipt));
      calculate(shouldSave);
    }

    function stockCashTotal(stock) {
      return DENOMS.reduce((sum, denom) => sum + (parseCount(stock[denom.key]) * denom.value), 0);
    }

    function stockDataLine(stock) {
      return [...DENOMS.map((denom) => stock[denom.key] || 0), stock.receipt || 0].join("\t");
    }

    function parseStockLine(text) {
      const values = String(text || "")
        .trim()
        .split(/[\t,\s]+/)
        .filter(Boolean)
        .map(parseCount);
      if (values.length < 8) return null;
      const stock = {};
      DENOMS.forEach((denom, index) => {
        stock[denom.key] = values[index] || 0;
      });
      stock.receipt = values[7] || 0;
      return stock;
    }

    function saveStock(stock) {
      const payload = {
        savedAt: new Date().toISOString(),
        stock,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      savedNote.textContent = `已紀錄上一次庫存：${new Date(payload.savedAt).toLocaleString("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      })}`;
    }

    function loadSavedStock() {
      try {
        const payload = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!payload?.stock) return null;
        return payload;
      } catch {
        return null;
      }
    }

    function renderStockFields() {
      stockGrid.innerHTML = [
        ...DENOMS.map((denom) => `
          <label class="money-field">
            <span>${denom.label}</span>
            <input
              id="${fieldId(denom.key)}"
              data-stock-input
              data-denom="${denom.key}"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              value="0"
              aria-label="${denom.label} 庫存數量"
            >
          </label>
        `),
        `<label class="money-field receipt">
          <span>收據</span>
          <input
            id="stock-receipt"
            data-stock-input
            data-denom="receipt"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            value="0"
            aria-label="收據金額"
          >
        </label>`,
      ].join("");
    }

    function renderTarget() {
      targetGrid.innerHTML = DENOMS.map((denom) => `
        <div class="diff-cell">
          <div class="diff-head">${denom.label}</div>
          <div class="target-display">${TARGET[denom.key]}${denom.unit}</div>
        </div>
      `).join("");
    }

    function diffLabel(diff, unit) {
      if (diff === 0) return `0${unit}`;
      return `${diff > 0 ? "+" : "-"}${Math.abs(diff)}${unit}`;
    }

    function renderDiff(stock) {
      diffGrid.innerHTML = DENOMS.map((denom) => {
        const diff = (TARGET[denom.key] || 0) - (stock[denom.key] || 0);
        const className = diff > 0 ? "add" : diff < 0 ? "remove" : "same";
        return `
          <div class="diff-cell">
            <div class="diff-head">${denom.label}</div>
            <div class="diff-value ${className}">${diffLabel(diff, denom.unit)}</div>
          </div>
        `;
      }).join("");
    }

    function buildSummary(stock) {
      const diffs = Object.fromEntries(DENOMS.map((denom) => [
        denom.key,
        (TARGET[denom.key] || 0) - (stock[denom.key] || 0),
      ]));
      const stockTotal = stockCashTotal(stock);
      const availableTotal = stockTotal + (stock.receipt || 0);
      return [
        "換鈔金分配建議",
        "",
        `庫存現金：${formatCurrency(stockTotal)}`,
        `收據金額：${formatCurrency(stock.receipt || 0)}`,
        `庫存 + 收據：${formatCurrency(availableTotal)}`,
        `固定目標：${formatCurrency(TARGET_TOTAL)}`,
        "",
        `庫存列：${stockDataLine(stock)}`,
        `建議列：${DENOMS.map((denom) => diffLabel(diffs[denom.key], denom.unit)).join("\t")}`,
        "",
        "固定分配：",
        ...DENOMS.map((denom) => `${denom.label}：${TARGET[denom.key]}${denom.unit}`),
      ].join("\n");
    }

    function calculate(shouldSave = true) {
      const stock = readStock();
      const cashTotal = stockCashTotal(stock);
      const receipt = stock.receipt || 0;
      const availableTotal = cashTotal + receipt;

      document.getElementById("stock-total").textContent = formatCurrency(cashTotal);
      document.getElementById("receipt-total").textContent = formatCurrency(receipt);
      document.getElementById("available-total").textContent = formatCurrency(availableTotal);

      renderDiff(stock);
      lastDiffLine = DENOMS.map((denom) => {
        const diff = (TARGET[denom.key] || 0) - (stock[denom.key] || 0);
        return diffLabel(diff, denom.unit);
      }).join("\t");
      lastSummary = buildSummary(stock);

      const difference = TARGET_TOTAL - availableTotal;
      document.getElementById("result-text").textContent = difference === 0
        ? "庫存加收據剛好 $10,000。"
        : `庫存加收據與 $10,000 相差 ${formatCurrency(difference)}。`;

      if (shouldSave) saveStock(stock);
    }

    async function pasteStock() {
      try {
        const text = await navigator.clipboard.readText();
        const parsed = parseStockLine(text);
        if (!parsed) {
          setStatus("貼上格式需要 8 個數字：1000、500、100、50、10、5、1、收據。", true);
          return;
        }
        setStock(parsed);
        setStatus("已貼上庫存資料。");
      } catch {
        setStatus("無法讀取剪貼簿，請直接點第一個欄位後貼上。", true);
      }
    }

    async function copyText(text, button, label = "已複製") {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.append(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
      flashButton(button, label);
    }

    function flashButton(button, label) {
      const original = button.dataset.originalLabel || button.textContent;
      button.dataset.originalLabel = original;
      window.clearTimeout(Number(button.dataset.timer || 0));
      button.textContent = label;
      button.classList.add("feedback");
      button.dataset.timer = String(window.setTimeout(() => {
        button.textContent = original;
        button.classList.remove("feedback");
      }, 1300));
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function restoreSavedStock() {
      const saved = loadSavedStock();
      if (!saved?.stock) {
        setStatus("目前沒有上一次庫存紀錄。", true);
        return;
      }
      setStock(saved.stock, false);
      setStatus("已帶入上一次庫存。");
    }

    function clearStock() {
      setStock(blankStock());
      setStatus("庫存與收據已清空。");
    }

    renderStockFields();
    renderTarget();
    const saved = loadSavedStock();
    setStock(saved?.stock || blankStock(), false);
    if (saved?.savedAt) {
      savedNote.textContent = `已載入上一次庫存：${new Date(saved.savedAt).toLocaleString("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      })}`;
    } else {
      savedNote.textContent = "尚未紀錄庫存。";
    }

    document.body.addEventListener("input", (event) => {
      if (event.target.matches("[data-stock-input]")) calculate();
    });

    document.body.addEventListener("focusin", (event) => {
      if (event.target.matches("input")) setTimeout(() => event.target.select(), 0);
    });

    stockGrid.addEventListener("paste", (event) => {
      const text = event.clipboardData?.getData("text");
      const parsed = parseStockLine(text);
      if (!parsed) return;
      event.preventDefault();
      setStock(parsed);
      setStatus("已貼上庫存資料。");
    });

    document.getElementById("paste-stock").addEventListener("click", pasteStock);
    document.getElementById("copy-stock").addEventListener("click", () => copyText(stockDataLine(readStock()), document.getElementById("copy-stock")));
    document.getElementById("restore-stock").addEventListener("click", restoreSavedStock);
    document.getElementById("clear-stock").addEventListener("click", clearStock);
    document.getElementById("clear-stock-bottom").addEventListener("click", clearStock);
    copySummaryButton.addEventListener("click", () => copyText(lastSummary, copySummaryButton));
    copyDiffButton.addEventListener("click", () => copyText(lastDiffLine, copyDiffButton));

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../../sw.js", { updateViaCache: "none" }).catch(() => undefined);
      });
    }
  </script>
</body>
</html>
