<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>排休紀錄</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --primary-soft: #e4f0ee;
      --blue: #245b9b;
      --blue-soft: #e7f0fb;
      --rose: #9a3d55;
      --rose-soft: #fbe8ee;
      --danger: #b42318;
      --danger-soft: #fff5f4;
      --shadow: 0 6px 18px rgba(23, 33, 38, 0.06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    button,
    input,
    textarea { font: inherit; }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    .shell {
      width: min(860px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 8px;
    }

    header {
      min-height: 42px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.28rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .status {
      min-height: 16px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .button,
    .chip {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .button {
      padding: 0 10px;
    }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.feedback {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .button.feedback-error {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .panel,
    .result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 9px;
      display: grid;
      gap: 8px;
    }

    .top-actions,
    .form-grid,
    .action-grid,
    .summary-grid {
      display: grid;
      gap: 6px;
    }

    .top-actions,
    .action-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .form-grid {
      grid-template-columns: 148px 92px minmax(0, 1fr);
      align-items: end;
    }

    .summary-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 850;
    }

    .checkbox-label {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 9px;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 7px;
      background: #fbfcfc;
      color: var(--ink);
      font-size: 0.9rem;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #b8c6cc;
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font-weight: 750;
      min-width: 0;
    }

    input {
      min-height: 36px;
      padding: 0 9px;
    }

    input[type="checkbox"] {
      width: 18px;
      min-width: 18px;
      height: 18px;
      min-height: 18px;
      padding: 0;
      accent-color: var(--primary);
    }

    textarea {
      min-height: 224px;
      resize: vertical;
      padding: 9px;
      line-height: 1.35;
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.16);
      outline: none;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      min-height: 30px;
      padding: 0 9px;
      color: var(--blue);
      background: var(--blue-soft);
      border-color: transparent;
      font-size: 0.78rem;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      display: grid;
      gap: 3px;
      background: #fbfcfc;
      min-width: 0;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .metric strong {
      font-size: 1rem;
      line-height: 1.15;
      word-break: break-word;
    }

    .result {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-color: rgba(31, 111, 100, 0.35);
      background: var(--primary-soft);
    }

    .result.empty {
      border-color: rgba(154, 61, 85, 0.28);
      background: var(--rose-soft);
    }

    .result-title {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 900;
    }

    .output {
      min-height: 42px;
      font-size: 1.08rem;
      line-height: 1.55;
      font-weight: 900;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      -webkit-user-select: text;
      user-select: text;
    }

    @media (max-width: 620px) {
      h1 { font-size: 1.18rem; }
      .form-grid,
      .summary-grid { grid-template-columns: 1fr; }
      .button { padding: 0 8px; }
      textarea { min-height: 210px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>排休紀錄</h1>
        <div class="status" id="status">尚未貼上內容</div>
      </div>
      <div class="top-actions">
        <a class="button" href="../../index.html">工具箱</a>
      </div>
    </header>

    <section class="panel">
      <div class="form-grid">
        <label>
          月份
          <input id="month-input" type="month" aria-label="月份">
        </label>
        <label class="checkbox-label">
          <input id="planned-input" type="checkbox">
          預計
        </label>
        <label>
          休假文字
          <input id="keywords-input" type="text" aria-label="休假文字">
        </label>
      </div>
      <textarea id="sheet-input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="貼上 Google Sheet 內容" aria-label="貼上 Google Sheet 內容"></textarea>
      <div class="chip-list" id="keyword-list" aria-label="休假文字清單"></div>
    </section>

    <section class="summary-grid" aria-label="摘要">
      <div class="metric">
        <span>貼上列數</span>
        <strong id="row-count">0 列</strong>
      </div>
      <div class="metric">
        <span>休假天數</span>
        <strong id="day-count">0 天</strong>
      </div>
      <div class="metric">
        <span>日期來源</span>
        <strong id="date-source">月份</strong>
      </div>
    </section>

    <section class="result empty" id="result-panel" aria-label="輸出結果">
      <div class="result-title">Line 文字</div>
      <div class="output" id="output">尚無休假日期</div>
    </section>

    <div class="action-grid">
      <button class="button" id="clear-button" type="button">清空</button>
      <button class="button primary" id="copy-button" type="button">複製</button>
    </div>
  </main>

  <script>
    const DEFAULT_KEYWORDS = [
      "特休",
      "優先",
      "次優",
      "排休",
      "公假",
      "事假休",
      "滑雪假休",
      "年假例休",
      "家庭照護假",
    ];

    const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

    const monthInput = document.getElementById("month-input");
    const plannedInput = document.getElementById("planned-input");
    const keywordsInput = document.getElementById("keywords-input");
    const sheetInput = document.getElementById("sheet-input");
    const keywordList = document.getElementById("keyword-list");
    const status = document.getElementById("status");
    const rowCount = document.getElementById("row-count");
    const dayCount = document.getElementById("day-count");
    const dateSource = document.getElementById("date-source");
    const resultPanel = document.getElementById("result-panel");
    const output = document.getElementById("output");
    const copyButton = document.getElementById("copy-button");
    const MONTH_STORAGE_KEY = "dayOffRecordSelectedMonth";

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function setDefaultMonth() {
      const savedMonth = localStorage.getItem(MONTH_STORAGE_KEY);
      if (/^\d{4}-\d{2}$/.test(savedMonth || "")) {
        monthInput.value = savedMonth;
        return;
      }
      const now = new Date();
      monthInput.value = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
    }

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFKC")
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "")
        .trim();
    }

    function keywords() {
      const entered = keywordsInput.value
        .split(/[、,\s]+/g)
        .map(normalizeText)
        .filter(Boolean);
      return entered.length > 0 ? entered : DEFAULT_KEYWORDS;
    }

    function renderKeywords() {
      keywordList.innerHTML = keywords()
        .map((keyword) => `<span class="chip">${escapeHtml(keyword)}</span>`)
        .join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function parseMonthValue() {
      const match = /^(\d{4})-(\d{2})$/.exec(monthInput.value);
      if (!match) {
        const now = new Date();
        return { year: now.getFullYear(), month: now.getMonth() + 1 };
      }
      return { year: Number(match[1]), month: Number(match[2]) };
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function isValidDate(year, month, day) {
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
    }

    function parseDateFromCells(cells, fallbackYear, fallbackMonth) {
      const joined = cells.map(normalizeText).join(" ");
      const full = joined.match(/(?<!\d)(20\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})(?!\d)/);
      if (full) {
        const year = Number(full[1]);
        const month = Number(full[2]);
        const day = Number(full[3]);
        if (isValidDate(year, month, day)) return { year, month, day, explicit: true };
      }

      const monthDay = joined.match(/(?<!\d)(\d{1,2})\s*(?:\/|月)\s*(\d{1,2})\s*(?:日)?(?!\d)/);
      if (monthDay) {
        const month = Number(monthDay[1]);
        const day = Number(monthDay[2]);
        if (isValidDate(fallbackYear, month, day)) {
          return { year: fallbackYear, month, day, explicit: true };
        }
      }

      const dayOnly = joined.match(/(?<!\d)(\d{1,2})\s*日(?!\d)/);
      if (dayOnly) {
        const day = Number(dayOnly[1]);
        if (isValidDate(fallbackYear, fallbackMonth, day)) {
          return { year: fallbackYear, month: fallbackMonth, day, explicit: true };
        }
      }

      return null;
    }

    function hasLeaveText(cells, leaveKeywords) {
      const text = normalizeText(cells.join(" "));
      return leaveKeywords.some((keyword) => text.includes(keyword));
    }

    function formatDate(dateInfo) {
      const date = new Date(dateInfo.year, dateInfo.month - 1, dateInfo.day);
      return `${dateInfo.month}/${dateInfo.day}(${WEEKDAYS[date.getDay()]})`;
    }

    function dateTime(dateInfo) {
      return new Date(dateInfo.year, dateInfo.month - 1, dateInfo.day).getTime();
    }

    function formatDateGroups(dates) {
      const groups = [];
      let currentGroup = [];
      dates.forEach((dateInfo) => {
        const previous = currentGroup[currentGroup.length - 1];
        const isContinuous = previous && dateTime(dateInfo) - dateTime(previous) === 86400000;
        if (!previous || isContinuous) {
          currentGroup.push(dateInfo);
          return;
        }
        groups.push(currentGroup);
        currentGroup = [dateInfo];
      });
      if (currentGroup.length > 0) groups.push(currentGroup);
      return groups
        .map((group) => group.map(formatDate).join("、"))
        .join("\n");
    }

    function formatOutput(dates) {
      const groupedDates = formatDateGroups(dates);
      if (!groupedDates) return "";
      const { month } = parseMonthValue();
      const title = plannedInput.checked ? `${month}月預計休假：` : `${month}月休假：`;
      return `${title}\n${groupedDates}`;
    }

    function parseRows() {
      const rawText = sheetInput.value.replace(/\r/g, "").replace(/\n$/g, "");
      const rawRows = rawText ? rawText.split("\n") : [];
      const rows = rawRows.map((line) => line.split("\t"));
      const { year, month } = parseMonthValue();
      const leaveKeywords = keywords();
      const maxDay = daysInMonth(year, month);
      const matches = [];
      let explicitDateCount = 0;

      rows.forEach((cells, index) => {
        if (!hasLeaveText(cells, leaveKeywords)) return;
        const explicitDate = parseDateFromCells(cells, year, month);
        let dateInfo = explicitDate;
        if (dateInfo) {
          explicitDateCount += 1;
        } else {
          const day = index + 1;
          if (day < 1 || day > maxDay) return;
          dateInfo = { year, month, day, explicit: false };
        }
        matches.push(dateInfo);
      });

      const unique = [];
      const seen = new Set();
      for (const item of matches) {
        const key = `${item.year}-${item.month}-${item.day}`;
        if (seen.has(key)) continue;
        seen.add(key);
        unique.push(item);
      }
      unique.sort((a, b) => new Date(a.year, a.month - 1, a.day) - new Date(b.year, b.month - 1, b.day));
      return { rows, dates: unique, explicitDateCount };
    }

    function render() {
      renderKeywords();
      const result = parseRows();
      const text = formatOutput(result.dates);
      rowCount.textContent = `${result.rows.length} 列`;
      dayCount.textContent = `${result.dates.length} 天`;
      dateSource.textContent = result.explicitDateCount > 0 ? "表格" : "月份";
      output.textContent = text || "尚無休假日期";
      resultPanel.classList.toggle("empty", !text);
      status.textContent = text ? `已整理 ${result.dates.length} 天` : "尚無符合的休假文字";
    }

    function flashButton(button, label, isError = false) {
      const original = button.dataset.originalLabel || button.textContent;
      button.dataset.originalLabel = original;
      window.clearTimeout(Number(button.dataset.feedbackTimer || 0));
      button.textContent = label;
      button.classList.toggle("feedback", !isError);
      button.classList.toggle("feedback-error", isError);
      button.dataset.feedbackTimer = String(window.setTimeout(() => {
        button.textContent = original;
        button.classList.remove("feedback", "feedback-error");
      }, 1500));
    }

    async function copyOutput() {
      const text = output.textContent === "尚無休假日期" ? "" : output.textContent;
      if (!text) {
        flashButton(copyButton, "沒有內容", true);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        flashButton(copyButton, "已複製");
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.append(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        flashButton(copyButton, copied ? "已複製" : "複製失敗", !copied);
      }
    }

    setDefaultMonth();
    keywordsInput.value = DEFAULT_KEYWORDS.join("、");
    [monthInput, plannedInput, keywordsInput, sheetInput].forEach((input) => input.addEventListener("input", render));
    monthInput.addEventListener("input", () => {
      if (/^\d{4}-\d{2}$/.test(monthInput.value)) {
        localStorage.setItem(MONTH_STORAGE_KEY, monthInput.value);
      }
    });
    document.getElementById("clear-button").addEventListener("click", () => {
      sheetInput.value = "";
      render();
      sheetInput.focus();
    });
    copyButton.addEventListener("click", copyOutput);
    render();
  </script>
</body>
</html>
