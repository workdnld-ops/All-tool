<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>簽單耗材統計 PWA</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1041/1041888.png">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1041/1041888.png">
    
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --peak: #e74c3c; --off: #27ae60; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 15px; margin: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        button, select, .container, .stat-card, .day-tag { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        textarea, input { -webkit-user-select: text; user-select: text; }
        .usage { width:100%; border-collapse:collapse; margin:12px 0 20px; font-size:14px; }
        .usage th, .usage td { padding:9px 4px; text-align:right; border-bottom:1px solid #e3e7eb; }
        .usage th:first-child, .usage td:first-child { text-align:left; }
        .stock-fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
        .stock-fields label { display:grid; gap:6px; font-size:14px; min-width:0; }
        .stock-fields input { width:100%; min-width:0; box-sizing:border-box; padding:9px; font:inherit; font-size:16px; border:1px solid #ccd3da; border-radius:6px; }
        #save-stock { min-height:40px; padding:8px 16px; background:#1a73e8; color:white; border:0; border-radius:6px; font:inherit; }
        #stock-result { display:block; margin:12px 0; font-weight:600; line-height:1.7; }
        .estimate-note { color:#5f6368; font-size:12px; line-height:1.6; }
        .container { background: white; padding: 1.2rem; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; box-sizing: border-box; }
        
        /* 店鋪切換 */
        .shop-tabs { display: flex; gap: 8px; margin-bottom: 15px; background: #eee; padding: 4px; border-radius: 10px; }
        .shop-btn { flex: 1; padding: 10px; border: none; border-radius: 7px; cursor: pointer; font-weight: bold; background: transparent; transition: 0.3s; font-size: 1rem; }
        .shop-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* 1+1+2 統計排版 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #eee; display: flex; flex-direction: column; justify-content: center; }
        .stat-full-width { grid-column: span 2; }
        
        .stat-card.full { background: #e8f0fe; border-color: #d2e3fc; }
        .stat-card.year { background: #f1f3f4; border-color: #dadce0; }
        .stat-card.peak { border-top: 4px solid var(--peak); background: #fff5f5; }
        .stat-card.off { border-top: 4px solid var(--off); background: #f5fff8; }

        .stat-label { font-size: 0.85rem; color: #5f6368; margin-bottom: 6px; font-weight: bold; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #1967d2; }
        .stat-card.peak .stat-value { color: var(--peak); font-size: 1.4rem; }
        .stat-card.off .stat-value { color: var(--off); font-size: 1.4rem; }

        /* 輸入區 */
        .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        select { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; background: white; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 2px solid #eaeeef; border-radius: 10px; box-sizing: border-box; font-size: 16px; resize: none; transition: 0.3s; }
        textarea:focus { border-color: var(--primary); outline: none; }
        .status { font-size: 0.7rem; color: #34a853; text-align: right; height: 15px; margin-top: 5px; font-weight: bold; }
        .toolbox-link { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .toolbox-link a { min-height: 34px; padding: 0 12px; border: 1px solid #dadce0; border-radius: 8px; background: white; color: #202124; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; }
        
        /* 歷史標籤 */
        .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 200px; overflow-y: auto; padding: 5px; }
        .day-tag { background: #f1f3f4; color: #3c4043; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #dadce0; }
        .section-title { font-size: 0.85rem; font-weight: bold; color: #70757a; margin-top: 15px; border-left: 3px solid var(--primary); padding-left: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="toolbox-link">
        <a href="../../index.html">工具箱</a>
    </div>

    <div class="shop-tabs">
        <button id="btn-neihu" class="shop-btn active" onclick="switchShop('neihu')">內湖</button>
        <button id="btn-ruiguang" class="shop-btn" onclick="switchShop('ruiguang')">瑞光</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card full stat-full-width">
            <div class="stat-label">📊 全期總平均頻率</div>
            <div class="stat-value"><span id="avg-full">0</span> <small style="font-size: 1rem;">天</small></div>
        </div>
        <div class="stat-card year stat-full-width">
            <div class="stat-label">📅 <span id="current-year-label">2026</span> 年平均</div>
            <div class="stat-value"><span id="avg-year">0</span> <small style="font-size: 1rem;">天</small></div>
        </div>
        <div class="stat-card peak">
            <div class="stat-label">🔥 旺季 (7-1月)</div>
            <div class="stat-value"><span id="avg-peak">0</span> <small style="font-size: 0.9rem;">天</small></div>
        </div>
        <div class="stat-card off">
            <div class="stat-label">🍀 淡季 (2-6月)</div>
            <div class="stat-value"><span id="avg-off">0</span> <small style="font-size: 0.9rem;">天</small></div>
        </div>
    </div>

    <div class="control-row">
        <label style="font-weight:bold">年份切換</label>
        <select id="yearSelect" onchange="loadCurrentInput()"></select>
    </div>
    
    <textarea id="dateInput" placeholder="輸入日期例如：1/5, 1/20..." oninput="handleInput()"></textarea>
    <div id="saveStatus" class="status">雲端連線中...</div>

    <div class="section-title">更換紀錄 (由新到舊)</div>
    <div id="daysContainer" class="tag-container"></div>
    <div class="section-title">年度紙捲用量</div>
    <table class="usage"><thead><tr><th>期間</th><th>已記錄（捲）</th><th>預估（捲）</th></tr></thead><tbody id="usage-periods"></tbody></table>
    <p class="estimate-note">每個更換日期計為 1 捲；預估依歷史更換間隔推算，旺季為 7～1 月、淡季為 2～6 月。該季無樣本時採全期平均。年度旺季合計當年 1 月及 7～12 月。</p>
    <div class="section-title">庫存盤點</div>
    <div class="stock-fields"><label>盤點日期<input id="stock-date" type="date"></label><label>可用紙捲數<input id="stock-quantity" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label></div>
    <button id="save-stock" type="button">儲存盤點</button>
    <span id="stock-status" role="status"></span>
    <output id="stock-result" aria-live="polite"></output>
    <p class="estimate-note">可用數量包含機上剩餘紙捲（不足一捲可不計）。剩餘天數以今天起算，扣除盤點後的估計用量；補貨或實際用量不同時請重新盤點。</p>
</div>

<script type="module">
  import { analyze, stockForecast, dayKey, parseDay } from './model.mjs';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDzZhWJL8MZA-sqF_wjS9GH7e0Jn_Ysqho",
    authDomain: "credit-paper-use.firebaseapp.com",
    databaseURL: "https://credit-paper-use-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "credit-paper-use",
    storageBucket: "credit-paper-use.firebasestorage.app",
    messagingSenderId: "751908121457",
    appId: "1:751908121457:web:caf62a76df8a16382e64d0",
    measurementId: "G-584STP6STE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentShop = 'neihu';
  let allData = { neihu: {}, ruiguang: {} };
  const pending = new Map();
  const timers = new Map();
  let stockData = {};
  let stockReady = false;
  const stockDate = document.getElementById('stock-date');
  const stockQuantity = document.getElementById('stock-quantity');
  stockDate.max = dayKey();
  stockDate.value = dayKey();
  onValue(ref(db, 'stocktakes'), snapshot => {
    stockData = snapshot.val() || {};
    stockReady = true;
    loadStock();
  }, () => { document.getElementById('stock-status').textContent = '盤點資料讀取失敗，請重新整理'; });
  function loadStock() {
    if (![stockDate,stockQuantity].includes(document.activeElement)) {
      stockDate.value = stockData[currentShop]?.date || dayKey();
      stockQuantity.value = stockData[currentShop]?.quantity ?? '';
    }
    renderStock();
  }
  function renderStock() {
    const forecast = stockForecast(stockData[currentShop], analyze(allData[currentShop]).rates);
    document.getElementById('stock-result').textContent = !stockData[currentShop] ? '尚無盤點紀錄' : !forecast ? '更換紀錄不足，尚無法估算天數' : forecast.remaining === 0 ? '預估庫存已用完，請確認或重新盤點' : `預估剩餘 ${forecast.remaining.toFixed(1)} 捲 · ${forecast.days === null ? '超過 1,000 年，請確認盤點數量' : `約可用 ${forecast.days} 天（至 ${forecast.end}）`}`;
  }
  document.getElementById('save-stock').onclick = async () => {
    const status = document.getElementById('stock-status');
    if (!stockReady) { status.textContent = '請等待盤點資料載入'; return; }
    const quantity = Number(stockQuantity.value), date = stockDate.value, shop = currentShop;
    if (!stockQuantity.value.trim() || !Number.isSafeInteger(quantity) || quantity < 0 || parseDay(date) === null || date > dayKey()) { status.textContent = '請填入今天以前的日期與非負整數'; return; }
    status.textContent = '儲存中…';
    try {
      await set(ref(db, `stocktakes/${shop}`), {date,quantity});
      status.textContent = '盤點已儲存';
    } catch { status.textContent = '儲存失敗，請重試'; }
  };

  const yearSelect = document.getElementById('yearSelect');
  const thisYear = new Date().getFullYear();
  for (let y = Math.max(2030, thisYear + 1); y >= 2022; y--) {
      let opt = document.createElement('option');
      opt.value = y;
      opt.innerHTML = y + ' 年';
      if (y === thisYear) opt.selected = true;
      yearSelect.appendChild(opt);
  }
  document.getElementById('current-year-label').innerText = thisYear;

  onValue(ref(db, 'shops/'), (snapshot) => {
      const data = snapshot.val();
      {
          allData = data || {neihu:{},ruiguang:{}};
          for (const [key,text] of pending) { const [shop,year] = key.split('/'); allData[shop] ||= {}; allData[shop][year] = text; }
          updateUI();
          document.getElementById('saveStatus').innerText = "雲端同步成功";
      }
  }, () => { document.getElementById('saveStatus').innerText = '讀取失敗，請重新整理'; });

  window.switchShop = (shop) => {
      currentShop = shop;
      document.querySelectorAll('.shop-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + shop).classList.add('active');
      updateUI();
      loadStock();
  };

  window.loadCurrentInput = () => {
    document.getElementById('current-year-label').innerText = yearSelect.value;
    updateUI();
  };

  window.handleInput = () => {
      const year = yearSelect.value;
      const text = document.getElementById('dateInput').value;
      if (!allData[currentShop]) allData[currentShop] = {};
      allData[currentShop][year] = text;
      
      document.getElementById('saveStatus').innerText = "儲存中...";
      const shop = currentShop, key = `${shop}/${year}`;
      pending.set(key,text);
      clearTimeout(timers.get(key));
      timers.set(key, setTimeout(() => {
          set(ref(db, `shops/${shop}/${year}`), text)
            .then(() => { if (pending.get(key) === text) pending.delete(key); document.getElementById('saveStatus').innerText = "已安全儲存"; })
            .catch(() => { document.getElementById('saveStatus').innerText = '儲存失敗，請重新輸入重試'; });
      }, 800));
      calculateAndRender();
  };

  function updateUI() {
      const year = yearSelect.value;
      document.getElementById('dateInput').value = (allData[currentShop] && allData[currentShop][year]) || "";
      calculateAndRender();
  }

  function calculateAndRender() {
      const result = analyze(allData[currentShop], yearSelect.value);
      for (const [key,stat] of Object.entries(result.stats)) document.getElementById('avg-' + key).textContent = stat.count ? (stat.total/stat.count).toFixed(1) : '—';
      document.getElementById('daysContainer').innerHTML = result.intervals.map(days => '<span class="day-tag">' + days + '天</span>').join('');
      document.getElementById('usage-periods').innerHTML = result.periods.map(period => '<tr><td>' + period.name + '</td><td>' + period.recorded + '</td><td>' + (period.estimate === null ? '—' : period.estimate.toFixed(1)) + '</td></tr>').join('');
      renderStock();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
