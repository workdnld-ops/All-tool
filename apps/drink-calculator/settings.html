<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>飲料品項設定</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(760px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 6px;
    }

    header {
      min-height: 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.2;
      min-height: 15px;
    }

    .button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 9px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 850;
      white-space: nowrap;
    }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .add-panel,
    .item,
    .heading {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .add-panel {
      overflow: hidden;
    }

    .add-panel summary {
      min-height: 32px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      list-style: none;
      font-weight: 850;
    }

    .add-panel summary::-webkit-details-marker {
      display: none;
    }

    .add-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px 58px 58px;
      gap: 6px;
      padding: 0 8px 8px;
    }

    .heading,
    .item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px 56px 46px 42px 52px;
      gap: 5px;
      align-items: center;
    }

    .heading {
      min-height: 28px;
      padding: 0 7px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 850;
    }

    .item-list {
      display: grid;
      gap: 5px;
    }

    .item {
      min-height: 58px;
      padding: 6px 7px;
    }

    input {
      width: 100%;
      min-height: 32px;
      border: 1px solid #b8c6cc;
      border-radius: 7px;
      padding: 0 7px;
      color: var(--ink);
      background: #fff;
      font-size: 0.88rem;
      min-width: 0;
    }

    input[type="number"] {
      text-align: center;
      font-weight: 800;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.16);
      outline: none;
    }

    .toggle {
      width: 100%;
      min-height: 32px;
      display: grid;
      place-items: center;
    }

    .toggle input {
      width: 20px;
      min-height: 20px;
      height: 20px;
      padding: 0;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: rgba(255, 255, 255, 0.58);
      font-size: 0.9rem;
    }

    @media (max-height: 720px) {
      .shell { gap: 4px; }
      header { min-height: 34px; }
      h1 { font-size: 1.05rem; }
      .status { font-size: 0.7rem; }
      .button { min-height: 28px; font-size: 0.8rem; padding: 0 6px; }
      .add-panel summary { min-height: 28px; font-size: 0.82rem; }
      .heading { min-height: 24px; font-size: 0.66rem; }
      .item { min-height: 46px; padding: 4px 5px; }
      input { min-height: 28px; font-size: 0.78rem; padding: 0 5px; }
      .toggle,
      .toggle input { min-height: 18px; height: 18px; }
      .heading,
      .item { grid-template-columns: minmax(0, 1fr) 64px 50px 38px 32px 46px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>飲料品項設定</h1>
        <div class="status" id="status">讀取設定中...</div>
      </div>
      <a class="button" href="index.html">返回</a>
    </header>

    <details class="add-panel">
      <summary>
        <span>新增品項</span>
        <span>展開</span>
      </summary>
      <div class="add-form">
        <input id="new-name" type="text" placeholder="品名">
        <input id="new-price" type="number" min="0" inputmode="numeric" placeholder="箱價">
        <input id="new-bottles" type="number" min="1" inputmode="numeric" value="24" aria-label="每箱瓶數">
        <button class="button primary" id="add-button" type="button">新增</button>
      </div>
    </details>

    <div class="heading" aria-hidden="true">
      <span>品名</span>
      <span>箱價</span>
      <span>瓶數</span>
      <span>排序</span>
      <span>啟用</span>
      <span>儲存</span>
    </div>

    <section class="item-list" id="item-list" aria-label="飲料品項設定"></section>
  </main>

  <script type="module">
    import {
      addItem,
      parseNonNegativeInteger,
      saveItem,
      subscribeItems,
    } from "./drink-data.js";

    const status = document.getElementById("status");
    const itemList = document.getElementById("item-list");
    const addButton = document.getElementById("add-button");
    const newName = document.getElementById("new-name");
    const newPrice = document.getElementById("new-price");
    const newBottles = document.getElementById("new-bottles");
    let items = [];

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function itemValue(id, field) {
      return document.querySelector(`[data-id="${id}"][data-field="${field}"]`);
    }

    function renderItems() {
      const visibleItems = items.slice(0, 5);
      if (visibleItems.length === 0) {
        itemList.innerHTML = '<div class="empty">尚無飲料品項。</div>';
        return;
      }

      itemList.innerHTML = visibleItems.map((item) => `
        <article class="item">
          <input data-id="${item.id}" data-field="name" type="text" value="${escapeHtml(item.name)}" aria-label="${escapeHtml(item.name)} 名稱">
          <input data-id="${item.id}" data-field="pricePerCase" type="number" min="0" inputmode="numeric" value="${item.pricePerCase}" aria-label="${escapeHtml(item.name)} 箱價">
          <input data-id="${item.id}" data-field="bottlesPerCase" type="number" min="1" inputmode="numeric" value="${item.bottlesPerCase}" aria-label="${escapeHtml(item.name)} 每箱瓶數">
          <input data-id="${item.id}" data-field="order" type="number" inputmode="numeric" value="${item.order}" aria-label="${escapeHtml(item.name)} 排序">
          <label class="toggle" aria-label="${escapeHtml(item.name)} 啟用">
            <input data-id="${item.id}" data-field="active" type="checkbox" ${item.active ? "checked" : ""}>
          </label>
          <button class="button primary" data-save="${item.id}" type="button">儲存</button>
        </article>
      `).join("");
    }

    async function handleAddItem() {
      const name = newName.value.trim();
      const pricePerCase = parseNonNegativeInteger(newPrice.value);
      const bottlesPerCase = Math.max(1, parseNonNegativeInteger(newBottles.value));

      if (!name) {
        setStatus("請輸入品項名稱", true);
        newName.focus();
        return;
      }

      try {
        await addItem({
          name,
          pricePerCase,
          bottlesPerCase,
          order: items.length,
        });
        newName.value = "";
        newPrice.value = "";
        newBottles.value = "24";
        setStatus("品項已新增");
      } catch (error) {
        console.error(error);
        setStatus("新增失敗，請確認網路或 Firebase 權限。", true);
      }
    }

    async function handleSaveItem(id) {
      const name = itemValue(id, "name").value.trim();
      const pricePerCase = parseNonNegativeInteger(itemValue(id, "pricePerCase").value);
      const bottlesPerCase = Math.max(1, parseNonNegativeInteger(itemValue(id, "bottlesPerCase").value));
      const order = Number.parseInt(itemValue(id, "order").value, 10) || 0;
      const active = itemValue(id, "active").checked;

      if (!name) {
        setStatus("品項名稱不能空白", true);
        return;
      }

      try {
        await saveItem({ id, name, pricePerCase, bottlesPerCase, order, active });
        setStatus("品項已儲存");
      } catch (error) {
        console.error(error);
        setStatus("儲存失敗，請確認網路或 Firebase 權限。", true);
      }
    }

    itemList.addEventListener("focusin", (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      if (event.target.type !== "number") return;
      setTimeout(() => event.target.select(), 0);
    });

    itemList.addEventListener("click", (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      if (event.target.type !== "number") return;
      setTimeout(() => event.target.select(), 0);
    });

    itemList.addEventListener("click", async (event) => {
      const saveButton = event.target.closest("[data-save]");
      if (!saveButton) return;
      await handleSaveItem(saveButton.dataset.save);
    });

    addButton.addEventListener("click", handleAddItem);

    subscribeItems(
      (loadedItems) => {
        items = loadedItems;
        renderItems();
        setStatus("設定已同步");
      },
      () => setStatus("設定讀取失敗，請確認網路或 Firebase 權限。", true),
    );
  </script>
</body>
</html>
