<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>飲料品項設定</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    body,
    button,
    .button,
    summary,
    .item,
    .heading,
    .drag-handle,
    .toggle {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    input {
      -webkit-user-select: text;
      user-select: text;
    }

    .shell {
      width: min(760px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 6px;
    }

    header {
      min-height: 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .header-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.2;
      min-height: 15px;
    }

    .button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 9px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 850;
      white-space: nowrap;
    }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .add-panel,
    .item,
    .heading {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .add-panel {
      overflow: hidden;
    }

    .add-panel summary {
      min-height: 32px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      list-style: none;
      font-weight: 850;
    }

    .add-panel summary::-webkit-details-marker {
      display: none;
    }

    .add-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px 58px 58px;
      gap: 6px;
      padding: 0 8px 8px;
    }

    .heading,
    .item {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 72px 56px 42px;
      gap: 5px;
      align-items: center;
    }

    .heading {
      min-height: 28px;
      padding: 0 7px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 850;
    }

    .item-list {
      display: grid;
      gap: 5px;
    }

    .item {
      min-height: 58px;
      padding: 6px 7px;
      transition: border-color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .item.dragging {
      border-color: #8a5a00;
      background: #fff4d8;
      opacity: 0.72;
    }

    .item.drag-over {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.14);
    }

    .drag-handle {
      width: 100%;
      min-height: 32px;
      border: 0;
      border-radius: 7px;
      background: #fff4d8;
      color: #8a5a00;
      cursor: grab;
      font-weight: 900;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    input {
      width: 100%;
      min-height: 32px;
      border: 1px solid #b8c6cc;
      border-radius: 7px;
      padding: 0 7px;
      color: var(--ink);
      background: #fff;
      font-size: 0.88rem;
      min-width: 0;
    }

    input[type="number"] {
      text-align: center;
      font-weight: 800;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.16);
      outline: none;
    }

    .toggle {
      width: 100%;
      min-height: 32px;
      display: grid;
      place-items: center;
    }

    .toggle input {
      width: 20px;
      min-height: 20px;
      height: 20px;
      padding: 0;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: rgba(255, 255, 255, 0.58);
      font-size: 0.9rem;
    }

    @media (max-height: 720px) {
      .shell { gap: 4px; }
      header { min-height: 34px; }
      h1 { font-size: 1.05rem; }
      .status { font-size: 0.7rem; }
      .button { min-height: 28px; font-size: 0.8rem; padding: 0 6px; }
      .add-panel summary { min-height: 28px; font-size: 0.82rem; }
      .heading { min-height: 24px; font-size: 0.66rem; }
      .item { min-height: 46px; padding: 4px 5px; }
      input { min-height: 28px; font-size: 0.78rem; padding: 0 5px; }
      .toggle,
      .toggle input { min-height: 18px; height: 18px; }
      .heading,
      .item { grid-template-columns: 30px minmax(0, 1fr) 64px 50px 32px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>飲料品項設定</h1>
        <div class="status" id="status">讀取設定中...</div>
      </div>
      <div class="header-actions">
        <a class="button" href="../../index.html">工具箱</a>
        <a class="button" href="index.html">返回</a>
      </div>
    </header>

    <details class="add-panel">
      <summary>
        <span>新增品項</span>
        <span>展開</span>
      </summary>
      <div class="add-form">
        <input id="new-name" type="text" placeholder="品名">
        <input id="new-price" type="number" min="0" inputmode="numeric" placeholder="箱價">
        <input id="new-bottles" type="number" min="1" inputmode="numeric" value="24" aria-label="每箱瓶數">
        <button class="button primary" id="add-button" type="button">新增</button>
      </div>
    </details>

    <div class="heading" aria-hidden="true">
      <span>拖</span>
      <span>品名</span>
      <span>箱價</span>
      <span>瓶數</span>
      <span>啟用</span>
    </div>

    <section class="item-list" id="item-list" aria-label="飲料品項設定"></section>
  </main>

  <script>
    function markDrinkLoadFailure() {
      const status = document.getElementById("status");
      if (!status || !status.textContent.includes("讀取")) return;
      status.textContent = "資料載入失敗，請重新整理";
      status.style.color = "var(--danger)";
    }

    window.addEventListener("error", markDrinkLoadFailure);
    window.addEventListener("unhandledrejection", markDrinkLoadFailure);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("../../sw.js", { updateViaCache: "none" })
        .then((registration) => registration.update())
        .catch(() => undefined);
    }
  </script>

  <script type="module">
    import {
      addItem,
      parseNonNegativeInteger,
      saveItem,
      subscribeItems,
    } from "./drink-data.js?v=store-line-v3";

    const status = document.getElementById("status");
    const itemList = document.getElementById("item-list");
    const addButton = document.getElementById("add-button");
    const newName = document.getElementById("new-name");
    const newPrice = document.getElementById("new-price");
    const newBottles = document.getElementById("new-bottles");
    let items = [];
    let dragged = null;
    let pointerDrag = null;
    const autoSaveTimers = new Map();

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function itemValue(id, field) {
      return document.querySelector(`[data-id="${id}"][data-field="${field}"]`);
    }

    function isItemEditor(target) {
      return target instanceof HTMLInputElement
        && Boolean(target.dataset.id)
        && target.type !== "checkbox";
    }

    function renderItems() {
      const visibleItems = items;
      if (visibleItems.length === 0) {
        itemList.innerHTML = '<div class="empty">尚無飲料品項。</div>';
        return;
      }

      itemList.innerHTML = visibleItems.map((item) => `
        <article class="item" data-row-id="${item.id}">
          <button class="drag-handle" draggable="true" type="button" data-drag-handle aria-label="拖曳排序">☰</button>
          <input data-id="${item.id}" data-field="name" type="text" value="${escapeHtml(item.name)}" aria-label="${escapeHtml(item.name)} 名稱">
          <input data-id="${item.id}" data-field="pricePerCase" type="number" min="0" inputmode="numeric" value="${item.pricePerCase}" aria-label="${escapeHtml(item.name)} 箱價">
          <input data-id="${item.id}" data-field="bottlesPerCase" type="number" min="1" inputmode="numeric" value="${item.bottlesPerCase}" aria-label="${escapeHtml(item.name)} 每箱瓶數">
          <label class="toggle" aria-label="${escapeHtml(item.name)} 啟用">
            <input data-id="${item.id}" data-field="active" type="checkbox" ${item.active ? "checked" : ""}>
          </label>
        </article>
      `).join("");
    }

    async function handleAddItem() {
      const name = newName.value.trim();
      const pricePerCase = parseNonNegativeInteger(newPrice.value);
      const bottlesPerCase = Math.max(1, parseNonNegativeInteger(newBottles.value));

      if (!name) {
        setStatus("請輸入品項名稱", true);
        newName.focus();
        return;
      }

      try {
        await addItem({
          name,
          pricePerCase,
          bottlesPerCase,
          order: items.length,
        });
        newName.value = "";
        newPrice.value = "";
        newBottles.value = "24";
        setStatus("品項已新增");
      } catch (error) {
        console.error(error);
        setStatus("新增失敗，請確認網路或 Firebase 權限。", true);
      }
    }

    async function handleSaveItem(id) {
      const name = itemValue(id, "name").value.trim();
      const pricePerCase = parseNonNegativeInteger(itemValue(id, "pricePerCase").value);
      const bottlesPerCase = Math.max(1, parseNonNegativeInteger(itemValue(id, "bottlesPerCase").value));
      const order = items.find((item) => item.id === id)?.order || 0;
      const active = itemValue(id, "active").checked;

      if (!name) {
        setStatus("品項名稱不能空白", true);
        return;
      }

      try {
        await saveItem({ id, name, pricePerCase, bottlesPerCase, order, active });
        setStatus("品項已儲存");
      } catch (error) {
        console.error(error);
        setStatus("儲存失敗，請確認網路或 Firebase 權限。", true);
      }
    }

    function scheduleAutoSave(id, delay = 450) {
      clearTimeout(autoSaveTimers.get(id));
      autoSaveTimers.set(id, setTimeout(() => handleSaveItem(id), delay));
    }

    function commitActiveEditor() {
      const active = document.activeElement;
      if (isItemEditor(active)) active.blur();
    }

    async function reorderItem(fromId, toId) {
      if (!fromId || !toId || fromId === toId) return;
      const fromIndex = items.findIndex((item) => item.id === fromId);
      const toIndex = items.findIndex((item) => item.id === toId);
      if (fromIndex < 0 || toIndex < 0) return;

      const nextItems = [...items];
      const [moved] = nextItems.splice(fromIndex, 1);
      nextItems.splice(toIndex, 0, moved);
      const ordered = nextItems.map((item, index) => ({ ...item, order: index }));
      items = ordered;
      renderItems();
      setStatus("排序儲存中...");
      try {
        await Promise.all(ordered.map((item) => saveItem(item)));
        setStatus("排序已自動儲存");
      } catch (error) {
        console.error(error);
        setStatus("排序儲存失敗，請確認網路。", true);
      }
    }

    itemList.addEventListener("dragstart", (event) => {
      const handle = event.target.closest("[data-drag-handle]");
      const row = handle?.closest("[data-row-id]");
      if (!row) {
        event.preventDefault();
        return;
      }
      dragged = row.dataset.rowId;
      row.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", dragged);
    });

    itemList.addEventListener("dragover", (event) => {
      const row = event.target.closest("[data-row-id]");
      if (!row) return;
      event.preventDefault();
      row.classList.add("drag-over");
    });

    itemList.addEventListener("dragleave", (event) => {
      const row = event.target.closest("[data-row-id]");
      if (row) row.classList.remove("drag-over");
    });

    itemList.addEventListener("drop", async (event) => {
      const row = event.target.closest("[data-row-id]");
      if (!row || !dragged) return;
      event.preventDefault();
      row.classList.remove("drag-over");
      await reorderItem(dragged, row.dataset.rowId);
      dragged = null;
    });

    itemList.addEventListener("dragend", () => {
      itemList.querySelectorAll(".dragging,.drag-over").forEach((row) => {
        row.classList.remove("dragging", "drag-over");
      });
      dragged = null;
    });

    itemList.addEventListener("pointerdown", (event) => {
      const handle = event.target.closest("[data-drag-handle]");
      if (!handle) return;
      event.preventDefault();
      const row = handle.closest("[data-row-id]");
      if (!row) return;
      pointerDrag = { id: row.dataset.rowId, pointerId: event.pointerId };
      row.classList.add("dragging");
      handle.setPointerCapture?.(event.pointerId);
    });

    itemList.addEventListener("pointerup", async (event) => {
      if (!pointerDrag) return;
      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest("[data-row-id]");
      itemList.querySelectorAll(".dragging,.drag-over").forEach((row) => {
        row.classList.remove("dragging", "drag-over");
      });
      const fromId = pointerDrag.id;
      pointerDrag = null;
      if (target) await reorderItem(fromId, target.dataset.rowId);
    });

    itemList.addEventListener("pointercancel", () => {
      pointerDrag = null;
      itemList.querySelectorAll(".dragging,.drag-over").forEach((row) => {
        row.classList.remove("dragging", "drag-over");
      });
    });

    itemList.addEventListener("contextmenu", (event) => {
      if (event.target.closest("[data-drag-handle]")) event.preventDefault();
    });

    itemList.addEventListener("focusin", (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      if (event.target.type !== "number") return;
      setTimeout(() => event.target.select(), 0);
    });

    itemList.addEventListener("click", (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      if (event.target.type !== "number") return;
      setTimeout(() => event.target.select(), 0);
    });

    itemList.addEventListener("change", (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      const id = event.target.dataset.id;
      if (!id) return;
      if (event.target.type === "checkbox") scheduleAutoSave(id, 0);
    });

    itemList.addEventListener("focusout", (event) => {
      if (!isItemEditor(event.target)) return;
      const id = event.target.dataset.id;
      scheduleAutoSave(id, 0);
    });

    itemList.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || !isItemEditor(event.target)) return;
      event.preventDefault();
      event.target.blur();
    });

    document.addEventListener("pointerdown", (event) => {
      const active = document.activeElement;
      if (!isItemEditor(active)) return;
      if (event.target === active) return;
      if (event.target.closest("input, textarea, select")) return;
      commitActiveEditor();
    }, true);

    addButton.addEventListener("click", handleAddItem);

    subscribeItems(
      (loadedItems) => {
        items = loadedItems;
        renderItems();
        setStatus("設定已同步");
      },
      () => setStatus("設定讀取失敗，請確認網路或 Firebase 權限。", true),
    );
  </script>
</body>
</html>
