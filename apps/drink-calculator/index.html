<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>飲料計算器</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --accent: #9a6700;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(720px, 100%);
      height: 100dvh;
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto auto;
      gap: 6px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 40px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.2;
      min-height: 15px;
    }

    .header-actions,
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 10px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
      white-space: nowrap;
    }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .metric,
    .item,
    .history-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 6px 18px rgba(23, 33, 38, 0.06);
    }

    .metric {
      padding: 8px 10px;
      min-height: 58px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .metric strong {
      color: var(--primary);
      font-size: 1.25rem;
      line-height: 1.1;
    }

    .item-list {
      display: grid;
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: 6px;
      min-height: 0;
    }

    .item {
      min-height: 0;
      padding: 7px 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 74px;
      gap: 8px;
      align-items: center;
    }

    .item h2 {
      margin: 0 0 2px;
      font-size: 0.98rem;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtotal {
      color: var(--accent);
      font-weight: 900;
      font-size: 0.9rem;
      line-height: 1.2;
      margin-top: 2px;
    }

    .quantity {
      width: 74px;
      min-height: 42px;
      border: 1px solid #b8c6cc;
      border-radius: 8px;
      text-align: center;
      font-size: 1.06rem;
      font-weight: 850;
      color: var(--ink);
      background: #fff;
    }

    .quantity:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.16);
      outline: none;
    }

    .history-panel {
      min-height: 34px;
      overflow: hidden;
    }

    .history-panel summary {
      min-height: 34px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: 850;
      list-style: none;
    }

    .history-panel summary::-webkit-details-marker {
      display: none;
    }

    .history-list {
      max-height: 150px;
      overflow-y: auto;
      padding: 0 10px 10px;
      display: grid;
      gap: 6px;
    }

    .order {
      border-top: 1px solid var(--line);
      padding-top: 6px;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .order-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .order h2 {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.25;
    }

    .order-meta {
      color: var(--muted);
    }

    .delete {
      color: var(--danger);
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      font-weight: 850;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: rgba(255, 255, 255, 0.58);
      font-size: 0.9rem;
    }

    @media (max-height: 720px) {
      .shell { gap: 4px; padding-left: 8px; padding-right: 8px; }
      header { min-height: 34px; }
      h1 { font-size: 1.12rem; }
      .status { font-size: 0.72rem; }
      .button { min-height: 30px; font-size: 0.88rem; }
      .metric { min-height: 48px; padding: 6px 8px; }
      .metric strong { font-size: 1.08rem; }
      .item { padding: 5px 7px; grid-template-columns: minmax(0, 1fr) 66px; }
      .item h2 { font-size: 0.88rem; }
      .item-meta { font-size: 0.68rem; }
      .subtotal { font-size: 0.82rem; }
      .quantity { width: 66px; min-height: 34px; }
      .history-panel,
      .history-panel summary { min-height: 30px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>飲料計算器</h1>
        <div class="status" id="status">讀取資料中...</div>
      </div>
      <div class="header-actions">
        <a class="button" href="../../index.html">工具箱</a>
        <a class="button" href="settings.html">設定</a>
      </div>
    </header>

    <section class="summary" aria-label="合計">
      <div class="metric">
        <span>總箱數</span>
        <strong><span id="total-boxes">0</span> 箱</strong>
      </div>
      <div class="metric">
        <span>總金額</span>
        <strong id="total-price">$0</strong>
      </div>
    </section>

    <section class="item-list" id="item-list" aria-label="飲料品項"></section>

    <div class="actions">
      <button class="button" id="reset-button" type="button">重置</button>
      <button class="button primary" id="save-button" type="button" disabled>儲存訂單</button>
    </div>

    <details class="history-panel">
      <summary>
        <span>最近訂單</span>
        <span id="history-count">0 筆</span>
      </summary>
      <section class="history-list" id="history-list" aria-label="最近訂單"></section>
    </details>
  </main>

  <script type="module">
    import {
      deleteOrder,
      formatCurrency,
      parseNonNegativeInteger,
      saveOrder,
      subscribeItems,
      subscribeOrders,
    } from "./drink-data.js";

    const itemList = document.getElementById("item-list");
    const historyList = document.getElementById("history-list");
    const historyCount = document.getElementById("history-count");
    const status = document.getElementById("status");
    const totalBoxes = document.getElementById("total-boxes");
    const totalPrice = document.getElementById("total-price");
    const resetButton = document.getElementById("reset-button");
    const saveButton = document.getElementById("save-button");

    let items = [];
    let quantities = {};
    let currentTotals = { boxes: 0, price: 0, lines: [] };

    function pricePerBottle(item) {
      return item.pricePerCase / item.bottlesPerCase;
    }

    function formatUnitCurrency(value) {
      return `$${(Number(value) || 0).toLocaleString("zh-TW", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
      })}`;
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderItems() {
      const activeItems = items.filter((item) => item.active).slice(0, 5);
      if (activeItems.length === 0) {
        itemList.innerHTML = '<div class="empty">目前沒有啟用中的飲料品項，請先到設定新增或啟用品項。</div>';
        calculateTotals();
        return;
      }

      itemList.innerHTML = activeItems.map((item) => `
        <article class="item">
          <div>
            <h2>${escapeHtml(item.name)}</h2>
            <div class="item-meta">
              ${item.bottlesPerCase} 瓶 · ${formatCurrency(item.pricePerCase)} / 箱 · ${formatUnitCurrency(pricePerBottle(item))} / 瓶
            </div>
            <div class="subtotal" id="subtotal-${item.id}">$0</div>
          </div>
          <input
            class="quantity"
            id="quantity-${item.id}"
            data-id="${item.id}"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            placeholder="0"
            value="${quantities[item.id] || ""}"
            aria-label="${escapeHtml(item.name)} 箱數"
          >
        </article>
      `).join("");
      calculateTotals();
    }

    function calculateTotals() {
      const lines = [];
      let boxes = 0;
      let price = 0;

      items.filter((item) => item.active).slice(0, 5).forEach((item) => {
        const input = document.getElementById(`quantity-${item.id}`);
        const quantity = parseNonNegativeInteger(input?.value || quantities[item.id]);
        const subtotal = quantity * item.pricePerCase;
        quantities[item.id] = quantity ? String(quantity) : "";
        boxes += quantity;
        price += subtotal;

        const subtotalElement = document.getElementById(`subtotal-${item.id}`);
        if (subtotalElement) subtotalElement.textContent = formatCurrency(subtotal);

        if (quantity > 0) {
          lines.push({
            id: item.id,
            name: item.name,
            boxes: quantity,
            pricePerCase: item.pricePerCase,
            bottlesPerCase: item.bottlesPerCase,
            subtotal,
          });
        }
      });

      currentTotals = { boxes, price, lines };
      totalBoxes.textContent = String(boxes);
      totalPrice.textContent = formatCurrency(price);
      saveButton.disabled = boxes === 0;
    }

    function resetForm() {
      quantities = {};
      document.querySelectorAll(".quantity").forEach((input) => {
        input.value = "";
      });
      calculateTotals();
    }

    async function handleSaveOrder() {
      calculateTotals();
      if (currentTotals.boxes === 0) return;

      saveButton.disabled = true;
      setStatus("儲存訂單中...");

      const createdAt = new Date().toISOString();
      const orderItems = Object.fromEntries(
        currentTotals.lines.map((line) => [
          line.id,
          {
            name: line.name,
            boxes: line.boxes,
            pricePerCase: line.pricePerCase,
            bottlesPerCase: line.bottlesPerCase,
            subtotal: line.subtotal,
          },
        ]),
      );

      try {
        await saveOrder({
          date: createdAt.slice(0, 10),
          createdAt,
          items: orderItems,
          totalBoxes: currentTotals.boxes,
          totalPrice: currentTotals.price,
        });
        resetForm();
        setStatus("訂單已儲存");
      } catch (error) {
        console.error(error);
        setStatus("訂單儲存失敗，請確認網路或 Firebase 權限。", true);
        calculateTotals();
      }
    }

    function renderOrders(orders) {
      historyCount.textContent = `${orders.length} 筆`;
      if (orders.length === 0) {
        historyList.innerHTML = '<div class="empty">尚無歷史訂單。</div>';
        return;
      }

      historyList.innerHTML = orders.map((order) => {
        const lines = Object.values(order.items || {})
          .map((item) => `${escapeHtml(item.name)} ${item.boxes} 箱`)
          .join("、");
        return `
          <article class="order">
            <div class="order-head">
              <div>
                <h2>${order.date || "未記錄日期"} · ${formatCurrency(order.totalPrice)}</h2>
                <div class="order-meta">${order.totalBoxes} 箱 · ${lines || "無明細"}</div>
              </div>
              <button class="delete" data-delete-order="${order.id}" type="button">刪除</button>
            </div>
          </article>
        `;
      }).join("");
    }

    itemList.addEventListener("input", (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      const id = event.target.dataset.id;
      if (!id) return;
      quantities[id] = event.target.value;
      calculateTotals();
    });

    itemList.addEventListener("focusin", (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      if (!event.target.classList.contains("quantity")) return;
      setTimeout(() => event.target.select(), 0);
    });

    itemList.addEventListener("click", (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      if (!event.target.classList.contains("quantity")) return;
      setTimeout(() => event.target.select(), 0);
    });

    historyList.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-delete-order]");
      if (!button) return;
      if (!confirm("確定刪除這筆飲料訂單？")) return;
      try {
        await deleteOrder(button.dataset.deleteOrder);
      } catch (error) {
        console.error(error);
        setStatus("刪除訂單失敗。", true);
      }
    });

    resetButton.addEventListener("click", resetForm);
    saveButton.addEventListener("click", handleSaveOrder);

    subscribeItems(
      (loadedItems) => {
        items = loadedItems;
        setStatus("資料已同步");
        renderItems();
      },
      () => setStatus("飲料資料讀取失敗，請確認網路或 Firebase 權限。", true),
    );

    subscribeOrders(
      renderOrders,
      () => setStatus("歷史訂單讀取失敗。", true),
    );
  </script>
</body>
</html>
