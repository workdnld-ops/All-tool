<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#246b59">
  <title>課程查詢</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <link rel="stylesheet" href="styles.css?v=1.2.2">
</head>
<body>
  <main class="shell">
    <header><div class="brand"><img src="../../assets/toolbox-icon.svg" width="32" height="32" alt=""><div><h1>課程查詢</h1><span class="muted">內湖・瑞光 <small>v1.2.3</small></span></div></div><a class="button" href="../../index.html">工具箱</a></header>
    <div class="workspace">
      <details class="filters" open>
        <summary>課程篩選</summary>
        <div class="filter-content">
          <div id="choices"></div>
          <details class="exact"><summary>指定完整課名</summary><label>完整課名<select id="exact"><option value="">依條件篩選</option></select></label></details>
          <div class="two-fields"><label>上課日<select id="day"><option value="">不限</option><option value="weekday">平日</option><option value="weekend">週末</option></select></label><label>時段<select id="time"><option value="">不限</option><option value="morning">上午（12 點前）</option><option value="afternoon">下午（12–18 點）</option><option value="evening">晚上（18 點起）</option></select></label></div>
          <button id="reset" class="text-button">清除篩選</button>
        </div>
      </details>
      <section class="results" aria-label="查詢結果">
        <fieldset class="week-picker"><legend>週次（多選）</legend><div id="weeks"></div></fieldset>
        <div class="presets" aria-label="快速選擇"><button data-preset="all">SB初</button><button data-preset="grade">SB初2</button><button data-preset="adult">SB初2成</button></div>
        <div class="result-heading"><div><h2 id="filter-name">SB初</h2><span class="muted" id="result-count" role="status">讀取中…</span></div><div class="result-actions"><button id="copy" disabled>複製文字</button><button id="refresh" class="icon-button" aria-label="重新整理課表" title="重新整理課表"><svg class="icon"><use href="../work-assignment/icons.svg#rotate-ccw"/></svg></button><button id="download" class="icon-button" disabled aria-label="下載 CSV" title="下載 CSV"><svg class="icon"><use href="../work-assignment/icons.svg#download"/></svg></button></div></div>
        <p id="error" class="error" role="alert" hidden></p>
        <details id="warnings" class="warning" open hidden><summary id="warnings-title"></summary><ul id="warnings-list"></ul></details>
        <p id="loading" role="status">正在讀取 iSKI 課表…</p>
        <p id="empty" hidden>沒有符合條件的彩色未來時段。</p>
        <ul id="schedule" aria-label="課程時段"></ul>
        <footer><p id="updated"></p><p>彩色時段不保證仍有名額，請以 <a href="https://www.iski.com.tw/index.php?route=information/calender" target="_blank" rel="noreferrer">iSKI 原站課表</a>為準。資料快取最長 60 秒。</p></footer>
      </section>
    </div>
  </main>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="app.mjs?v=1.2.3"></script>
</body>
</html>
