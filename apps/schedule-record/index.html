<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>排班紀錄</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --primary-soft: #e4f0ee;
      --blue: #245b9b;
      --blue-soft: #e7f0fb;
      --rose: #9a3d55;
      --rose-soft: #fbe8ee;
      --danger: #b42318;
      --danger-soft: #fff5f4;
      --shadow: 0 6px 18px rgba(23, 33, 38, 0.06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    button,
    input,
    textarea { font: inherit; }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    .shell {
      width: min(860px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(7px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 6px;
    }

    header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.28rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .page-updated-at {
      min-width: 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }

    .status {
      grid-column: 1 / -1;
      min-height: 16px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .button,
    .week-button,
    .checkbox-label {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .button {
      padding: 0 10px;
    }

    .week-button {
      min-height: 30px;
      padding: 0 4px;
      font-size: 0.82rem;
      position: relative;
      gap: 3px;
    }

    .week-button.saved::after {
      content: "✓";
      font-size: 0.72rem;
      line-height: 1;
      font-weight: 900;
    }

    .button.primary,
    .week-button.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.feedback,
    .week-button.saved {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .week-button.active.saved {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.feedback-error {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .panel,
    .result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 8px;
      display: grid;
      gap: 7px;
    }

    .top-actions,
    .form-grid,
    .week-grid,
    .action-grid {
      display: grid;
      gap: 6px;
    }

    .top-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .action-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .form-grid {
      grid-template-columns: minmax(0, 236px) minmax(0, 224px);
      align-items: end;
    }

    .dayoff-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      align-self: end;
    }

    .month-control {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 38px;
      gap: 6px;
      align-items: center;
    }

    .month-nav {
      min-height: 36px;
      padding: 0;
      font-size: 1.15rem;
      line-height: 1;
    }

    .week-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .view {
      display: grid;
      gap: 8px;
    }

    .view[hidden] {
      display: none;
    }

    .raw-input-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .raw-input-panel[hidden] {
      display: none;
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 850;
    }

    .checkbox-label {
      min-height: 32px;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      background: #fbfcfc;
      color: var(--ink);
      font-size: 0.9rem;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #b8c6cc;
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font-weight: 750;
      min-width: 0;
    }

    input {
      min-height: 36px;
      padding: 0 9px;
    }

    input[type="checkbox"] {
      width: 18px;
      min-width: 18px;
      height: 18px;
      min-height: 18px;
      padding: 0;
      accent-color: var(--primary);
    }

    textarea {
      min-height: 104px;
      resize: vertical;
      padding: 9px;
      line-height: 1.35;
      word-break: break-word;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.16);
      outline: none;
    }

    .result {
      display: grid;
      gap: 6px;
      padding: 8px;
      border-color: rgba(31, 111, 100, 0.35);
      background: var(--primary-soft);
    }

    .result.empty {
      border-color: rgba(154, 61, 85, 0.28);
      background: var(--rose-soft);
    }

    .result-title {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 900;
    }

    .output {
      min-height: 42px;
      font-size: 0.9rem;
      line-height: 1.55;
      font-weight: 800;
      overflow: visible;
      -webkit-user-select: text;
      user-select: text;
    }

    .calendar {
      --calendar-cell-height: clamp(62px, 8.4dvh, 82px);
      display: grid;
      gap: 6px;
    }

    .calendar-head,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .calendar-grid {
      grid-template-rows: repeat(6, minmax(var(--calendar-cell-height), auto));
    }

    .calendar-head {
      min-height: 24px;
      align-items: center;
      overflow: visible;
      padding: 2px 0 4px;
    }

    .calendar-weekday {
      color: var(--muted);
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      line-height: 1.2;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
      overflow: visible;
    }

    .calendar-day {
      min-height: var(--calendar-cell-height);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px;
      display: grid;
      align-content: start;
      gap: 2px;
      background: #fff;
      color: var(--ink);
      overflow: hidden;
    }

    .calendar-day.outside {
      background: #f8fafb;
      color: var(--muted);
    }

    .calendar-day.adjacent-month-data {
      opacity: 0.5;
    }

    .calendar-day.has-item {
      border-color: rgba(31, 111, 100, 0.38);
      background: #f5fbf9;
    }

    .calendar-day.changed {
      border-color: #b7791f;
      background: #fff8ea;
    }

    .calendar-day.conflict {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .calendar-day.today {
      box-shadow: 0 0 0 2px #f4a3c4;
    }

    .calendar-day.past:not(.today):not(.conflict) {
      border-color: #d5dde2;
      background: #f1f3f5;
      color: #8a949b;
    }

    .day-number {
      font-size: 0.74rem;
      line-height: 1;
      font-weight: 900;
    }

    .day-item {
      font-size: 0.68rem;
      line-height: 1.15;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .shift-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 14px;
      border-radius: 5px;
      padding: 1px 4px;
      margin-bottom: 2px;
      color: #fff;
      font-size: 0.58rem;
      line-height: 1.1;
      font-weight: 900;
    }

    .shift-time {
      display: block;
    }

    .day-item.early {
      color: #176b4d;
    }

    .day-item.early .shift-label {
      background: #1f8a5b;
    }

    .day-item.mid {
      color: #7a5b00;
    }

    .day-item.mid .shift-label {
      background: #c99718;
    }

    .day-item.late {
      color: #245b9b;
    }

    .day-item.late .shift-label {
      background: #2f6fb4;
    }

    .day-item.leave {
      color: var(--rose);
    }

    .day-item.changed {
      color: #9a5a00;
    }

    .day-item.conflict {
      color: var(--danger);
    }

    .day-item.conflict .shift-label {
      background: var(--danger);
    }

    .calendar-day.past:not(.today):not(.conflict) .day-number,
    .calendar-day.past:not(.today):not(.conflict) .day-item,
    .calendar-day.past:not(.today):not(.conflict) .shift-time {
      color: #8a949b;
    }

    .calendar-day.past:not(.today):not(.conflict) .shift-label {
      background: #9aa4ab;
      color: #fff;
    }

    .empty-calendar {
      color: var(--muted);
      min-height: 42px;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    @media (max-width: 620px) {
      h1 { font-size: 1.18rem; }
      .form-grid { grid-template-columns: 1fr; }
      .week-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .button,
      .week-button { padding: 0 3px; }
      textarea { min-height: 96px; }
      .output { overflow: visible; }
      .calendar {
        --calendar-cell-height: clamp(64px, 8.2dvh, 76px);
      }
      .calendar-grid,
      .calendar-head {
        gap: 3px;
      }
      .calendar-head {
        min-height: 26px;
        padding-bottom: 5px;
      }
      .calendar-weekday {
        min-height: 20px;
        font-size: 0.62rem;
        line-height: 1.2;
      }
      .calendar-day {
        border-radius: 6px;
        padding: 3px;
      }
      .day-number {
        font-size: 0.68rem;
      }
      .day-item {
        font-size: 0.6rem;
      }
      .shift-label {
        font-size: 0.52rem;
        padding: 1px 3px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>排班紀錄</h1>
      <div class="page-updated-at" id="schedule-updated-at">資料更新：尚未貼上</div>
      <a class="button" href="../../index.html">工具箱</a>
      <div class="status" id="status">選擇週次後會讀取剪貼簿內容</div>
    </header>

    <section class="panel">
      <div class="form-grid">
        <label>
          月份
          <div class="month-control">
            <button class="button month-nav" id="prev-month-button" type="button" aria-label="上一個月">‹</button>
            <input id="month-input" type="month" aria-label="月份">
            <button class="button month-nav" id="next-month-button" type="button" aria-label="下一個月">›</button>
          </div>
        </label>
        <div class="dayoff-actions">
          <button class="button" id="paste-dayoff-button" type="button">貼上排休</button>
          <button class="button" id="restore-dayoff-button" type="button">回復排休</button>
        </div>
      </div>
      <div class="view" id="schedule-view">
        <div class="week-grid" aria-label="週次">
          <button class="week-button" type="button" data-week="1">wk1</button>
          <button class="week-button" type="button" data-week="2">wk2</button>
          <button class="week-button" type="button" data-week="3">wk3</button>
          <button class="week-button" type="button" data-week="4">wk4</button>
          <button class="week-button" type="button" data-week="5">wk5</button>
        </div>
        <div class="raw-input-toolbar">
          <button class="button" id="schedule-edit-toggle" type="button" aria-expanded="false" aria-controls="schedule-raw-panel">修正文字</button>
        </div>
        <div class="raw-input-panel" id="schedule-raw-panel" hidden>
          <textarea id="schedule-input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="也可以手動貼上後，按 wk1-wk5 覆蓋該週" aria-label="貼上排班內容"></textarea>
        </div>
      </div>
    </section>

    <section class="result empty" id="result-panel" aria-label="行事曆預覽">
      <div class="result-title" id="result-title">行事曆</div>
      <div class="output" id="output">尚無排班資料</div>
    </section>

    <div class="action-grid">
      <button class="button" id="clear-button" type="button">清空</button>
      <button class="button" id="clear-marks-button" type="button">清除標記</button>
      <button class="button primary" id="copy-button" type="button">複製</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getDatabase,
      onValue,
      ref,
      serverTimestamp,
      set,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6aZhiruY_wqBfNPElCsybIQvKByld6_8",
      authDomain: "money-card-6bf98.firebaseapp.com",
      databaseURL: "https://money-card-6bf98-default-rtdb.firebaseio.com",
      projectId: "money-card-6bf98",
      storageBucket: "money-card-6bf98.firebasestorage.app",
      messagingSenderId: "245245451690",
      appId: "1:245245451690:web:e939a519af0009b8d1dfd3",
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const remoteStateRef = ref(database, "users/single-user/scheduleRecord/state");

    const LEAVE_KEYWORDS = [
      "特休",
      "優先",
      "次優",
      "排休",
      "公假",
      "事假休",
      "滑雪假休",
      "年假例休",
      "家庭照護假",
    ];
    const SUPPORT_SHIFT_KEYWORDS = [
      "一店裝機支援休",
      "二店裝機支援休",
      "二電裝機支援休",
    ];

    const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
    const MONTH_STORAGE_KEY = "scheduleRecordSelectedMonth";
    const MONTHS_STORAGE_KEY = "scheduleRecordMonths";
    const STATE_STORAGE_KEY = "scheduleRecordWeeks";
    const LAST_INPUT_STORAGE_KEY = "scheduleRecordLastInput";
    const CHANGED_KEYS_STORAGE_KEY = "scheduleRecordChangedKeys";

    const monthInput = document.getElementById("month-input");
    const prevMonthButton = document.getElementById("prev-month-button");
    const nextMonthButton = document.getElementById("next-month-button");
    const scheduleInput = document.getElementById("schedule-input");
    const scheduleEditToggle = document.getElementById("schedule-edit-toggle");
    const scheduleRawPanel = document.getElementById("schedule-raw-panel");
    const pasteDayOffButton = document.getElementById("paste-dayoff-button");
    const restoreDayOffButton = document.getElementById("restore-dayoff-button");
    const status = document.getElementById("status");
    const resultPanel = document.getElementById("result-panel");
    const resultTitle = document.getElementById("result-title");
    const scheduleUpdatedAt = document.getElementById("schedule-updated-at");
    const output = document.getElementById("output");
    const copyButton = document.getElementById("copy-button");
    const clearMarksButton = document.getElementById("clear-marks-button");
    const weekButtons = Array.from(document.querySelectorAll("[data-week]"));

    const state = {
      months: {},
      activeWeek: 1,
    };
    let applyingRemoteState = false;
    let remoteReady = false;
    let remoteSaveTimer = 0;
    let scheduleEditorExpanded = false;
    let activeMonthKey = "";

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function setDefaultMonth() {
      const savedMonth = localStorage.getItem(MONTH_STORAGE_KEY);
      if (/^\d{4}-\d{2}$/.test(savedMonth || "")) {
        monthInput.value = savedMonth;
        return;
      }
      const now = new Date();
      monthInput.value = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
    }

    function monthKeyFromInput() {
      if (/^\d{4}-\d{2}$/.test(monthInput.value || "")) return monthInput.value;
      const { year, month } = parseMonthValue();
      return `${year}-${pad2(month)}`;
    }

    function normalizeWeeks(value) {
      const normalized = {};
      Object.entries(value || {}).forEach(([week, text]) => {
        if (!/^[1-5]$/.test(String(week))) return;
        normalized[String(week)] = String(text || "");
      });
      return normalized;
    }

    function normalizeWeekUpdatedAt(value) {
      const normalized = {};
      Object.entries(value || {}).forEach(([week, timestamp]) => {
        if (!/^[1-5]$/.test(String(week))) return;
        const parsed = Number(timestamp);
        normalized[String(week)] = Number.isFinite(parsed) ? parsed : 0;
      });
      return normalized;
    }

    function latestKnownUpdatedAt(value = {}, weekUpdatedAt = normalizeWeekUpdatedAt(value.weekUpdatedAt)) {
      return Math.max(
        0,
        Number(value.scheduleUpdatedAt) || 0,
        Number(value.dayOffUpdatedAt) || 0,
        ...Object.values(weekUpdatedAt),
      );
    }

    function normalizeMonthRecord(value = {}) {
      const weekUpdatedAt = normalizeWeekUpdatedAt(value.weekUpdatedAt);
      return {
        weeks: normalizeWeeks(value.weeks),
        weekUpdatedAt,
        changedKeys: Array.isArray(value.changedKeys) ? value.changedKeys.map(String) : [],
        scheduleInput: String(value.scheduleInput || ""),
        scheduleUpdatedAt: latestKnownUpdatedAt(value, weekUpdatedAt),
        dayOffInput: String(value.dayOffInput || ""),
        dayOffUpdatedAt: Number(value.dayOffUpdatedAt) || 0,
        dayOffPreviousInput: String(value.dayOffPreviousInput || ""),
        dayOffPreviousUpdatedAt: Number(value.dayOffPreviousUpdatedAt) || 0,
        dayOffUndoReady: Boolean(value.dayOffUndoReady),
      };
    }

    function normalizeMonths(value) {
      const normalized = {};
      Object.entries(value || {}).forEach(([month, record]) => {
        if (!/^\d{4}-\d{2}$/.test(String(month))) return;
        normalized[String(month)] = normalizeMonthRecord(record || {});
      });
      return normalized;
    }

    function currentMonthData(monthKey = activeMonthKey || monthKeyFromInput()) {
      if (!state.months[monthKey]) state.months[monthKey] = normalizeMonthRecord();
      return state.months[monthKey];
    }

    function readMonthData(monthKey = activeMonthKey || monthKeyFromInput()) {
      return state.months[monthKey] || normalizeMonthRecord();
    }

    function syncScheduleInputFromMonth() {
      scheduleInput.value = currentMonthData().scheduleInput || "";
    }

    function saveScheduleInputToMonth(monthKey = activeMonthKey || monthKeyFromInput()) {
      currentMonthData(monthKey).scheduleInput = scheduleInput.value;
    }

    function loadState() {
      try {
        const savedMonths = JSON.parse(localStorage.getItem(MONTHS_STORAGE_KEY) || "{}");
        state.months = normalizeMonths(savedMonths);
      } catch {
        state.months = {};
      }
      if (Object.keys(state.months).length === 0) {
        const legacyMonth = monthKeyFromInput();
        const legacy = normalizeMonthRecord();
        try {
          const saved = JSON.parse(localStorage.getItem(STATE_STORAGE_KEY) || "{}");
          legacy.weeks = normalizeWeeks(saved);
        } catch {
          legacy.weeks = {};
        }
        try {
          const savedChangedKeys = JSON.parse(localStorage.getItem(CHANGED_KEYS_STORAGE_KEY) || "[]");
          if (Array.isArray(savedChangedKeys)) legacy.changedKeys = savedChangedKeys.map(String);
        } catch {
          legacy.changedKeys = [];
        }
        legacy.scheduleInput = localStorage.getItem(LAST_INPUT_STORAGE_KEY) || "";
        if (Object.keys(legacy.weeks).length > 0 || legacy.scheduleInput) {
          state.months[legacyMonth] = legacy;
        }
      }
      syncScheduleInputFromMonth();
    }

    function persistLocalState() {
      saveScheduleInputToMonth();
      localStorage.setItem(MONTHS_STORAGE_KEY, JSON.stringify(state.months));
      localStorage.setItem(MONTH_STORAGE_KEY, monthKeyFromInput());
      localStorage.setItem(LAST_INPUT_STORAGE_KEY, scheduleInput.value);
    }

    function saveState() {
      persistLocalState();
      if (!applyingRemoteState) scheduleRemoteSave();
    }

    function remoteSnapshot() {
      const monthData = currentMonthData();
      return {
        activeWeek: state.activeWeek,
        changedKeys: monthData.changedKeys,
        dayOffInput: monthData.dayOffInput,
        dayOffPreviousInput: monthData.dayOffPreviousInput,
        dayOffPreviousUpdatedAt: monthData.dayOffPreviousUpdatedAt,
        dayOffUpdatedAt: monthData.dayOffUpdatedAt,
        dayOffUndoReady: monthData.dayOffUndoReady,
        month: monthKeyFromInput(),
        months: state.months,
        scheduleInput: scheduleInput.value,
        scheduleUpdatedAt: monthData.scheduleUpdatedAt,
        updatedAt: serverTimestamp(),
        weekUpdatedAt: monthData.weekUpdatedAt,
        weeks: monthData.weeks,
      };
    }

    function applyRemoteState(data) {
      applyingRemoteState = true;
      if (/^\d{4}-\d{2}$/.test(data?.month || "")) {
        monthInput.value = data.month;
        localStorage.setItem(MONTH_STORAGE_KEY, data.month);
      }
      activeMonthKey = monthKeyFromInput();
      state.activeWeek = Number(data?.activeWeek) || 1;
      state.months = normalizeMonths(data?.months);
      if (Object.keys(state.months).length === 0 && data?.weeks && typeof data.weeks === "object") {
        state.months[activeMonthKey] = normalizeMonthRecord({
          weeks: data.weeks,
          weekUpdatedAt: data.weekUpdatedAt,
          changedKeys: data.changedKeys,
          scheduleInput: data.scheduleInput,
          scheduleUpdatedAt: data.scheduleUpdatedAt,
          dayOffInput: data.dayOffInput,
          dayOffPreviousInput: data.dayOffPreviousInput,
          dayOffPreviousUpdatedAt: data.dayOffPreviousUpdatedAt,
          dayOffUpdatedAt: data.dayOffUpdatedAt,
          dayOffUndoReady: data.dayOffUndoReady,
        });
      }
      syncScheduleInputFromMonth();
      applyingRemoteState = false;
      persistLocalState();
      render();
    }

    async function saveRemoteStateNow() {
      if (applyingRemoteState) return;
      try {
        await set(remoteStateRef, remoteSnapshot());
        remoteReady = true;
      } catch (error) {
        console.error("Schedule record sync error:", error);
        status.textContent = "雲端同步失敗，暫存於本機";
        status.style.color = "var(--danger)";
      }
    }

    function scheduleRemoteSave() {
      window.clearTimeout(remoteSaveTimer);
      remoteSaveTimer = window.setTimeout(saveRemoteStateNow, remoteReady ? 250 : 0);
    }

    function subscribeRemoteState() {
      onValue(
        remoteStateRef,
        (snapshot) => {
          const data = snapshot.val();
          remoteReady = true;
          if (data) {
            applyRemoteState(data);
            return;
          }
          saveRemoteStateNow();
        },
        (error) => {
          console.error("Schedule record read error:", error);
          status.textContent = "雲端同步讀取失敗，暫用本機紀錄";
          status.style.color = "var(--danger)";
        },
      );
    }

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFKC")
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "")
        .trim();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function parseMonthValue() {
      const match = /^(\d{4})-(\d{2})$/.exec(monthInput.value);
      if (!match) {
        const now = new Date();
        return { year: now.getFullYear(), month: now.getMonth() + 1 };
      }
      return { year: Number(match[1]), month: Number(match[2]) };
    }

    function parseMonthKey(monthKey) {
      const match = /^(\d{4})-(\d{2})$/.exec(monthKey || "");
      if (!match) return parseMonthValue();
      return { year: Number(match[1]), month: Number(match[2]) };
    }

    function monthKeyWithOffset(monthKey, offset) {
      const { year, month } = parseMonthKey(monthKey);
      const date = new Date(year, month - 1 + offset, 1);
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
    }

    function setMonthValue(year, month) {
      monthInput.value = `${year}-${pad2(month)}`;
    }

    function handleMonthChange() {
      saveScheduleInputToMonth();
      if (/^\d{4}-\d{2}$/.test(monthInput.value)) {
        localStorage.setItem(MONTH_STORAGE_KEY, monthInput.value);
      }
      activeMonthKey = monthKeyFromInput();
      syncScheduleInputFromMonth();
      saveState();
      render();
    }

    function changeMonth(offset) {
      saveScheduleInputToMonth();
      const { year, month } = parseMonthValue();
      const nextMonth = new Date(year, month - 1 + offset, 1);
      setMonthValue(nextMonth.getFullYear(), nextMonth.getMonth() + 1);
      handleMonthChange();
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function isValidDate(year, month, day) {
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
    }

    function dateForWeekDay(week, index, monthKey = activeMonthKey || monthKeyFromInput()) {
      const { year, month } = parseMonthKey(monthKey);
      const day = ((Number(week) - 1) * 7) + index + 1;
      const date = new Date(year, month - 1, day);
      return {
        year: date.getFullYear(),
        month: date.getMonth() + 1,
        day: date.getDate(),
        weekday: WEEKDAYS[date.getDay()],
        timestamp: date.getTime(),
      };
    }

    function normalizeTime(hour, minute = "00") {
      const parsedHour = Number(hour);
      if (!Number.isInteger(parsedHour) || parsedHour > 23) return "";
      return `${pad2(parsedHour)}:${minute}`;
    }

    function findShiftTime(cells) {
      const values = cells.map(normalizeText).filter(Boolean);
      const joined = values.join(" ");
      if (SUPPORT_SHIFT_KEYWORDS.some((keyword) => joined.includes(keyword))) return "10:00-19:00";
      const rangeText = normalizeText(joined)
        .replace(/[~～至]/g, "-")
        .replace(/\s+/g, " ");
      const range = rangeText.match(/(\d{1,2})(?::?(\d{2}))\s*-\s*(\d{1,2})(?::?(\d{2}))/);
      if (range) {
        const start = normalizeTime(range[1], range[2]);
        const end = normalizeTime(range[3], range[4]);
        if (start && end) return `${start}-${end}`;
      }
      const times = [];
      for (const value of values) {
        const match = value.match(/^(\d{1,2}):(\d{2})$/);
        if (!match) continue;
        const time = normalizeTime(match[1], match[2]);
        if (time) times.push(time);
        if (times.length >= 2) break;
      }
      return times.length >= 2 ? `${times[0]}-${times[1]}` : "";
    }

    function findStoreCode(cells) {
      for (const cell of cells) {
        const match = normalizeText(cell).match(/^([ABC])(?:單店|跑店)$/);
        if (match) return match[1];
      }
      return "";
    }

    function hasLeaveText(cells) {
      const text = normalizeText(cells.join(" "));
      return LEAVE_KEYWORDS.some((keyword) => text.includes(keyword));
    }

    function dayOffDataStartIndex(rows) {
      if (rows.length <= 5) return 0;
      const nameRow = normalizeText((rows[4] || []).join(" "));
      const summaryRows = rows
        .slice(0, 4)
        .flat()
        .map(normalizeText)
        .filter(Boolean);
      const hasSummaryHeader = nameRow && summaryRows.every((value) => /^\d+$/.test(value));
      return hasSummaryHeader ? 5 : 0;
    }

    function parseDateFromCells(cells, fallbackYear, fallbackMonth) {
      const joined = cells.map(normalizeText).join(" ");
      const full = joined.match(/(?<!\d)(20\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})(?!\d)/);
      if (full) {
        const year = Number(full[1]);
        const month = Number(full[2]);
        const day = Number(full[3]);
        if (isValidDate(year, month, day)) return { year, month, day };
      }
      const monthDay = joined.match(/(?<!\d)(\d{1,2})\s*(?:\/|月)\s*(\d{1,2})\s*(?:日)?(?!\d)/);
      if (monthDay) {
        const month = Number(monthDay[1]);
        const day = Number(monthDay[2]);
        if (isValidDate(fallbackYear, month, day)) return { year: fallbackYear, month, day };
      }
      const dayOnly = joined.match(/(?<!\d)(\d{1,2})\s*日(?!\d)/);
      if (dayOnly) {
        const day = Number(dayOnly[1]);
        if (isValidDate(fallbackYear, fallbackMonth, day)) {
          return { year: fallbackYear, month: fallbackMonth, day };
        }
      }
      return null;
    }

    function parseWeekRows(rawText, week, monthKey = activeMonthKey || monthKeyFromInput(), monthData = readMonthData(monthKey)) {
      const values = rawText
        .replace(/\r/g, "")
        .split(/\n|\t/g)
        .map(normalizeText);
      const dataValues = values.slice(4);
      return Array.from({ length: 7 }, (_, index) => {
        const cells = dataValues.slice(index * 25, (index + 1) * 25);
        const text = normalizeText(cells.join(" "));
        const date = dateForWeekDay(week, index, monthKey);
        const time = findShiftTime(cells);
        const store = time ? findStoreCode(cells) : "";
        const isLeave = !time && hasLeaveText(cells);
        return {
          ...date,
          week: Number(week),
          rowIndex: index,
          source: "schedule",
          sourceUpdatedAt: Number(monthData.weekUpdatedAt[String(week)]) || 0,
          store,
          text,
          time,
          type: time ? "shift" : isLeave ? "leave" : "empty",
        };
      });
    }

    function scheduleRecords(monthKey = activeMonthKey || monthKeyFromInput()) {
      const monthData = readMonthData(monthKey);
      return Object.entries(monthData.weeks)
        .flatMap(([week, rawText]) => parseWeekRows(rawText, week, monthKey, monthData))
        .filter((record) => record.type !== "empty")
        .sort((a, b) => dateTime(a) - dateTime(b));
    }

    function parseDayOffRows(monthKey = activeMonthKey || monthKeyFromInput()) {
      const monthData = readMonthData(monthKey);
      const rawText = String(monthData.dayOffInput || "").replace(/\r/g, "").replace(/\n+$/g, "");
      const rawRows = rawText ? rawText.split("\n") : [];
      const rows = rawRows.map((line) => line.split("\t"));
      const dataRows = rows.slice(dayOffDataStartIndex(rows));
      const { year, month } = parseMonthKey(monthKey);
      const maxDay = daysInMonth(year, month);
      const matches = [];

      dataRows.forEach((cells, index) => {
        if (!hasLeaveText(cells)) return;
        let dateInfo = parseDateFromCells(cells, year, month);
        if (!dateInfo) {
          const day = index + 1;
          if (day < 1 || day > maxDay) return;
          dateInfo = { year, month, day };
        }
        const date = new Date(dateInfo.year, dateInfo.month - 1, dateInfo.day);
        matches.push({
          ...dateInfo,
          source: "dayoff",
          sourceUpdatedAt: Number(monthData.dayOffUpdatedAt) || 0,
          text: normalizeText(cells.join(" ")),
          time: "",
          type: "leave",
          weekday: WEEKDAYS[date.getDay()],
          timestamp: date.getTime(),
        });
      });

      const unique = [];
      const seen = new Set();
      for (const item of matches) {
        const key = recordKey(item);
        if (seen.has(key)) continue;
        seen.add(key);
        unique.push(item);
      }
      return unique.sort((a, b) => dateTime(a) - dateTime(b));
    }

    function records(monthKey = activeMonthKey || monthKeyFromInput()) {
      const entriesByKey = new Map();
      [...scheduleRecords(monthKey), ...parseDayOffRows(monthKey)].forEach((record) => {
        const key = recordKey(record);
        if (!entriesByKey.has(key)) entriesByKey.set(key, []);
        entriesByKey.get(key).push(record);
      });

      return [...entriesByKey.entries()].map(([key, entries]) => {
        const scheduleEntry = entries.find((entry) => entry.source === "schedule");
        const dayOffEntry = entries.find((entry) => entry.source === "dayoff");
        if (scheduleEntry && dayOffEntry) {
          if (scheduleEntry.type === "leave" && dayOffEntry.type === "leave") {
            return dayOffEntry.sourceUpdatedAt > scheduleEntry.sourceUpdatedAt
              ? dayOffEntry
              : scheduleEntry;
          }
          const winner = dayOffEntry.sourceUpdatedAt > scheduleEntry.sourceUpdatedAt
            ? dayOffEntry
            : scheduleEntry;
          return { ...winner, conflict: true, conflictKey: key };
        }
        return entries[0];
      }).sort((a, b) => dateTime(a) - dateTime(b));
    }

    function recordKey(record) {
      return `${record.year}-${record.month}-${record.day}`;
    }

    function formatRecord(record) {
      const dateText = `${record.month}/${record.day} (${record.weekday})`;
      if (record.type === "shift") return `${dateText} ${record.time}`;
      return `${dateText} 休假`;
    }

    function shiftInfo(record) {
      const match = String(record.time || "").match(/^(\d{1,2}):(\d{2})-/);
      const store = String(record.store || "");
      if (!match) return { className: "mid", label: `${store}中班` };
      const minutes = (Number(match[1]) * 60) + Number(match[2]);
      if (minutes <= (10 * 60) + 59) return { className: "early", label: `${store}早班` };
      if (minutes >= 13 * 60) return { className: "late", label: `${store}晚班` };
      return { className: "mid", label: `${store}中班` };
    }

    function formatScheduleOutput() {
      const changedKeys = new Set(currentMonthData().changedKeys);
      return records()
        .map((record) => `${record.conflict ? "⚠ " : ""}${changedKeys.has(recordKey(record)) ? "★ " : ""}${formatRecord(record)}`)
        .join("\n");
    }

    function recordsByKey(rawText, week) {
      return new Map(
        parseWeekRows(rawText, week)
          .filter((record) => record.type !== "empty")
          .map((record) => [recordKey(record), `${formatRecord(record)} ${record.store || ""}`]),
      );
    }

    function weekDateKeys(week) {
      return Array.from({ length: 7 }, (_, index) => recordKey(dateForWeekDay(week, index)));
    }

    function changedKeysForOverwrite(oldText, newText, week) {
      const before = recordsByKey(oldText, week);
      const after = recordsByKey(newText, week);
      const keys = new Set([...before.keys(), ...after.keys()]);
      return [...keys].filter((key) => after.has(key) && before.get(key) !== after.get(key));
    }

    function dateTime(dateInfo) {
      return new Date(dateInfo.year, dateInfo.month - 1, dateInfo.day).getTime();
    }

    function startOfToday() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    }

    function formatUpdatedAt(timestamp) {
      const value = Number(timestamp) || 0;
      if (!value) return "資料更新：尚未貼上";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "資料更新：尚未貼上";
      return `資料更新：${pad2(date.getMonth() + 1)}/${pad2(date.getDate())} ${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    function touchDataUpdatedAt(monthData = currentMonthData()) {
      monthData.scheduleUpdatedAt = Date.now();
    }

    function lineText() {
      return formatScheduleOutput();
    }

    function calendarRecords() {
      const currentKey = activeMonthKey || monthKeyFromInput();
      const prevKey = monthKeyWithOffset(currentKey, -1);
      const nextKey = monthKeyWithOffset(currentKey, 1);
      const { year, month } = parseMonthKey(currentKey);
      const monthStart = new Date(year, month - 1, 1);
      const monthEnd = new Date(year, month, 0);
      const visibleStart = new Date(year, month - 1, 1 - monthStart.getDay());
      const visibleEnd = new Date(year, month - 1, 42 - monthStart.getDay());
      const entriesByKey = new Map();

      const addEntry = (entry) => {
        const key = recordKey(entry);
        const current = entriesByKey.get(key);
        if (!current || Number(entry.sourceUpdatedAt || 0) >= Number(current.sourceUpdatedAt || 0)) {
          entriesByKey.set(key, entry);
        }
      };

      records(prevKey)
        .filter((entry) => {
          const time = dateTime(entry);
          return time >= visibleStart.getTime() && time < monthStart.getTime();
        })
        .forEach(addEntry);
      records(currentKey).forEach(addEntry);
      records(nextKey)
        .filter((entry) => {
          const time = dateTime(entry);
          return time > monthEnd.getTime() && time <= visibleEnd.getTime();
        })
        .forEach(addEntry);

      return [...entriesByKey.values()].sort((a, b) => dateTime(a) - dateTime(b));
    }

    function renderCalendar() {
      const entries = calendarRecords();
      if (entries.length === 0) {
        output.innerHTML = '<div class="empty-calendar">尚無排班資料</div>';
        return;
      }

      const { year, month } = parseMonthValue();
      const monthStart = new Date(year, month - 1, 1);
      const monthEnd = new Date(year, month, 0);
      const maxEntryTime = Math.max(monthEnd.getTime(), ...entries.map(dateTime));
      const calendarEnd = new Date(maxEntryTime);
      const startOffset = monthStart.getDay();
      const totalDays = Math.ceil((calendarEnd.getTime() - monthStart.getTime()) / 86400000) + 1;
      const totalCells = Math.max(42, Math.ceil((startOffset + totalDays) / 7) * 7);
      const currentKey = activeMonthKey || monthKeyFromInput();
      const changedKeys = new Set([
        ...readMonthData(monthKeyWithOffset(currentKey, -1)).changedKeys,
        ...readMonthData(currentKey).changedKeys,
        ...readMonthData(monthKeyWithOffset(currentKey, 1)).changedKeys,
      ]);
      const entriesByKey = new Map();
      const todayTime = startOfToday();

      entries.forEach((entry) => {
        const key = recordKey(entry);
        if (!entriesByKey.has(key)) entriesByKey.set(key, []);
        entriesByKey.get(key).push(entry);
      });

      const weekdays = WEEKDAYS.map((weekday) => `<div class="calendar-weekday">週${weekday}</div>`).join("");
      const cells = Array.from({ length: totalCells }, (_, cellIndex) => {
        const dayOffset = cellIndex - startOffset;
        const date = new Date(year, month - 1, dayOffset + 1);
        const dateInfo = {
          year: date.getFullYear(),
          month: date.getMonth() + 1,
          day: date.getDate(),
        };
        const key = recordKey(dateInfo);
        const cellTime = dateTime(dateInfo);
        const dayEntries = entriesByKey.get(key) || [];
        const outside = date.getMonth() !== month - 1;
        if (outside && dayEntries.length === 0) return '<div class="calendar-day outside"></div>';
        const adjacentMonthData = outside && dayEntries.length > 0;
        const today = cellTime === todayTime;
        const past = cellTime < todayTime;
        const changed = changedKeys.has(key);
        const conflict = dayEntries.some((entry) => entry.conflict);
        const items = dayEntries.map((entry) => {
          const marker = changed ? "★ " : "";
          const warning = entry.conflict ? "⚠ " : "";
          const shift = entry.type === "shift" ? shiftInfo(entry) : null;
          const label = entry.type === "shift"
            ? `${warning}${marker}${shift.label}`
            : `${warning}${marker}休假`;
          const classes = [
            "day-item",
            entry.type === "leave" ? "leave" : "",
            shift?.className || "",
            changed ? "changed" : "",
            entry.conflict ? "conflict" : "",
          ]
            .filter(Boolean)
            .join(" ");
          if (entry.type === "shift") {
            return `
              <div class="${classes}">
                <span class="shift-label">${escapeHtml(label)}</span>
                <span class="shift-time">${escapeHtml(entry.time)}</span>
              </div>
            `;
          }
          return `<div class="${classes}">${escapeHtml(label)}</div>`;
        }).join("");
        const classes = ["calendar-day", outside ? "outside" : "", adjacentMonthData ? "adjacent-month-data" : "", dayEntries.length ? "has-item" : "", past ? "past" : "", today ? "today" : "", changed ? "changed" : "", conflict ? "conflict" : ""]
          .filter(Boolean)
          .join(" ");
        return `
          <div class="${classes}">
            <div class="day-number">${dateInfo.day}</div>
            ${items}
          </div>
        `;
      }).join("");

      output.innerHTML = `
        <div class="calendar">
          <div class="calendar-head">${weekdays}</div>
          <div class="calendar-grid">${cells}</div>
        </div>
      `;
    }

    function renderWeeks() {
      const monthData = currentMonthData();
      weekButtons.forEach((button) => {
        const week = button.dataset.week;
        button.classList.toggle("active", Number(week) === state.activeWeek);
        button.classList.toggle("saved", Boolean(monthData.weeks[week]));
      });
    }

    function setScheduleEditorExpanded(expanded, shouldFocus = false) {
      scheduleEditorExpanded = expanded;
      scheduleRawPanel.hidden = !expanded;
      scheduleEditToggle.setAttribute("aria-expanded", String(expanded));
      scheduleEditToggle.textContent = expanded ? "收合文字" : "修正文字";
      if (expanded && shouldFocus) scheduleInput.focus();
    }

    function render() {
      renderWeeks();
      const text = lineText();
      const calendarEntries = calendarRecords();
      const hasChanged = currentMonthData().changedKeys.length > 0;
      const hasConflict = calendarEntries.some((record) => record.conflict);
      const titleNotes = [
        hasChanged ? "★為異動" : "",
        hasConflict ? "⚠為衝突" : "",
      ].filter(Boolean);
      resultTitle.textContent = titleNotes.length > 0 ? `行事曆（${titleNotes.join("、")}）` : "行事曆";
      scheduleUpdatedAt.textContent = formatUpdatedAt(currentMonthData().scheduleUpdatedAt);
      renderCalendar();
      resultPanel.classList.toggle("empty", calendarEntries.length === 0);
      status.style.color = "var(--muted)";
      if (text) {
        status.textContent = "排班行事曆已更新";
      } else {
        status.textContent = "選擇週次後會讀取剪貼簿內容";
      }
    }

    function flashButton(button, label, isError = false) {
      const original = button.dataset.originalLabel || button.textContent;
      button.dataset.originalLabel = original;
      window.clearTimeout(Number(button.dataset.feedbackTimer || 0));
      button.textContent = label;
      button.classList.toggle("feedback", !isError);
      button.classList.toggle("feedback-error", isError);
      button.dataset.feedbackTimer = String(window.setTimeout(() => {
        button.textContent = original;
        button.classList.remove("feedback", "feedback-error");
      }, 1500));
    }

    async function readClipboardText() {
      if (!navigator.clipboard?.readText) return "";
      try {
        return await navigator.clipboard.readText();
      } catch {
        return "";
      }
    }

    async function importWeek(week, button) {
      state.activeWeek = Number(week);
      const clipboardText = await readClipboardText();
      const text = clipboardText || scheduleInput.value;
      if (!normalizeText(text)) {
        status.textContent = "剪貼簿沒有內容，可先貼到文字框再按週次";
        status.style.color = "var(--danger)";
        flashButton(button, "無內容", true);
        renderWeeks();
        return;
      }
      scheduleInput.value = text;
      const monthData = currentMonthData();
      const oldText = monthData.weeks[String(week)];
      const nextChangedKeys = oldText ? changedKeysForOverwrite(oldText, text, week) : [];
      const currentChangedKeys = new Set(monthData.changedKeys);
      weekDateKeys(week).forEach((key) => currentChangedKeys.delete(key));
      nextChangedKeys.forEach((key) => currentChangedKeys.add(key));
      monthData.changedKeys = [...currentChangedKeys];
      monthData.weeks[String(week)] = text;
      monthData.weekUpdatedAt[String(week)] = Date.now();
      touchDataUpdatedAt(monthData);
      monthData.scheduleInput = text;
      saveState();
      status.style.color = "var(--muted)";
      flashButton(button, "已覆蓋");
      render();
      status.textContent = oldText
        ? `已覆蓋 wk${week}，${nextChangedKeys.length} 筆異動以 ★ 標記`
        : `已輸入 wk${week}`;
    }

    async function importDayOff() {
      const clipboardText = await readClipboardText();
      const text = clipboardText.replace(/\r/g, "").replace(/\n+$/g, "");
      if (!normalizeText(text)) {
        status.textContent = "剪貼簿沒有排休內容";
        status.style.color = "var(--danger)";
        flashButton(pasteDayOffButton, "無內容", true);
        return;
      }
      const monthData = currentMonthData();
      monthData.dayOffPreviousInput = monthData.dayOffInput;
      monthData.dayOffPreviousUpdatedAt = monthData.dayOffUpdatedAt;
      monthData.dayOffUndoReady = true;
      monthData.dayOffInput = text;
      monthData.dayOffUpdatedAt = Date.now();
      touchDataUpdatedAt(monthData);
      saveState();
      render();
      const dayOffCount = parseDayOffRows().length;
      status.textContent = `已貼上排休，${dayOffCount} 天休假`;
      status.style.color = "var(--muted)";
      flashButton(pasteDayOffButton, "已貼上");
    }

    function restoreDayOff() {
      const monthData = currentMonthData();
      if (!monthData.dayOffUndoReady) {
        status.textContent = "沒有可回復的排休資料";
        status.style.color = "var(--danger)";
        flashButton(restoreDayOffButton, "無資料", true);
        return;
      }
      const currentInput = monthData.dayOffInput;
      const currentUpdatedAt = monthData.dayOffUpdatedAt;
      monthData.dayOffInput = monthData.dayOffPreviousInput;
      monthData.dayOffUpdatedAt = monthData.dayOffPreviousUpdatedAt;
      monthData.dayOffPreviousInput = currentInput;
      monthData.dayOffPreviousUpdatedAt = currentUpdatedAt;
      monthData.dayOffUndoReady = true;
      saveState();
      render();
      const dayOffCount = parseDayOffRows().length;
      status.textContent = dayOffCount > 0 ? `已回復排休，${dayOffCount} 天休假` : "已回復排休，這個月份沒有排休資料";
      status.style.color = "var(--muted)";
      flashButton(restoreDayOffButton, "已回復");
    }

    async function copyOutput() {
      const text = lineText();
      if (!text) {
        flashButton(copyButton, "沒有內容", true);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        flashButton(copyButton, "已複製");
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.append(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        flashButton(copyButton, copied ? "已複製" : "複製失敗", !copied);
      }
    }

    setDefaultMonth();
    activeMonthKey = monthKeyFromInput();
    loadState();
    subscribeRemoteState();
    monthInput.addEventListener("input", handleMonthChange);
    prevMonthButton.addEventListener("click", () => changeMonth(-1));
    nextMonthButton.addEventListener("click", () => changeMonth(1));
    scheduleInput.addEventListener("input", () => {
      touchDataUpdatedAt();
      saveState();
      render();
    });
    weekButtons.forEach((button) => {
      button.addEventListener("click", () => importWeek(button.dataset.week, button));
    });
    document.getElementById("clear-button").addEventListener("click", () => {
      const monthData = currentMonthData();
      monthData.weeks = {};
      monthData.weekUpdatedAt = {};
      monthData.changedKeys = [];
      monthData.scheduleInput = "";
      monthData.scheduleUpdatedAt = 0;
      monthData.dayOffInput = "";
      monthData.dayOffUpdatedAt = 0;
      monthData.dayOffPreviousInput = "";
      monthData.dayOffPreviousUpdatedAt = 0;
      monthData.dayOffUndoReady = false;
      scheduleInput.value = "";
      saveState();
      render();
      setScheduleEditorExpanded(true, true);
    });
    scheduleEditToggle.addEventListener("click", () => {
      setScheduleEditorExpanded(!scheduleEditorExpanded, !scheduleEditorExpanded);
    });
    clearMarksButton.addEventListener("click", () => {
      const monthData = currentMonthData();
      if (monthData.changedKeys.length === 0) {
        flashButton(clearMarksButton, "無標記", true);
        return;
      }
      monthData.changedKeys = [];
      saveState();
      render();
      status.textContent = "異動標記已清除";
      flashButton(clearMarksButton, "已清除");
    });
    pasteDayOffButton.addEventListener("click", importDayOff);
    restoreDayOffButton.addEventListener("click", restoreDayOff);
    copyButton.addEventListener("click", copyOutput);
    setScheduleEditorExpanded(false);
    render();
  </script>
</body>
</html>
