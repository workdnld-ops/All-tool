<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>排班紀錄</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --primary-soft: #e4f0ee;
      --blue: #245b9b;
      --blue-soft: #e7f0fb;
      --rose: #9a3d55;
      --rose-soft: #fbe8ee;
      --danger: #b42318;
      --danger-soft: #fff5f4;
      --shadow: 0 6px 18px rgba(23, 33, 38, 0.06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    button,
    input,
    textarea { font: inherit; }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    .shell {
      width: min(860px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      display: grid;
      align-content: start;
      gap: 8px;
    }

    header {
      min-height: 42px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.28rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .status {
      min-height: 16px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .button,
    .mode-button,
    .week-button,
    .checkbox-label {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .button,
    .mode-button {
      padding: 0 10px;
    }

    .week-button {
      min-height: 30px;
      padding: 0 4px;
      font-size: 0.82rem;
      position: relative;
      gap: 3px;
    }

    .week-button.saved::after {
      content: "✓";
      font-size: 0.72rem;
      line-height: 1;
      font-weight: 900;
    }

    .button.primary,
    .mode-button.active,
    .week-button.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.feedback,
    .week-button.saved {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .week-button.active.saved {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.feedback-error {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .panel,
    .result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 9px;
      display: grid;
      gap: 8px;
    }

    .top-actions,
    .mode-grid,
    .form-grid,
    .week-grid,
    .action-grid {
      display: grid;
      gap: 6px;
    }

    .top-actions,
    .mode-grid,
    .action-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .form-grid {
      grid-template-columns: 148px;
      align-items: end;
    }

    .week-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .view {
      display: grid;
      gap: 8px;
    }

    .view[hidden] {
      display: none;
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 850;
    }

    .checkbox-label {
      min-height: 32px;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      background: #fbfcfc;
      color: var(--ink);
      font-size: 0.9rem;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #b8c6cc;
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font-weight: 750;
      min-width: 0;
    }

    input {
      min-height: 36px;
      padding: 0 9px;
    }

    input[type="checkbox"] {
      width: 18px;
      min-width: 18px;
      height: 18px;
      min-height: 18px;
      padding: 0;
      accent-color: var(--primary);
    }

    textarea {
      min-height: 104px;
      resize: vertical;
      padding: 9px;
      line-height: 1.35;
      word-break: break-word;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.16);
      outline: none;
    }

    .result {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-color: rgba(31, 111, 100, 0.35);
      background: var(--primary-soft);
    }

    .result.empty {
      border-color: rgba(154, 61, 85, 0.28);
      background: var(--rose-soft);
    }

    .result-title {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 900;
    }

    .output {
      min-height: 42px;
      font-size: 0.9rem;
      line-height: 1.55;
      font-weight: 800;
      max-height: 360px;
      overflow-y: auto;
      -webkit-user-select: text;
      user-select: text;
    }

    .calendar {
      display: grid;
      gap: 6px;
    }

    .calendar-head,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .calendar-head {
      min-height: 24px;
      align-items: center;
      overflow: visible;
      padding: 2px 0 4px;
    }

    .calendar-weekday {
      color: var(--muted);
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      line-height: 1.2;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
      overflow: visible;
    }

    .calendar-day {
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px;
      display: grid;
      align-content: start;
      gap: 2px;
      background: #fff;
      color: var(--ink);
      overflow: hidden;
    }

    .calendar-day.outside {
      background: #f8fafb;
      color: var(--muted);
    }

    .calendar-day.has-item {
      border-color: rgba(31, 111, 100, 0.38);
      background: #f5fbf9;
    }

    .calendar-day.changed {
      border-color: #b7791f;
      background: #fff8ea;
    }

    .day-number {
      font-size: 0.74rem;
      line-height: 1;
      font-weight: 900;
    }

    .day-item {
      font-size: 0.68rem;
      line-height: 1.15;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .shift-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 14px;
      border-radius: 5px;
      padding: 1px 4px;
      margin-bottom: 2px;
      color: #fff;
      font-size: 0.58rem;
      line-height: 1.1;
      font-weight: 900;
    }

    .shift-time {
      display: block;
    }

    .day-item.early {
      color: #176b4d;
    }

    .day-item.early .shift-label {
      background: #1f8a5b;
    }

    .day-item.mid {
      color: #7a5b00;
    }

    .day-item.mid .shift-label {
      background: #c99718;
    }

    .day-item.late {
      color: #245b9b;
    }

    .day-item.late .shift-label {
      background: #2f6fb4;
    }

    .day-item.leave {
      color: var(--rose);
    }

    .day-item.changed {
      color: #9a5a00;
    }

    .empty-calendar {
      color: var(--muted);
      min-height: 42px;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    @media (max-width: 620px) {
      h1 { font-size: 1.18rem; }
      .form-grid { grid-template-columns: 1fr; }
      .week-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .button,
      .mode-button,
      .week-button { padding: 0 3px; }
      textarea { min-height: 96px; }
      .output {
        max-height: 312px;
      }
      .calendar-grid,
      .calendar-head {
        gap: 3px;
      }
      .calendar-head {
        min-height: 26px;
        padding-bottom: 5px;
      }
      .calendar-weekday {
        min-height: 20px;
        font-size: 0.62rem;
        line-height: 1.2;
      }
      .calendar-day {
        min-height: 48px;
        border-radius: 6px;
        padding: 3px;
      }
      .day-number {
        font-size: 0.68rem;
      }
      .day-item {
        font-size: 0.6rem;
      }
      .shift-label {
        font-size: 0.52rem;
        padding: 1px 3px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>排班紀錄</h1>
        <div class="status" id="status">選擇週次後會讀取剪貼簿內容</div>
      </div>
      <div class="top-actions">
        <a class="button" href="../../index.html">工具箱</a>
      </div>
    </header>

    <section class="panel">
      <div class="mode-grid" aria-label="模式">
        <button class="mode-button active" type="button" data-mode="schedule">排班</button>
        <button class="mode-button" type="button" data-mode="dayoff">排休</button>
      </div>
      <div class="form-grid">
        <label>
          月份
          <input id="month-input" type="month" aria-label="月份">
        </label>
      </div>
      <div class="view" id="schedule-view">
        <div class="week-grid" aria-label="週次">
          <button class="week-button" type="button" data-week="1">wk1</button>
          <button class="week-button" type="button" data-week="2">wk2</button>
          <button class="week-button" type="button" data-week="3">wk3</button>
          <button class="week-button" type="button" data-week="4">wk4</button>
          <button class="week-button" type="button" data-week="5">wk5</button>
        </div>
        <textarea id="schedule-input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="也可以手動貼上後，按 wk1-wk5 覆蓋該週" aria-label="貼上排班內容"></textarea>
      </div>
      <div class="view" id="dayoff-view" hidden>
        <label class="checkbox-label">
          <input id="planned-input" type="checkbox">
          預計
        </label>
        <textarea id="dayoff-input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="貼上排休欄位內容" aria-label="貼上排休內容"></textarea>
      </div>
    </section>

    <section class="result empty" id="result-panel" aria-label="行事曆預覽">
      <div class="result-title" id="result-title">行事曆</div>
      <div class="output" id="output">尚無排班資料</div>
    </section>

    <div class="action-grid">
      <button class="button" id="clear-button" type="button">清空</button>
      <button class="button primary" id="copy-button" type="button">複製</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getDatabase,
      onValue,
      ref,
      serverTimestamp,
      set,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6aZhiruY_wqBfNPElCsybIQvKByld6_8",
      authDomain: "money-card-6bf98.firebaseapp.com",
      databaseURL: "https://money-card-6bf98-default-rtdb.firebaseio.com",
      projectId: "money-card-6bf98",
      storageBucket: "money-card-6bf98.firebasestorage.app",
      messagingSenderId: "245245451690",
      appId: "1:245245451690:web:e939a519af0009b8d1dfd3",
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const remoteStateRef = ref(database, "users/single-user/scheduleRecord/state");

    const LEAVE_KEYWORDS = [
      "特休",
      "優先",
      "次優",
      "排休",
      "公假",
      "事假休",
      "滑雪假休",
      "年假例休",
      "家庭照護假",
    ];

    const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
    const MONTH_STORAGE_KEY = "scheduleRecordSelectedMonth";
    const STATE_STORAGE_KEY = "scheduleRecordWeeks";
    const LAST_INPUT_STORAGE_KEY = "scheduleRecordLastInput";
    const MODE_STORAGE_KEY = "scheduleRecordMode";
    const DAYOFF_INPUT_STORAGE_KEY = "scheduleRecordDayOffInput";
    const DAYOFF_PLANNED_STORAGE_KEY = "scheduleRecordDayOffPlanned";
    const CHANGED_KEYS_STORAGE_KEY = "scheduleRecordChangedKeys";

    const monthInput = document.getElementById("month-input");
    const scheduleInput = document.getElementById("schedule-input");
    const dayOffInput = document.getElementById("dayoff-input");
    const plannedInput = document.getElementById("planned-input");
    const scheduleView = document.getElementById("schedule-view");
    const dayOffView = document.getElementById("dayoff-view");
    const status = document.getElementById("status");
    const resultPanel = document.getElementById("result-panel");
    const resultTitle = document.getElementById("result-title");
    const output = document.getElementById("output");
    const copyButton = document.getElementById("copy-button");
    const weekButtons = Array.from(document.querySelectorAll("[data-week]"));
    const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));

    const state = {
      mode: "schedule",
      weeks: {},
      activeWeek: 1,
      changedKeys: [],
    };
    let applyingRemoteState = false;
    let remoteReady = false;
    let remoteSaveTimer = 0;

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function setDefaultMonth() {
      const savedMonth = localStorage.getItem(MONTH_STORAGE_KEY);
      if (/^\d{4}-\d{2}$/.test(savedMonth || "")) {
        monthInput.value = savedMonth;
        return;
      }
      const now = new Date();
      monthInput.value = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STATE_STORAGE_KEY) || "{}");
        if (saved && typeof saved === "object") state.weeks = saved;
      } catch {
        state.weeks = {};
      }
      try {
        const savedChangedKeys = JSON.parse(localStorage.getItem(CHANGED_KEYS_STORAGE_KEY) || "[]");
        if (Array.isArray(savedChangedKeys)) state.changedKeys = savedChangedKeys;
      } catch {
        state.changedKeys = [];
      }
      scheduleInput.value = localStorage.getItem(LAST_INPUT_STORAGE_KEY) || "";
      dayOffInput.value = localStorage.getItem(DAYOFF_INPUT_STORAGE_KEY) || "";
      plannedInput.checked = localStorage.getItem(DAYOFF_PLANNED_STORAGE_KEY) === "true";
      const savedMode = localStorage.getItem(MODE_STORAGE_KEY);
      if (savedMode === "schedule" || savedMode === "dayoff") state.mode = savedMode;
    }

    function persistLocalState() {
      localStorage.setItem(STATE_STORAGE_KEY, JSON.stringify(state.weeks));
      localStorage.setItem(LAST_INPUT_STORAGE_KEY, scheduleInput.value);
      localStorage.setItem(DAYOFF_INPUT_STORAGE_KEY, dayOffInput.value);
      localStorage.setItem(DAYOFF_PLANNED_STORAGE_KEY, String(plannedInput.checked));
      localStorage.setItem(MODE_STORAGE_KEY, state.mode);
      localStorage.setItem(CHANGED_KEYS_STORAGE_KEY, JSON.stringify(state.changedKeys));
    }

    function saveState() {
      persistLocalState();
      if (!applyingRemoteState) scheduleRemoteSave();
    }

    function remoteSnapshot() {
      return {
        activeWeek: state.activeWeek,
        changedKeys: state.changedKeys,
        dayOffInput: dayOffInput.value,
        mode: state.mode,
        month: monthInput.value,
        planned: plannedInput.checked,
        scheduleInput: scheduleInput.value,
        updatedAt: serverTimestamp(),
        weeks: state.weeks,
      };
    }

    function applyRemoteState(data) {
      applyingRemoteState = true;
      if (/^\d{4}-\d{2}$/.test(data?.month || "")) {
        monthInput.value = data.month;
        localStorage.setItem(MONTH_STORAGE_KEY, data.month);
      }
      if (data?.mode === "schedule" || data?.mode === "dayoff") state.mode = data.mode;
      state.activeWeek = Number(data?.activeWeek) || 1;
      state.weeks = data?.weeks && typeof data.weeks === "object" ? data.weeks : {};
      state.changedKeys = Array.isArray(data?.changedKeys) ? data.changedKeys : [];
      scheduleInput.value = String(data?.scheduleInput || "");
      dayOffInput.value = String(data?.dayOffInput || "");
      plannedInput.checked = Boolean(data?.planned);
      applyingRemoteState = false;
      persistLocalState();
      render();
    }

    async function saveRemoteStateNow() {
      if (applyingRemoteState) return;
      try {
        await set(remoteStateRef, remoteSnapshot());
        remoteReady = true;
      } catch (error) {
        console.error("Schedule record sync error:", error);
        status.textContent = "雲端同步失敗，暫存於本機";
        status.style.color = "var(--danger)";
      }
    }

    function scheduleRemoteSave() {
      window.clearTimeout(remoteSaveTimer);
      remoteSaveTimer = window.setTimeout(saveRemoteStateNow, remoteReady ? 250 : 0);
    }

    function subscribeRemoteState() {
      onValue(
        remoteStateRef,
        (snapshot) => {
          const data = snapshot.val();
          remoteReady = true;
          if (data) {
            applyRemoteState(data);
            return;
          }
          saveRemoteStateNow();
        },
        (error) => {
          console.error("Schedule record read error:", error);
          status.textContent = "雲端同步讀取失敗，暫用本機紀錄";
          status.style.color = "var(--danger)";
        },
      );
    }

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFKC")
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "")
        .trim();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function parseMonthValue() {
      const match = /^(\d{4})-(\d{2})$/.exec(monthInput.value);
      if (!match) {
        const now = new Date();
        return { year: now.getFullYear(), month: now.getMonth() + 1 };
      }
      return { year: Number(match[1]), month: Number(match[2]) };
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function isValidDate(year, month, day) {
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
    }

    function dateForWeekDay(week, index) {
      const { year, month } = parseMonthValue();
      const day = ((Number(week) - 1) * 7) + index + 1;
      const date = new Date(year, month - 1, day);
      return {
        year: date.getFullYear(),
        month: date.getMonth() + 1,
        day: date.getDate(),
        weekday: WEEKDAYS[date.getDay()],
        timestamp: date.getTime(),
      };
    }

    function normalizeTime(hour, minute = "00") {
      const parsedHour = Number(hour);
      if (!Number.isInteger(parsedHour) || parsedHour > 23) return "";
      return `${pad2(parsedHour)}:${minute}`;
    }

    function findShiftTime(cells) {
      const values = cells.map(normalizeText).filter(Boolean);
      const joined = values.join(" ");
      const rangeText = normalizeText(joined)
        .replace(/[~～至]/g, "-")
        .replace(/\s+/g, " ");
      const range = rangeText.match(/(\d{1,2})(?::?(\d{2}))\s*-\s*(\d{1,2})(?::?(\d{2}))/);
      if (range) {
        const start = normalizeTime(range[1], range[2]);
        const end = normalizeTime(range[3], range[4]);
        if (start && end) return `${start}-${end}`;
      }
      const times = [];
      for (const value of values) {
        const match = value.match(/^(\d{1,2}):(\d{2})$/);
        if (!match) continue;
        const time = normalizeTime(match[1], match[2]);
        if (time) times.push(time);
        if (times.length >= 2) break;
      }
      return times.length >= 2 ? `${times[0]}-${times[1]}` : "";
    }

    function hasLeaveText(cells) {
      const text = normalizeText(cells.join(" "));
      return LEAVE_KEYWORDS.some((keyword) => text.includes(keyword));
    }

    function parseDateFromCells(cells, fallbackYear, fallbackMonth) {
      const joined = cells.map(normalizeText).join(" ");
      const full = joined.match(/(?<!\d)(20\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})(?!\d)/);
      if (full) {
        const year = Number(full[1]);
        const month = Number(full[2]);
        const day = Number(full[3]);
        if (isValidDate(year, month, day)) return { year, month, day };
      }
      const monthDay = joined.match(/(?<!\d)(\d{1,2})\s*(?:\/|月)\s*(\d{1,2})\s*(?:日)?(?!\d)/);
      if (monthDay) {
        const month = Number(monthDay[1]);
        const day = Number(monthDay[2]);
        if (isValidDate(fallbackYear, month, day)) return { year: fallbackYear, month, day };
      }
      const dayOnly = joined.match(/(?<!\d)(\d{1,2})\s*日(?!\d)/);
      if (dayOnly) {
        const day = Number(dayOnly[1]);
        if (isValidDate(fallbackYear, fallbackMonth, day)) {
          return { year: fallbackYear, month: fallbackMonth, day };
        }
      }
      return null;
    }

    function parseWeekRows(rawText, week) {
      const values = rawText
        .replace(/\r/g, "")
        .split(/\n|\t/g)
        .map(normalizeText);
      const dataValues = values.slice(4);
      return Array.from({ length: 7 }, (_, index) => {
        const cells = dataValues.slice(index * 25, (index + 1) * 25);
        const text = normalizeText(cells.join(" "));
        const date = dateForWeekDay(week, index);
        const time = findShiftTime(cells);
        const isLeave = !time && hasLeaveText(cells);
        return {
          ...date,
          week: Number(week),
          rowIndex: index,
          text,
          time,
          type: time ? "shift" : isLeave ? "leave" : "empty",
        };
      });
    }

    function records() {
      return Object.entries(state.weeks)
        .flatMap(([week, rawText]) => parseWeekRows(rawText, week))
        .filter((record) => record.type !== "empty")
        .sort((a, b) => dateTime(a) - dateTime(b));
    }

    function recordKey(record) {
      return `${record.year}-${record.month}-${record.day}`;
    }

    function formatRecord(record) {
      const dateText = `${record.month}/${record.day} (${record.weekday})`;
      if (record.type === "shift") return `${dateText} ${record.time}`;
      return `${dateText} 休假`;
    }

    function shiftInfo(record) {
      const match = String(record.time || "").match(/^(\d{1,2}):(\d{2})-/);
      if (!match) return { className: "mid", label: "中班" };
      const minutes = (Number(match[1]) * 60) + Number(match[2]);
      if (minutes <= (10 * 60) + 59) return { className: "early", label: "早班" };
      if (minutes >= 13 * 60) return { className: "late", label: "晚班" };
      return { className: "mid", label: "中班" };
    }

    function formatScheduleOutput() {
      const changedKeys = new Set(state.changedKeys);
      return records()
        .map((record) => `${changedKeys.has(recordKey(record)) ? "★ " : ""}${formatRecord(record)}`)
        .join("\n");
    }

    function recordsByKey(rawText, week) {
      return new Map(
        parseWeekRows(rawText, week)
          .filter((record) => record.type !== "empty")
          .map((record) => [recordKey(record), formatRecord(record)]),
      );
    }

    function weekDateKeys(week) {
      return Array.from({ length: 7 }, (_, index) => recordKey(dateForWeekDay(week, index)));
    }

    function changedKeysForOverwrite(oldText, newText, week) {
      const before = recordsByKey(oldText, week);
      const after = recordsByKey(newText, week);
      const keys = new Set([...before.keys(), ...after.keys()]);
      return [...keys].filter((key) => after.has(key) && before.get(key) !== after.get(key));
    }

    function formatDate(dateInfo) {
      const date = new Date(dateInfo.year, dateInfo.month - 1, dateInfo.day);
      return `${dateInfo.month}/${dateInfo.day}(${WEEKDAYS[date.getDay()]})`;
    }

    function dateTime(dateInfo) {
      return new Date(dateInfo.year, dateInfo.month - 1, dateInfo.day).getTime();
    }

    function formatDateGroups(dates) {
      const groups = [];
      let currentGroup = [];
      dates.forEach((dateInfo) => {
        const previous = currentGroup[currentGroup.length - 1];
        const isContinuous = previous && dateTime(dateInfo) - dateTime(previous) === 86400000;
        if (!previous || isContinuous) {
          currentGroup.push(dateInfo);
          return;
        }
        groups.push(currentGroup);
        currentGroup = [dateInfo];
      });
      if (currentGroup.length > 0) groups.push(currentGroup);
      return groups.map((group) => group.map(formatDate).join("、")).join("\n");
    }

    function dayOffDates() {
      const rawText = dayOffInput.value.replace(/\r/g, "").replace(/\n+$/g, "");
      const rawRows = rawText ? rawText.split("\n") : [];
      const rows = rawRows.map((line) => line.split("\t"));
      const { year, month } = parseMonthValue();
      const maxDay = daysInMonth(year, month);
      const dates = [];
      rows.forEach((cells, index) => {
        if (!hasLeaveText(cells)) return;
        let dateInfo = parseDateFromCells(cells, year, month);
        if (!dateInfo) {
          const day = index + 1;
          if (day < 1 || day > maxDay) return;
          dateInfo = { year, month, day };
        }
        dates.push(dateInfo);
      });
      const unique = [];
      const seen = new Set();
      dates.forEach((dateInfo) => {
        const key = `${dateInfo.year}-${dateInfo.month}-${dateInfo.day}`;
        if (seen.has(key)) return;
        seen.add(key);
        unique.push(dateInfo);
      });
      return unique.sort((a, b) => dateTime(a) - dateTime(b));
    }

    function dayOffRecords() {
      return dayOffDates().map((dateInfo) => ({
        ...dateInfo,
        type: "leave",
      }));
    }

    function formatDayOffOutput() {
      const dates = dayOffDates();
      const groupedDates = formatDateGroups(dates);
      if (!groupedDates) return "";
      const { month } = parseMonthValue();
      const title = plannedInput.checked ? `${month}月預計休假：` : `${month}月休假：`;
      return `${title}\n${groupedDates}`;
    }

    function lineText() {
      return state.mode === "schedule" ? formatScheduleOutput() : formatDayOffOutput();
    }

    function calendarRecords() {
      return state.mode === "schedule" ? records() : dayOffRecords();
    }

    function renderCalendar() {
      const entries = calendarRecords();
      if (entries.length === 0) {
        output.innerHTML = `<div class="empty-calendar">${state.mode === "schedule" ? "尚無排班資料" : "尚無休假日期"}</div>`;
        return;
      }

      const { year, month } = parseMonthValue();
      const monthStart = new Date(year, month - 1, 1);
      const monthEnd = new Date(year, month, 0);
      const maxEntryTime = Math.max(monthEnd.getTime(), ...entries.map(dateTime));
      const calendarEnd = new Date(maxEntryTime);
      const startOffset = monthStart.getDay();
      const totalDays = Math.ceil((calendarEnd.getTime() - monthStart.getTime()) / 86400000) + 1;
      const totalCells = Math.ceil((startOffset + totalDays) / 7) * 7;
      const changedKeys = new Set(state.changedKeys);
      const entriesByKey = new Map();

      entries.forEach((entry) => {
        const key = recordKey(entry);
        if (!entriesByKey.has(key)) entriesByKey.set(key, []);
        entriesByKey.get(key).push(entry);
      });

      const weekdays = WEEKDAYS.map((weekday) => `<div class="calendar-weekday">週${weekday}</div>`).join("");
      const cells = Array.from({ length: totalCells }, (_, cellIndex) => {
        const dayOffset = cellIndex - startOffset;
        if (dayOffset < 0) return '<div class="calendar-day outside"></div>';
        const date = new Date(year, month - 1, dayOffset + 1);
        const dateInfo = {
          year: date.getFullYear(),
          month: date.getMonth() + 1,
          day: date.getDate(),
        };
        const key = recordKey(dateInfo);
        const dayEntries = entriesByKey.get(key) || [];
        const outside = date.getMonth() !== month - 1;
        const changed = changedKeys.has(key);
        const items = dayEntries.map((entry) => {
          const marker = changed && state.mode === "schedule" ? "★ " : "";
          const shift = entry.type === "shift" ? shiftInfo(entry) : null;
          const label = entry.type === "shift"
            ? `${marker}${shift.label}`
            : `${marker}休假`;
          const classes = [
            "day-item",
            entry.type === "leave" ? "leave" : "",
            shift?.className || "",
            changed ? "changed" : "",
          ]
            .filter(Boolean)
            .join(" ");
          if (entry.type === "shift") {
            return `
              <div class="${classes}">
                <span class="shift-label">${escapeHtml(label)}</span>
                <span class="shift-time">${escapeHtml(entry.time)}</span>
              </div>
            `;
          }
          return `<div class="${classes}">${escapeHtml(label)}</div>`;
        }).join("");
        const classes = ["calendar-day", outside ? "outside" : "", dayEntries.length ? "has-item" : "", changed ? "changed" : ""]
          .filter(Boolean)
          .join(" ");
        return `
          <div class="${classes}">
            <div class="day-number">${dateInfo.day}</div>
            ${items}
          </div>
        `;
      }).join("");

      output.innerHTML = `
        <div class="calendar">
          <div class="calendar-head">${weekdays}</div>
          <div class="calendar-grid">${cells}</div>
        </div>
      `;
    }

    function renderWeeks() {
      weekButtons.forEach((button) => {
        const week = button.dataset.week;
        button.classList.toggle("active", Number(week) === state.activeWeek);
        button.classList.toggle("saved", Boolean(state.weeks[week]));
      });
    }

    function renderMode() {
      scheduleView.hidden = state.mode !== "schedule";
      dayOffView.hidden = state.mode !== "dayoff";
      modeButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === state.mode);
      });
    }

    function render() {
      renderMode();
      renderWeeks();
      const text = lineText();
      const hasChanged = state.mode === "schedule" && state.changedKeys.length > 0;
      resultTitle.textContent = hasChanged ? "行事曆（★為異動）" : "行事曆";
      renderCalendar();
      resultPanel.classList.toggle("empty", !text);
      status.style.color = "var(--muted)";
      if (text) {
        status.textContent = state.mode === "schedule" ? "排班行事曆已更新" : "排休行事曆已更新";
      } else {
        status.textContent = state.mode === "schedule" ? "選擇週次後會讀取剪貼簿內容" : "貼上排休內容後會自動整理";
      }
    }

    function flashButton(button, label, isError = false) {
      const original = button.dataset.originalLabel || button.textContent;
      button.dataset.originalLabel = original;
      window.clearTimeout(Number(button.dataset.feedbackTimer || 0));
      button.textContent = label;
      button.classList.toggle("feedback", !isError);
      button.classList.toggle("feedback-error", isError);
      button.dataset.feedbackTimer = String(window.setTimeout(() => {
        button.textContent = original;
        button.classList.remove("feedback", "feedback-error");
      }, 1500));
    }

    async function readClipboardText() {
      if (!navigator.clipboard?.readText) return "";
      try {
        return await navigator.clipboard.readText();
      } catch {
        return "";
      }
    }

    async function importWeek(week, button) {
      state.activeWeek = Number(week);
      const clipboardText = await readClipboardText();
      const text = clipboardText || scheduleInput.value;
      if (!normalizeText(text)) {
        status.textContent = "剪貼簿沒有內容，可先貼到文字框再按週次";
        status.style.color = "var(--danger)";
        flashButton(button, "無內容", true);
        renderWeeks();
        return;
      }
      scheduleInput.value = text;
      const oldText = state.weeks[String(week)];
      const nextChangedKeys = oldText ? changedKeysForOverwrite(oldText, text, week) : [];
      const currentChangedKeys = new Set(state.changedKeys);
      weekDateKeys(week).forEach((key) => currentChangedKeys.delete(key));
      nextChangedKeys.forEach((key) => currentChangedKeys.add(key));
      state.changedKeys = [...currentChangedKeys];
      state.weeks[String(week)] = text;
      saveState();
      status.style.color = "var(--muted)";
      flashButton(button, "已覆蓋");
      render();
      status.textContent = oldText
        ? `已覆蓋 wk${week}，${nextChangedKeys.length} 筆異動以 ★ 標記`
        : `已輸入 wk${week}`;
    }

    async function copyOutput() {
      const text = lineText();
      if (!text) {
        flashButton(copyButton, "沒有內容", true);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        flashButton(copyButton, "已複製");
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.append(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        flashButton(copyButton, copied ? "已複製" : "複製失敗", !copied);
      }
    }

    setDefaultMonth();
    loadState();
    subscribeRemoteState();
    monthInput.addEventListener("input", () => {
      if (/^\d{4}-\d{2}$/.test(monthInput.value)) {
        localStorage.setItem(MONTH_STORAGE_KEY, monthInput.value);
      }
      saveState();
      render();
    });
    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        saveState();
        render();
      });
    });
    scheduleInput.addEventListener("input", saveState);
    dayOffInput.addEventListener("input", () => {
      saveState();
      render();
    });
    plannedInput.addEventListener("input", () => {
      saveState();
      render();
    });
    weekButtons.forEach((button) => {
      button.addEventListener("click", () => importWeek(button.dataset.week, button));
    });
    document.getElementById("clear-button").addEventListener("click", () => {
      if (state.mode === "schedule") {
        state.weeks = {};
        state.changedKeys = [];
        scheduleInput.value = "";
      } else {
        dayOffInput.value = "";
      }
      saveState();
      render();
      (state.mode === "schedule" ? scheduleInput : dayOffInput).focus();
    });
    copyButton.addEventListener("click", copyOutput);
    render();
  </script>
</body>
</html>
