us:10px;background:#f4f7fb;color:#60738d;font-size:12px;padding:9px 11px;margin-top:9px;line-height:1.55}.muted{color:var(--muted)}.help{font-size:11px;color:#76859a;margin-top:6px;line-height:1.5}.formline{font-size:12px;padding:10px 11px;color:#577090;background:#f5f8fc;border-radius:10px;margin-top:10px}.resultCard{position:sticky;top:18px}.resultHead{background:#eaf0f8}.resultHead .stepNum{background:#345d96;color:#fff}.resultStatus{font-size:12px;line-height:1.5;padding:11px 12px;margin-bottom:12px;border-radius:10px;background:var(--warnp);color:var(--warn);font-weight:700}.resultStatus.good{background:var(--goodp);color:var(--good)}.summary{border:1px solid #e1e6ef;border-radius:12px;overflow:hidden;margin-bottom:11px}.summaryRow{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px 12px;background:#f9fbfd;font-size:13px}.summaryRow+.summaryRow{border-top:1px solid #e8edf3}.summaryRow b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}.total{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 13px;background:#eaf5ff;border-radius:12px;color:#215c9c;font-weight:760;margin-bottom:14px}.total.positive{background:#e7f7ed;color:#0f7546}.total.zero{background:#eaf5ff;color:#245c92}.total.negative{background:#fff2e9;color:#ad5b1d}.total .amount{font-size:24px;white-space:nowrap;letter-spacing:-.045em}.outputBlock{border:1px solid #e2e8f0;border-radius:12px;margin-top:11px;overflow:hidden}.outputHead{background:#f7f9fc;display:flex;justify-content:space-between;align-items:center;padding:9px 10px 9px 12px;gap:8px;font-size:13px;font-weight:760}.copyBtn{border:1px solid #315b99;background:#315b99;border-radius:9px;color:#fff;padding:9px 12px;font-size:12px;font-weight:750;min-height:37px;white-space:nowrap}.copyBtn:hover:not(:disabled){background:#264979}.copyBtn.secondary{background:#fff;color:#315b99}.outputText{padding:11px 12px 14px;line-height:1.65;font-size:13px;color:#34435b;overflo @media(max-width:820px){.numGrid{grid-template-columns:1fr;gap:17px}.categoryBtn{min-height:40px}}

/* V2: 桌面版濃縮為兩張可同時檢視的操作卡；手機保留可觸控面積。 */
.shell{max-width:1440px;padding:16px 20px 28px}
.topbar{margin-bottom:12px}
.title{font-size:24px}
.layout{grid-template-columns:minmax(0,1.52fr) minmax(360px,.82fr);gap:12px}
.forms{gap:10px}
.cardhead{padding:10px 13px}
.cardhead h2{font-size:15px}
.cardbody{padding:12px 14px}
.field{padding-bottom:10px}
.field+.field{padding-top:10px}
.fieldtitle{margin-bottom:7px;font-size:12px}
.choice{font-size:12px;min-height:39px;padding:7px 8px;border-radius:9px}
.segRow{gap:5px}
.segRow .choice{min-height:41px}
.categoryRow{gap:5px;margin-bottom:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.categoryRow::-webkit-scrollbar,.scrollTrack::-webkit-scrollbar{display:none}
.categoryBtn{min-height:32px;padding:6px 10px;white-space:nowrap;font-size:11px;flex:0 0 auto}
.courseField .fieldtitle{align-items:center}
.selectedSummary{margin:0;min-height:0;flex:1;font-size:11px;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scrollShell{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;align-items:stretch;gap:5px;min-width:0}
.scrollArrow{border:1px solid var(--line);border-radius:9px;background:#f1f5fa;color:#315b99;font-weight:700;font-size:21px;min-height:39px;padding:0;touch-action:manipulation}
.scrollArrow:disabled{opacity:.3}
.scrollTrack{display:flex;align-items:stretch;flex-wrap:nowrap;gap:6px;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;touch-action:pan-x;padding:1px 1px 2px}
.scrollTrack>.choice{flex:0 0 auto;white-space:nowrap;overflow-wrap:normal;scroll-snap-align:start;min-height:38px;padding:7px 23px 7px 10px;max-width:none;font-size:12px}
.compactPair{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(155px,.6fr);gap:12px;align-items:start}
.compactPair .compactCell,.compactPair .compactCell+.compactCell{padding:0;border:0;min-width:0}
.compactRow{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:center;gap:11px}
.compactRow>.fieldtitle{margin:0}
.stepper{grid-template-columns:35px minmax(0,1fr) 35px;min-height:41px}
.stepper button{height:41px;font-size:20px}
.stepper input{font-size:15px;padding:5px}
.inlineNumber{gap:5px}



.formline{margin-top:2px;padding:8px 10px}
.resultCard{top:12px}
.resultContent{padding:12px}
.resultStatus{padding:8px 10px;margin-bottom:9px}
.summaryRow{padding:8px 10px}
.summaryRow b{font-size:14px}
.total{padding:12px;margin-bottom:10px}
.total .amount{font-size:23px}
.outputBlock{margin-top:8px}
.outputText{padding:9px 10px;line-height:1.5}
.outputHead{padding:7px 9px 7px 10px}
.footnote{font-size:10px;margin-top:8px}

@media(min-width:821px) and (max-width:1120px){
 .layout{grid-template-columns:minmax(0,1.24fr) minmax(325px,.8fr)}
 .compactPair{grid-template-columns:minmax(0,1.32fr) minmax(133px,.68fr);gap:8px}
 .segRow .choice{font-size:11px;padding:6px 4px}
 .scrollTrack>.choice{font-size:11px}
}
@media(max-width:820px){
 .shell{padding:13px 13px 12px}
 .title{font-size:22px}
 .layout{display:block}
 .cardhead{padding:12px 13px}
 .cardbody{padding:13px}
 .fieldtitle{font-size:13px}
 .field{padding-bottom:13px}
 .field+.field{padding-top:13px}
 .categoryRow{gap:6px}
 .categoryBtn{min-height:39px;padding:7px 11px;font-size:12px}
 .selectedSummary{font-size:11px;max-width:63%}
 .scrollShell{grid-template-columns:30px minmax(0,1fr) 30px;gap:4px}
 .scrollArrow{min-height:45px}
 .scrollTrack>.choice{min-height:45px;font-size:13px;padding:9px 23px 9px 12px}
 .compactPair{grid-template-columns:1fr;gap:12px}
 .compactPair .compactCell+.compactCell{padding-top:11px;border-top:1px solid #f0f3f7}
 .compactRow{grid-template-columns:1fr;gap:7px}
 .compactRow>.fieldtitle{margin-bottom:0}
 .segRow .choice{min-height:45px;font-size:12px}
 .stepper{grid-template-columns:44px 1fr 44px}
 .stepper button{height:45px}
 .resultContent{padding:13px}
}
@media(max-width:380px){
 .categoryBtn{padding:7px 9px}
 .scrollTrack>.choice{font-size:12px}
}
.headerActions a{display:inline-flex;align-items:center;text-decoration:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,.outputText.manualCopy{user-select:text;-webkit-user-select:text}
.outputText{user-select:none;-webkit-user-select:none}
.discountField .inlineNumber{max-width:240px}
.configBar{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--muted);font-size:12px;min-width:0}
.configBar span{flex:1;overflow-wrap:anywhere}.configBar button{flex:none;border:1px solid var(--line);background:white;color:var(--blue);border-radius:6px;min-height:36px;padding:5px 10px;font-size:12px}
.configBar[data-error="true"]{color:var(--red)}
@media(max-width:820px){
 .topbar{align-items:center;flex-wrap:nowrap}
 .topbar>div:first-child{display:flex;align-items:baseline;gap:8px}
 .topbar .brand,.topbar .title{margin:0}
 .headerActions{flex-wrap:nowrap;flex-shrink:0}
 .headerActions .plainBtn{min-height:44px;white-space:nowrap}
 .stepper input{font-size:16px}
 .discountField .inlineNumber{max-width:none}
}
</style>

<body>
<main class="shell">
<header class="topbar">
<div><div class="brand">iSKI</div><h1 class="title">補差價</h1></div>
<div class="headerActions"><a class="plainBtn" href="../../index.html">工具箱</a><button class="plainBtn" id="resetBtn" title="清空目前選擇">重設</button></div>
</header>
<div class="configBar" id="configBar"><span id="configStatus" role="status" aria-live="polite">正在讀取 Google 試算表價目…</span><button id="refreshPrices" type="button" disabled>更新價目</button></div>
<nav class="mobileNav" aria-label="操作步驟"><button class="isOn" type="button" data-step-tab="1">① 原課程</button><button type="button" data-step-tab="2">② 目標課程</button><button type="button" data-step-tab="3">③ 文字結果</button></nav>
<div class="layout">
<section class="forms" aria-label="計算欄位">
<article class="card stepCard mobileActive" id="step1">
<div class="cardhead"><div class="stepNum">1</div><h2>原課程</h2><span class="sub">計算剩餘價值</span></div>
<div class="cardbody">
<div class="field courseField">
  <div class="fieldtitle"><span>原課程級別 <span class="required">*</span></span><span class="selectedSummary" id="srcSelected">尚未選擇課程</span></div>
  <div id="srcCategories" class="categoryRow" aria-label="原課程分類"></div>
  <div class="scrollShell" data-scroll-shell="srcCourses">
    <button type="button" class="scrollArrow" data-slide="-1" aria-label="向左查看原課程" title="上一組">‹</button>
    <div id="srcCourses" class="scrollTrack" aria-label="左右滑動選擇原課程"></div>
    <button type="button" class="scrollArrow" data-slide="1" aria-label="向右查看原課程" title="下一組">›</button>
  </div>
</div>
<div class="field compactPair">
  <div class="field compactCell">
    <div class="fieldtitle"><span>原課程價格類型 <span class="required">*</span></span></div>
    <div id="srcPrices" class="segRow"></div>
    <div id="sourcePriceNote" class="help"></div>
  </div>
  <div class="field compactCell compactCount">
    <div class="fieldtitle"><span>剩餘堂數 <span class="required">*</span></span></div>
    <div class="inlineNumber"><div class="stepper"><button type="button" data-adjust="remaining:-1" aria-label="減少剩餘堂數">−</button><input type="text" inputmode="numeric" id="remaining" aria-label="剩餘堂數（剩餘徽章）"><button type="button" data-adjust="remaining:1" aria-label="增加剩餘堂數">+</button></div><span class="unit">堂</span></div>
  </div>
</div>
<div class="field compactRow discountField">
  <div class="fieldtitle">原課程額外折扣（%）</div>
  <div class="inlineNumber"><div class="stepper"><button type="button" data-adjust="srcDiscount:-1" aria-label="減少原課程折扣">−</button><input id="srcDiscount" type="text" inputmode="decimal" aria-label="原課程折扣百分比"><button type="button" data-adjust="srcDiscount:1" aria-label="增加原課程折扣">+</button></div><span class="unit">%</span></div>
</div>
</div>
</article>
<article class="card stepCard" id="step2">
<div class="cardhead"><div class="stepNum">2</div><h2>目標課程</h2><span class="sub">選擇轉換方案</span></div>
<div class="cardbody">
<div class="field compactRow convertRow">
  <div class="fieldtitle"><span>轉換類型 <span class="required">*</span></span></div><div class="segRow" id="conversionTypes"></div>
</div>
<div class="field courseField">
  <div class="fieldtitle"><span>目標課程 <span class="required">*</span></span><span class="selectedSummary" id="dstSelected">尚未選擇課程</span></div>
  <div class="scrollShell" data-scroll-shell="dstCourses">
    <button type="button" class="scrollArrow" data-slide="-1" aria-label="向左查看目標課程" title="上一組">‹</button>
    <div id="dstCourses" class="scrollTrack" aria-label="左右滑動選擇目標課程"></div>
    <button type="button" class="scrollArrow" data-slide="1" aria-label="向右查看目標課程" title="下一組">›</button>
  </div>
</div>
<div class="field compactPair" id="dstPriceCountRow">
  <div class="field compactCell" id="dstPriceField">
    <div class="fieldtitle"><span>單堂價格類型 <span class="required">*</span></span></div><div class="segRow" id="dstPrices"></div>
  </div>
  <div class="field compactCell compactCount" id="dstCountField">
    <div class="fieldtitle"><span>目標堂數 <span class="required">*</span></span></div>
    <div class="inlineNumber"><div class="stepper"><button type="button" data-adjust="dstCount:-1" aria-label="減少目標堂數">−</button><input type="text" inputmode="numeric" id="dstCount" aria-label="目標堂數"><button type="button" data-adjust="dstCount:1" aria-label="增加目標堂數">+</button></div><span class="unit">堂</span></div>
  </div>
</div>
<div class="formline" id="targetCountNotice" style="display:none"></div>
</div>
</article>
</section>
<aside class="card resultCard desktopResult" aria-label="文字結果"><div class="cardhead resultHead"><div class="stepNum">3</div><h2>計算結果與複製文字</h2></div><div class="resultContent" id="resultDesktop"></div></aside>
<article class="card mobileResult" id="step3"><div class="cardhead resultHead"><div class="stepNum">3</div><h2>計算結果與複製文字</h2></div><div class="resultContent" id="resultMobile"></div></article>
</div>
</main>
<div class="mobileFooter" aria-label="快速複製工具列"><div class="footerTop"><span id="footerStatus">填寫欄位後可複製</span><b id="footerAmount">—</b></div><div class="footerBtns"><button data-copy="crm" disabled type="button">複製 CRM 紀錄</button><button data-copy="student" disabled type="button">複製學員說明</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import {createCalculator,PRICE_TYPES,TYPES,byName,digits} from './calculator.mjs';
import {parseTables} from './sheet-config.mjs';
let BASE=[],PACKS=[],OPTIONS=[],SRC_GROUPS=[],engine=null;
let discount={min:0,max:100,initial:0,step:1},loadedOnce=false,loading=false,lastFetched=0;
let s=emptyState();
let activeStep=1,currentResult=null,toastTimer;
const $=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function btn(label,isOn,click,disabled=false,cls='choice'){
 const b=el('button',cls+(isOn?' isOn':''),label);b.type='button';b.disabled=disabled;if(isOn)b.setAttribute('aria-pressed','true');else b.setAttribute('aria-pressed','false');b.addEventListener('click',click);return b;
}
function renderButtons(id,items,selected,handler,disableCheck){const c=$(id);c.replaceChildren();items.forEach(item=>c.append(btn(item,item===selected,()=>handler(item),disableCheck?disableCheck(item):false)))}
function renderCourses(){
 const sourceScroll=$('srcCourses').scrollLeft,targetScroll=$('dstCourses').scrollLeft;
 const categories=$('srcCategories');categories.replaceChildren();SRC_GROUPS.forEach(group=>categories.append(btn(group,group===s.srcGroup,()=>{s.srcGroup=group;$('srcCourses').scrollLeft=0;renderCourses()},false,'categoryBtn')));
 const source=OPTIONS.filter(x=>x.group===s.srcGroup);const courseList=$('srcCourses');courseList.replaceChildren();source.forEach(x=>courseList.append(btn(x.name,x.name===s.srcCourse,()=>{
  s.srcCourse=x.name;
  if(!byName(BASE,x.name))s.srcPrice='單堂方案/套裝價';
  renderAll();
 })));$('srcSelected').innerHTML=s.srcCourse?'已選：<b>'+escapeHTML(s.srcCourse)+'</b>':'尚未選擇課程';
 const destNames=(s.convert==='套裝'?PACKS:BASE).map(x=>x.name);
 renderButtons('dstCourses',destNames,s.dstCourse,v=>{s.dstCourse=v;renderAll()});
 $('dstSelected').innerHTML=s.dstCourse?'已選：<b>'+escapeHTML(s.dstCourse)+'</b>':'尚未選擇課程';
 $('srcCourses').scrollLeft=sourceScroll; $('dstCourses').scrollLeft=targetScroll;
 requestAnimationFrame(updateAllScrollArrows);
}
function renderChoices(){
 renderButtons('srcPrices',PRICE_TYPES,s.srcPrice,v=>{s.srcPrice=v;renderAll()},v=>!!s.srcCourse&&!byName(BASE,s.srcCourse)&&v!=='單堂方案/套裝價');
 $('sourcePriceNote').textContent=s.srcCourse&&!byName(BASE,s.srcCourse)?'全套剩餘課程僅可使用「單堂方案/套裝價」。':'';
 renderButtons('conversionTypes',TYPES,s.convert,v=>{if(v!==s.convert){s.convert=v;s.dstCourse='';$('dstCourses').scrollLeft=0;}renderAll()});
 renderButtons('dstPrices',PRICE_TYPES,s.dstPrice,v=>{s.dstPrice=v;renderAll()});
 $('dstPriceField').style.display=s.convert==='單堂'?'block':'none';
 $('dstCountField').style.display=s.convert==='單堂'?'block':'none';
 $('dstPriceCountRow').style.display=s.convert==='單堂'?'grid':'none';
 $('targetCountNotice').style.display=s.convert==='單堂'?'none':'block';
 const b=byName(BASE,s.dstCourse);
 $('targetCountNotice').textContent=s.convert==='方案'?('方案堂數由價目表自動帶入'+(b?'：'+b.count+' 堂':'。')):'套裝不需填寫目標堂數。';
}
// 滑動列會保留點選前的位置；左右箭頭只在尚有其他選項時啟用。
function updateAllScrollArrows(){
 document.querySelectorAll('.scrollShell').forEach(shell=>{
  const track=shell.querySelector('.scrollTrack'),max=track.scrollWidth-track.clientWidth;
  const left=shell.querySelector('[data-slide="-1"]'),right=shell.querySelector('[data-slide="1"]');
  left.disabled=max<=2||track.scrollLeft<=2;
  right.disabled=max<=2||track.scrollLeft>=max-2;
 });
}
function revealSelected(id){
 const track=$(id),active=track.querySelector('.choice.isOn');if(!active)return;
 const x=active.getBoundingClientRect().left-track.getBoundingClientRect().left+track.scrollLeft;
 if(x<track.scrollLeft||x+active.offsetWidth>track.scrollLeft+track.clientWidth){
  track.scrollLeft=Math.max(0,x-(track.clientWidth-active.offsetWidth)/2);
 }
 updateAllScrollArrows();
}
function scrollChoices(id,direction){
 const track=$(id);const first=track.querySelector('.choice');
 const amount=Math.max(first?first.offsetWidth+8:150,track.clientWidth*0.72);
 track.scrollBy({left:direction*amount,behavior:'smooth'});
}
document.querySelectorAll('.scrollShell').forEach(shell=>{
 const track=shell.querySelector('.scrollTrack');
 track.addEventListener('scroll',updateAllScrollArrows,{passive:true});
 shell.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>scrollChoices(track.id,Number(b.dataset.slide))));
});
window.addEventListener('resize',updateAllScrollArrows);
document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});
document.addEventListener('touchmove',event=>{if(event.touches.length>1)event.preventDefault()},{passive:false});
function calc(){return engine?engine.calculate(s):{done:false,check:$('configStatus').textContent}}
function escapeHTML(str){return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return n==null||!engine?'—':'NT$'+engine.fmt(n)}
function preciseMoney(n){return n==null?'—':'NT$'+new Intl.NumberFormat('en-US',{maximumFractionDigits:10}).format(n)}
function renderResult(t){
 const summary=[['原課程單堂價值',preciseMoney(t.unit)],['殘餘總值',preciseMoney(t.oldValue)],['目標單價 / 方案價 / 套裝價',preciseMoney(t.price)],['目標總價',preciseMoney(t.newValue)],['差價',t.done?preciseMoney(t.diff):'—']];
 const summaryHtml=summary.map(x=>'<div class="summaryRow"><span>'+x[0]+'</span><b>'+escapeHTML(x[1])+'</b></div>').join('');
 const negative=t.done&&t.diff<0,zero=t.done&&t.diff===0;
 const totalHtml='<div class="total '+(t.done?(negative?'negative':zero?'zero':'positive'):'')+'"><span>'+(t.done?(t.diff>0?'需補價差':'無需補價差'):'等待資料')+'</span><span class="amount">'+(t.done?escapeHTML(money(t.diff)): '—')+'</span></div>';
 const outputs=[['CRM 紀錄','crm',t.crm],['給學員的說明','student',t.student]].map(x=>'<section class="outputBlock"><div class="outputHead"><span>'+x[0]+'</span><button class="copyBtn" type="button" data-copy="'+x[1]+'" '+(t.done?'':'disabled')+'>複製文字</button></div><div class="outputText '+(t.done?'':'noResult')+'">'+(t.done?escapeHTML(x[2]):'完成選擇後，將在這裡顯示原表公式產生的完整文字。')+'</div></section>').join('');
 const html='<div class="resultStatus '+(t.done?'good':'')+'">'+escapeHTML(t.check)+'</div><div class="summary">'+summaryHtml+'</div>'+totalHtml+outputs;
 $('resultDesktop').innerHTML=html;$('resultMobile').innerHTML=html;
 $('footerAmount').textContent=t.done?(t.diff>0?'需補 '+money(t.diff):t.c23):'—';
 $('footerStatus').textContent=t.done?'結果已完成，可直接複製':engine?'尚未完成：請填寫原／目標課程':'價目尚未載入';
 document.querySelectorAll('.mobileFooter [data-copy]').forEach(b=>b.disabled=!t.done);
 document.querySelector('[data-step-tab="3"]').textContent=t.done?'③ 文字結果 ✓':'③ 文字結果';
}
function renderAll(){renderCourses();renderChoices();$('srcDiscount').value=s.srcDiscount;$('remaining').value=s.remaining;$('dstCount').value=s.dstCount;currentResult=calc();renderResult(currentResult)}
function updateCount(name,delta){let value=digits(s[name]);value=Math.max(0,Math.min(100000000,value+delta));s[name]=value;renderAll()}
function updateDiscount(name,delta){let value=digits(s[name]);s[name]=Math.max(discount.min,Math.min(discount.max,Math.round((value+delta*discount.step)*1e6)/1e6));renderAll()}
function switchStep(n){activeStep=n;document.querySelectorAll('[data-step-tab]').forEach(b=>b.classList.toggle('isOn',+b.dataset.stepTab===n));document.querySelectorAll('.stepCard,.mobileResult').forEach(e=>e.classList.toggle('mobileActive',e.id==='step'+n));window.scrollTo({top:0,behavior:'instant'});if(n===2)requestAnimationFrame(()=>revealSelected('dstCourses'));}
async function copyText(kind){if(!currentResult?.done)return;const str=kind==='crm'?currentResult.crm:currentResult.student;
 let copied=false;
 if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(str);copied=true}catch(e){}}
 if(!copied){let ta=document.createElement('textarea');ta.value=str;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';document.body.appendChild(ta);ta.focus();ta.select();try{copied=document.execCommand('copy')}catch(e){}ta.remove();}
 if(copied){showToast(kind==='crm'?'已複製 CRM 紀錄（原表格式）':'已複製學員說明（原表格式）')}
 else{const mobile=matchMedia('(max-width:820px)').matches;if(mobile)switchStep(3);const output=document.querySelector((mobile?'#resultMobile':'#resultDesktop')+' [data-copy="'+kind+'"]').closest('.outputBlock').querySelector('.outputText');output.classList.add('manualCopy');output.scrollIntoView({block:'nearest'});showToast('無法自動複製，請選取文字後複製');}
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function emptyState(){return{srcGroup:'一般',srcCourse:'',srcPrice:'',remaining:1,srcDiscount:discount.initial,convert:'單堂',dstCourse:'',dstPrice:'',dstCount:1}}
$('resetBtn').addEventListener('click',()=>{if(!window.confirm('確定清除目前的課程與計算結果？'))return;s=emptyState();renderAll();switchStep(1);showToast('已重設')});
document.querySelectorAll('[data-step-tab]').forEach(b=>b.addEventListener('click',()=>switchStep(+b.dataset.stepTab)));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.copy)copyText(b.dataset.copy);if(b.dataset.adjust){let [name,amount]=b.dataset.adjust.split(':');if(name.toLowerCase().includes('discount'))updateDiscount(name,+amount);else updateCount(name,+amount)}});
for(const id of ['remaining','dstCount'])$(id).addEventListener('input',e=>{if(e.target.value!==''&&!/^\d+$/.test(e.target.value)){e.target.value=s[id];return;}s[id]=e.target.value===''?'':Math.max(0,Math.min(100000000,Math.floor(digits(e.target.value))));currentResult=calc();renderResult(currentResult)});
$('srcDiscount').addEventListener('input',e=>{s.srcDiscount=Math.max(discount.min,Math.min(discount.max,digits(e.target.value)));currentResult=calc();renderResult(currentResult)});
for(const id of ['remaining','dstCount','srcDiscount'])for(const eventName of ['focus','click'])$(id).addEventListener(eventName,e=>e.target.select());
for(const id of ['remaining','dstCount','srcDiscount'])$(id).addEventListener('blur',()=>{$(id).value=s[id]});
renderAll();
async function loadPrices(){
 if(loading)return;
 loading=true;engine=null;
 $('refreshPrices').disabled=true;
 $('configBar').dataset.error='false';
 $('configStatus').textContent='正在讀取 Google 試算表價目…';
 document.querySelector('.forms').inert=true;
 currentResult=calc();renderResult(currentResult);
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{
  const response=await fetch('/api/price-difference-config',{cache:'no-store',signal:controller.signal});
  if(!response.headers.get('content-type')?.includes('application/json'))throw new Error('登入已到期，請重新整理並登入工具箱');
  const payload=await response.json();
  if(!response.ok)throw new Error(payload.error||'價目讀取失敗');
  const config=parseTables(payload.tables);
  engine=createCalculator(config);
  ({BASE,PACKS,OPTIONS,SRC_GROUPS}=engine);discount=config.discount;
  s.srcDiscount=loadedOnce?Math.max(discount.min,Math.min(discount.max,s.srcDiscount)):discount.initial;
  if(!OPTIONS.some(x=>x.name===s.srcCourse)){s.srcCourse='';s.srcPrice='';}
  if(!(s.convert==='套裝'?PACKS:BASE).some(x=>x.name===s.dstCourse))s.dstCourse='';
  if(!SRC_GROUPS.includes(s.srcGroup))s.srcGroup=SRC_GROUPS[0];
  $('srcDiscount').min=discount.min;$('srcDiscount').max=discount.max;$('srcDiscount').step='any';
  $('srcDiscount').title=`折扣範圍 ${discount.min}% 至 ${discount.max}%`;
  lastFetched=Date.now();loadedOnce=true;
  $('configStatus').textContent='Google 試算表已同步 · '+new Date(payload.fetchedAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
 }catch(error){
  engine=null;$('configBar').dataset.error='true';
  $('configStatus').textContent=(error.name==='AbortError'?'讀取逾時，請檢查網路':error.message)+'；暫停計算，請更新價目重試。';
 }finally{
  clearTimeout(timer);loading=false;$('refreshPrices').disabled=false;
  document.querySelector('.forms').inert=!engine;renderAll();
 }
}
$('refreshPrices').addEventListener('click',loadPrices);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastFetched>60000)loadPrices()});
loadPrices();
</script>
</body>
</html>
