<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#23685f">
  <title>各店費用分擔</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f7;
      --surface: #ffffff;
      --ink: #18242a;
      --muted: #66737b;
      --line: #d9e1e4;
      --primary: #23685f;
      --primary-soft: #e5f0ed;
      --money: #965d00;
      --danger: #aa2e25;
      --shadow: 0 6px 18px rgba(25, 42, 48, 0.07);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    button,
    a,
    summary,
    label {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    input {
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }

    button,
    input {
      min-width: 0;
      border-radius: 8px;
      font: inherit;
      letter-spacing: 0;
    }

    button { cursor: pointer; }

    .shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .top-actions {
      display: flex;
      gap: 7px;
      flex: 0 0 auto;
    }

    .title-wrap { min-width: 0; }

    h1 {
      margin: 0;
      font-size: 1.55rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .save-status {
      min-height: 1.2em;
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .toolbox-link,
    .secondary-button,
    .primary-button,
    .danger-button,
    .icon-button {
      min-height: 40px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-weight: 800;
    }

    .toolbox-link {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      padding: 0 13px;
      text-decoration: none;
      box-shadow: var(--shadow);
    }

    .summary-band {
      margin: 0 -12px 12px;
      padding: 14px 12px;
      color: #fff;
      background: var(--primary);
    }

    .item-tabs {
      display: flex;
      gap: 7px;
      margin: 0 0 10px;
      padding: 2px 0 4px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .item-tab {
      flex: 0 0 auto;
      max-width: 190px;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface);
      font-size: 0.84rem;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-tab[aria-selected="true"] {
      border-color: var(--primary);
      color: #fff;
      background: var(--primary);
    }

    .grand-total {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .grand-total-label {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.85;
    }

    .grand-total-value {
      margin-top: 2px;
      font-size: clamp(1.8rem, 8vw, 2.65rem);
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .tax-breakdown {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      min-width: 180px;
      text-align: right;
      font-size: 0.78rem;
    }

    .tax-breakdown strong {
      display: block;
      margin-top: 2px;
      font-size: 0.98rem;
      font-variant-numeric: tabular-nums;
    }

    .store-totals {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      padding-top: 11px;
    }

    .store-total {
      min-width: 0;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.09);
    }

    .store-total-name {
      width: 100%;
      padding: 0;
      border: 0;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.82);
      background: transparent;
      text-align: left;
      font-size: 0.76rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: text;
    }

    .store-total-name::after {
      content: " ✎";
      font-size: 0.68rem;
      opacity: 0.72;
    }

    .store-name-editor {
      width: 100%;
      height: 28px;
      padding: 0 6px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      color: var(--ink);
      background: #fff;
      font-size: 0.76rem;
      font-weight: 750;
    }

    .store-total-value {
      margin-top: 2px;
      overflow: hidden;
      font-size: 1rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .field-label {
      display: grid;
      gap: 4px;
      min-width: 0;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 750;
    }

    .text-input,
    .number-input {
      width: 100%;
      height: 42px;
      padding: 0 10px;
      border: 1px solid #bcc9ce;
      outline: none;
      color: var(--ink);
      background: #fff;
      font-size: 1rem;
    }

    .text-input:focus,
    .number-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(35, 104, 95, 0.12);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      padding: 0 13px;
    }

    .primary-button {
      border-color: var(--primary);
      color: #fff;
      background: var(--primary);
    }

    .danger-button { color: var(--danger); }

    .item-list {
      display: grid;
      gap: 10px;
    }

    .item-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .item-head {
      display: grid;
      grid-template-columns: minmax(120px, 1.5fr) minmax(92px, 0.8fr) auto auto;
      align-items: end;
      gap: 8px;
      padding: 11px;
      border-bottom: 1px solid var(--line);
    }

    .tax-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 42px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #f9fbfb;
      font-size: 0.8rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .tax-toggle input {
      width: 21px;
      height: 21px;
      margin: 0;
      accent-color: var(--primary);
    }

    .icon-button {
      width: 42px;
      padding: 0;
      color: var(--danger);
      font-size: 1.2rem;
    }

    .stores-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .store-entry {
      min-width: 0;
      padding: 9px;
      background: var(--surface);
    }

    .store-entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 5px;
    }

    .store-entry-name {
      overflow: hidden;
      font-size: 0.78rem;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .store-entry-cost {
      color: var(--money);
      font-size: 0.75rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .quantity-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 5px;
    }

    .quantity-wrap .number-input {
      height: 38px;
      text-align: center;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .item-foot {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      color: var(--muted);
      background: #f9fbfb;
      font-size: 0.78rem;
    }

    .item-foot strong {
      color: var(--ink);
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      padding: 28px 16px;
      border: 1px dashed #b9c7cc;
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: var(--surface);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 10;
      max-width: calc(100vw - 28px);
      padding: 9px 14px;
      border-radius: 8px;
      color: #fff;
      background: rgba(24, 36, 42, 0.94);
      font-size: 0.86rem;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 620px) {
      .shell {
        padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
      }

      .topbar { gap: 6px; margin-bottom: 5px; }
      h1 { font-size: 1.12rem; }
      .save-status { margin-top: 1px; font-size: 0.66rem; }
      .top-actions { gap: 4px; }
      .toolbox-link { min-height: 32px; padding: 0 8px; font-size: 0.75rem; box-shadow: none; }

      .item-tabs { gap: 4px; margin-bottom: 5px; padding-bottom: 2px; }
      .item-tab { min-height: 31px; max-width: 132px; padding: 0 9px; font-size: 0.72rem; }

      .summary-band {
        margin: 0 -8px 5px;
        padding: 7px 8px;
      }

      .grand-total {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        padding-bottom: 6px;
      }

      .grand-total-label { font-size: 0.68rem; }
      .grand-total-value { margin-top: 0; font-size: 1.55rem; }
      .tax-breakdown { display: flex; gap: 12px; min-width: 0; text-align: right; font-size: 0.64rem; }
      .tax-breakdown strong { margin-top: 0; font-size: 0.78rem; }
      .store-totals { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding-top: 6px; }
      .store-total { padding: 4px 5px; }
      .store-total-name { font-size: 0.62rem; }
      .store-total-name::after { display: none; }
      .store-total-value { margin-top: 0; font-size: 0.78rem; }

      .actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        margin-bottom: 5px;
      }

      .actions button {
        min-height: 32px;
        padding: 0 3px;
        font-size: 0.69rem;
        white-space: nowrap;
      }

      .item-list { gap: 5px; }
      .item-card { box-shadow: none; }
      .item-head {
        grid-template-columns: minmax(0, 1.5fr) minmax(62px, 0.72fr) auto 32px;
        gap: 4px;
        padding: 6px;
      }
      .field-label { gap: 2px; font-size: 0.62rem; }
      .text-input, .number-input { height: 32px; padding: 0 6px; font-size: 0.82rem; }
      .tax-toggle { min-height: 32px; padding: 0 4px; font-size: 0.65rem; }
      .tax-toggle input { width: 17px; height: 17px; }
      .icon-button { width: 32px; min-height: 32px; font-size: 1rem; }
      .stores-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .store-entry { padding: 5px; }
      .store-entry-head { gap: 2px; margin-bottom: 2px; }
      .store-entry-name { font-size: 0.64rem; }
      .store-entry-cost { font-size: 0.62rem; }
      .quantity-wrap { gap: 2px; }
      .quantity-wrap .number-input { height: 30px; font-size: 0.78rem; }
      .unit { font-size: 0.62rem; }
      .item-foot { padding: 5px 7px; font-size: 0.66rem; }
      .item-foot strong { font-size: 0.74rem; }
    }

    @media (max-width: 390px) {
      .shell { padding-left: 6px; padding-right: 6px; }
      .summary-band { margin-left: -6px; margin-right: -6px; padding-left: 6px; padding-right: 6px; }
      .actions button { font-size: 0.64rem; }
      .item-head { grid-template-columns: minmax(0, 1.4fr) minmax(58px, 0.68fr) auto 30px; }
      .tax-toggle { font-size: 0.6rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title-wrap">
        <h1>各店費用分擔</h1>
        <p class="save-status" id="save-status">正在同步資料...</p>
      </div>
      <div class="top-actions">
        <a class="toolbox-link" href="settings.html">設定</a>
        <a class="toolbox-link" href="../../index.html">工具箱</a>
      </div>
    </header>

    <nav class="item-tabs" id="item-tabs" aria-label="品項分頁" role="tablist"></nav>

    <section class="summary-band" aria-label="費用總結">
      <div class="grand-total">
        <div>
          <div class="grand-total-label">六店合計</div>
          <div class="grand-total-value" id="grand-total">$0</div>
        </div>
        <div class="tax-breakdown">
          <div>未稅<strong id="subtotal">$0</strong></div>
          <div>5% 稅額<strong id="tax-total">$0</strong></div>
        </div>
      </div>
      <div class="store-totals" id="store-totals"></div>
    </section>

    <div class="actions">
      <button class="primary-button" id="add-item" type="button">新增品項</button>
      <button class="secondary-button" id="copy-output" type="button">複製文字</button>
      <button class="secondary-button" id="copy-addresses" type="button">分店地址</button>
      <button class="secondary-button" id="clear-numbers" type="button">清空數字</button>
    </div>

    <section class="item-list" id="item-list" aria-label="品項費用"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="addresses.js"></script>
  <script type="module">
    import {
      saveAddressBook,
      saveCostState,
      subscribeAddressBook,
      subscribeCostState,
    } from "./cost-data.js";
    const STORAGE_KEY = "storeCostSharingStateV1";
    const STORE_COUNT = 6;
    const DEFAULT_STORE_NAMES = Array.from({ length: STORE_COUNT }, (_, index) => `門市${index + 1}`);
    const moneyFormatter = new Intl.NumberFormat("zh-TW", {
      style: "currency",
      currency: "TWD",
      minimumFractionDigits: 0,
      maximumFractionDigits: 2,
    });

    const itemList = document.getElementById("item-list");
    const itemTabs = document.getElementById("item-tabs");
    const storeTotals = document.getElementById("store-totals");
    const grandTotal = document.getElementById("grand-total");
    const subtotal = document.getElementById("subtotal");
    const taxTotal = document.getElementById("tax-total");
    const saveStatus = document.getElementById("save-status");
    const toast = document.getElementById("toast");
    let toastTimer = 0;
    let saveTimer = 0;
    let cloudSaveTimer = 0;
    let cloudReady = false;
    let pendingCloudSave = false;

    function createId() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function createBlankItem() {
      return {
        id: createId(),
        name: "",
        price: "",
        taxed: false,
        quantities: Array(STORE_COUNT).fill(""),
      };
    }

    function defaultState() {
      const item = createBlankItem();
      return {
        stores: [...DEFAULT_STORE_NAMES],
        items: [item],
        activeItemId: item.id,
      };
    }

    function normalizeDecimal(value) {
      const cleaned = String(value ?? "").replace(/,/g, ".").replace(/[^0-9.]/g, "");
      const [whole = "", ...decimalParts] = cleaned.split(".");
      if (decimalParts.length === 0) return whole;
      return `${whole}.${decimalParts.join("")}`;
    }

    function toNumber(value) {
      const number = Number.parseFloat(value);
      return Number.isFinite(number) && number >= 0 ? number : 0;
    }

    function roundMoney(value) {
      return Math.round((value + Number.EPSILON) * 100) / 100;
    }

    function normalizeState(stored, preferredActiveItemId = "") {
      if (!stored || !Array.isArray(stored.stores) || !Array.isArray(stored.items)) return defaultState();
      const stores = Array.from({ length: STORE_COUNT }, (_, index) => String(stored.stores[index] || DEFAULT_STORE_NAMES[index]));
      const items = stored.items.map((item) => ({
        id: String(item.id || createId()),
        name: String(item.name || ""),
        price: normalizeDecimal(item.price),
        taxed: Boolean(item.taxed),
        quantities: Array.from({ length: STORE_COUNT }, (_, index) => normalizeDecimal(item.quantities?.[index])),
      }));
      const normalizedItems = items.length ? items : [createBlankItem()];
      const requestedActiveId = preferredActiveItemId || stored.activeItemId;
      const activeItemId = normalizedItems.some((item) => item.id === requestedActiveId)
        ? requestedActiveId
        : normalizedItems[0].id;
      return { stores, items: normalizedItems, activeItemId };
    }

    function loadState() {
      try {
        return normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"));
      } catch {
        return defaultState();
      }
    }

    let state = loadState();

    function cloudState() {
      return { stores: state.stores, items: state.items };
    }

    function stateSignature(value = state) {
      return JSON.stringify({ stores: value.stores, items: value.items });
    }

    function hasMeaningfulState(value) {
      const customStores = value.stores.some((name, index) => name !== DEFAULT_STORE_NAMES[index]);
      const meaningfulItems = value.items.length > 1 || value.items.some((item) =>
        item.name.trim() || toNumber(item.price) > 0 || item.taxed || item.quantities.some((quantity) => toNumber(quantity) > 0)
      );
      return customStores || meaningfulItems;
    }

    function cacheState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function queueCloudSave() {
      pendingCloudSave = true;
      if (!cloudReady) {
        return;
      }
      window.clearTimeout(cloudSaveTimer);
      cloudSaveTimer = window.setTimeout(async () => {
        saveStatus.textContent = "正在同步資料...";
        try {
          await saveCostState(cloudState());
          pendingCloudSave = false;
          saveStatus.textContent = "資料已同步";
        } catch (error) {
          console.error("Store cost sharing save error:", error);
          saveStatus.textContent = "已保存在此裝置，稍後再同步";
        }
      }, 450);
    }

    function persistState(syncToCloud = true) {
      cacheState();
      saveStatus.textContent = syncToCloud ? "資料已保存，等待同步" : "資料已同步";
      if (syncToCloud) queueCloudSave();
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => {
        if (!syncToCloud || !pendingCloudSave) saveStatus.textContent = "資料已同步";
      }, 1600);
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1700);
    }

    function storeLabel(index) {
      return state.stores[index].trim() || `門市${index + 1}`;
    }

    function itemCost(item, storeIndex) {
      const base = roundMoney(toNumber(item.price) * toNumber(item.quantities[storeIndex]));
      const tax = item.taxed ? roundMoney(base * 0.05) : 0;
      return { base, tax, total: roundMoney(base + tax) };
    }

    function itemAmount(item, storeIndex) {
      return itemCost(item, storeIndex).total;
    }

    function activeItem() {
      return state.items.find((item) => item.id === state.activeItemId) || null;
    }

    function calculateTotals() {
      const perStore = Array(STORE_COUNT).fill(0);
      let beforeTax = 0;
      let tax = 0;

      const item = activeItem();
      if (item) {
        item.quantities.forEach((_, storeIndex) => {
          const cost = itemCost(item, storeIndex);
          beforeTax = roundMoney(beforeTax + cost.base);
          tax = roundMoney(tax + cost.tax);
          perStore[storeIndex] = roundMoney(perStore[storeIndex] + cost.total);
        });
      }

      const total = roundMoney(perStore.reduce((sum, value) => sum + value, 0));
      return { perStore, beforeTax, tax, total };
    }

    function renderTabs() {
      itemTabs.replaceChildren();
      state.items.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "item-tab";
        button.type = "button";
        button.role = "tab";
        button.dataset.itemTab = item.id;
        button.setAttribute("aria-selected", String(item.id === state.activeItemId));
        button.textContent = item.name.trim() || `品項 ${index + 1}`;
        button.title = button.textContent;
        itemTabs.append(button);
      });
    }

    function renderSummary() {
      const totals = calculateTotals();
      grandTotal.textContent = moneyFormatter.format(totals.total);
      subtotal.textContent = moneyFormatter.format(totals.beforeTax);
      taxTotal.textContent = moneyFormatter.format(totals.tax);
      storeTotals.replaceChildren();

      totals.perStore.forEach((value, index) => {
        const block = document.createElement("div");
        block.className = "store-total";
        const name = document.createElement("button");
        name.type = "button";
        name.className = "store-total-name";
        name.textContent = storeLabel(index);
        name.dataset.editStore = String(index);
        name.title = "點擊編輯門市名稱";
        name.setAttribute("aria-label", `編輯門市名稱：${storeLabel(index)}`);
        const amount = document.createElement("div");
        amount.className = "store-total-value";
        amount.textContent = moneyFormatter.format(value);
        block.append(name, amount);
        storeTotals.append(block);
      });
    }

    function itemCard(item) {
      const article = document.createElement("article");
      article.className = "item-card";
      article.dataset.itemId = item.id;

      const head = document.createElement("div");
      head.className = "item-head";

      const nameLabel = document.createElement("label");
      nameLabel.className = "field-label name-field";
      nameLabel.textContent = "品項名稱";
      const nameInput = document.createElement("input");
      nameInput.className = "text-input";
      nameInput.type = "text";
      nameInput.maxLength = 40;
      nameInput.value = item.name;
      nameInput.dataset.field = "name";
      nameInput.placeholder = "例如：影印紙";
      nameInput.setAttribute("autocomplete", "off");
      nameLabel.append(nameInput);

      const priceLabel = document.createElement("label");
      priceLabel.className = "field-label price-field";
      priceLabel.textContent = "品項單價";
      const priceInput = document.createElement("input");
      priceInput.className = "number-input";
      priceInput.type = "text";
      priceInput.inputMode = "decimal";
      priceInput.value = item.price;
      priceInput.dataset.field = "price";
      priceInput.placeholder = "0";
      priceInput.setAttribute("autocomplete", "off");
      priceLabel.append(priceInput);

      const taxLabel = document.createElement("label");
      taxLabel.className = "tax-toggle";
      const taxInput = document.createElement("input");
      taxInput.type = "checkbox";
      taxInput.checked = item.taxed;
      taxInput.dataset.field = "taxed";
      taxLabel.append(taxInput, document.createTextNode("加計 5% 稅"));

      const deleteButton = document.createElement("button");
      deleteButton.className = "icon-button";
      deleteButton.type = "button";
      deleteButton.dataset.action = "delete";
      deleteButton.setAttribute("aria-label", `刪除${item.name || "此品項"}`);
      deleteButton.title = "刪除品項";
      deleteButton.textContent = "×";

      head.append(nameLabel, priceLabel, taxLabel, deleteButton);

      const grid = document.createElement("div");
      grid.className = "stores-grid";
      item.quantities.forEach((quantity, storeIndex) => {
        const entry = document.createElement("div");
        entry.className = "store-entry";
        const entryHead = document.createElement("div");
        entryHead.className = "store-entry-head";
        const entryName = document.createElement("div");
        entryName.className = "store-entry-name";
        entryName.textContent = storeLabel(storeIndex);
        const cost = document.createElement("div");
        cost.className = "store-entry-cost";
        cost.dataset.costStore = String(storeIndex);
        cost.textContent = moneyFormatter.format(itemAmount(item, storeIndex));
        entryHead.append(entryName, cost);

        const quantityWrap = document.createElement("div");
        quantityWrap.className = "quantity-wrap";
        const quantityInput = document.createElement("input");
        quantityInput.className = "number-input";
        quantityInput.type = "text";
        quantityInput.inputMode = "decimal";
        quantityInput.value = quantity;
        quantityInput.dataset.quantityStore = String(storeIndex);
        quantityInput.placeholder = "0";
        quantityInput.setAttribute("aria-label", `${storeLabel(storeIndex)}數量`);
        quantityInput.setAttribute("autocomplete", "off");
        const unit = document.createElement("span");
        unit.className = "unit";
        unit.textContent = "個";
        quantityWrap.append(quantityInput, unit);
        entry.append(entryHead, quantityWrap);
        grid.append(entry);
      });

      const foot = document.createElement("div");
      foot.className = "item-foot";
      const totalQuantity = item.quantities.reduce((sum, value) => sum + toNumber(value), 0);
      const totalAmount = roundMoney(item.quantities.reduce((sum, _, index) => sum + itemAmount(item, index), 0));
      foot.innerHTML = `<span>總數量 <strong data-item-quantity>${totalQuantity.toLocaleString("zh-TW", { maximumFractionDigits: 3 })}</strong></span><span>品項合計 <strong data-item-total>${moneyFormatter.format(totalAmount)}</strong></span>`;

      article.append(head, grid, foot);
      return article;
    }

    function renderItems() {
      itemList.replaceChildren();
      const item = activeItem();
      if (!item) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "尚未新增品項";
        itemList.append(empty);
        return;
      }
      itemList.append(itemCard(item));
    }

    function renderAll() {
      renderTabs();
      renderItems();
      renderSummary();
    }

    function findItem(id) {
      return state.items.find((item) => item.id === id);
    }

    function updateItemCard(article, item) {
      article.querySelectorAll("[data-cost-store]").forEach((element) => {
        const storeIndex = Number(element.dataset.costStore);
        element.textContent = moneyFormatter.format(itemAmount(item, storeIndex));
      });
      const totalQuantity = item.quantities.reduce((sum, value) => sum + toNumber(value), 0);
      const totalAmount = roundMoney(item.quantities.reduce((sum, _, index) => sum + itemAmount(item, index), 0));
      article.querySelector("[data-item-quantity]").textContent = totalQuantity.toLocaleString("zh-TW", { maximumFractionDigits: 3 });
      article.querySelector("[data-item-total]").textContent = moneyFormatter.format(totalAmount);
      renderSummary();
    }

    function beginStoreNameEdit(button) {
      const index = Number(button.dataset.editStore);
      if (!Number.isInteger(index)) return;
      const block = button.closest(".store-total");
      const input = document.createElement("input");
      input.className = "store-name-editor";
      input.type = "text";
      input.maxLength = 40;
      input.value = state.stores[index];
      input.setAttribute("aria-label", `門市 ${index + 1} 名稱`);
      input.setAttribute("autocomplete", "off");
      button.replaceWith(input);
      input.focus();
      input.select();

      let cancelled = false;
      const finish = () => {
        if (!input.isConnected) return;
        if (!cancelled) state.stores[index] = input.value.trim() || `門市${index + 1}`;
        persistState();
        renderItems();
        renderSummary();
      };

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") input.blur();
        if (event.key === "Escape") {
          cancelled = true;
          input.blur();
        }
      });
      input.addEventListener("blur", finish, { once: true });
      block.scrollIntoView({ block: "nearest" });
    }

    storeTotals.addEventListener("click", (event) => {
      const button = event.target.closest("[data-edit-store]");
      if (button) beginStoreNameEdit(button);
    });

    itemList.addEventListener("input", (event) => {
      const article = event.target.closest("[data-item-id]");
      if (!article) return;
      const item = findItem(article.dataset.itemId);
      if (!item) return;

      if (event.target.matches("[data-field='name']")) {
        item.name = event.target.value;
        renderTabs();
      } else if (event.target.matches("[data-field='price']")) {
        const next = normalizeDecimal(event.target.value);
        event.target.value = next;
        item.price = next;
      } else if (event.target.matches("[data-quantity-store]")) {
        const next = normalizeDecimal(event.target.value);
        event.target.value = next;
        item.quantities[Number(event.target.dataset.quantityStore)] = next;
      }
      persistState();
      updateItemCard(article, item);
    });

    itemList.addEventListener("change", (event) => {
      const article = event.target.closest("[data-item-id]");
      if (!article || !event.target.matches("[data-field='taxed']")) return;
      const item = findItem(article.dataset.itemId);
      if (!item) return;
      item.taxed = event.target.checked;
      persistState();
      updateItemCard(article, item);
    });

    itemTabs.addEventListener("click", (event) => {
      const tab = event.target.closest("[data-item-tab]");
      if (!tab || tab.dataset.itemTab === state.activeItemId) return;
      state.activeItemId = tab.dataset.itemTab;
      persistState(false);
      renderAll();
      itemTabs.querySelector(`[data-item-tab="${CSS.escape(state.activeItemId)}"]`)?.scrollIntoView({
        behavior: "smooth",
        block: "nearest",
        inline: "center",
      });
    });

    itemList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action='delete']");
      if (!button) return;
      const article = button.closest("[data-item-id]");
      const item = findItem(article.dataset.itemId);
      if (!item) return;
      const label = item.name.trim() || "此空白品項";
      if (!window.confirm(`確定刪除「${label}」？`)) return;
      const deletedIndex = state.items.findIndex((candidate) => candidate.id === item.id);
      state.items = state.items.filter((candidate) => candidate.id !== item.id);
      if (state.items.length === 0) state.items.push(createBlankItem());
      state.activeItemId = state.items[Math.min(deletedIndex, state.items.length - 1)]?.id || "";
      persistState();
      renderAll();
      showToast("品項已刪除");
    });

    document.getElementById("add-item").addEventListener("click", () => {
      const item = createBlankItem();
      state.items.push(item);
      state.activeItemId = item.id;
      persistState();
      renderAll();
      itemTabs.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "end" });
      itemList.querySelector("[data-field='name']")?.focus({ preventScroll: true });
    });

    document.getElementById("clear-numbers").addEventListener("click", () => {
      const item = activeItem();
      const hasNumbers = item && (toNumber(item.price) > 0 || item.quantities.some((value) => toNumber(value) > 0));
      if (!hasNumbers) {
        showToast("目前沒有數字需要清空");
        return;
      }
      if (!window.confirm("清空目前品項的單價與六店數量？門市名稱、品項名稱和稅別會保留。")) return;
      item.price = "";
      item.quantities = Array(STORE_COUNT).fill("");
      persistState();
      renderAll();
      showToast("單價與數量已清空");
    });

    async function copyText(text, successMessage) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.append(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        showToast(successMessage);
      } catch {
        showToast("複製失敗，請再試一次");
      }
    }

    function copyOutputText() {
      const totals = calculateTotals();
      const text = totals.perStore
        .map((value, index) => ({ value, name: storeLabel(index) }))
        .filter(({ value }) => value > 0)
        .map(({ value, name }) => `${name}   ${moneyFormatter.format(value)}`)
        .join("\n");

      if (!text) {
        showToast("目前沒有可輸出的分擔金額");
        return;
      }
      copyText(text, "分擔文字已複製");
    }

    function copyAddresses() {
      const addresses = window.StoreCostAddresses.load();
      const text = window.StoreCostAddresses.format(addresses);
      copyText(text, "六店地址已複製");
    }

    document.getElementById("copy-output").addEventListener("click", () => {
      copyOutputText();
    });

    document.getElementById("copy-addresses").addEventListener("click", () => {
      copyAddresses();
    });

    document.addEventListener("dblclick", (event) => event.preventDefault(), { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener("touchend", (event) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) event.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    renderAll();

    subscribeCostState(
      (remoteData) => {
        cloudReady = true;
        if (remoteData?.stores && remoteData?.items) {
          const remoteState = normalizeState(remoteData, state.activeItemId);
          if (stateSignature(remoteState) !== stateSignature()) {
            state = remoteState;
            cacheState();
            renderAll();
          }
          pendingCloudSave = false;
          saveStatus.textContent = "資料已同步";
          return;
        }

        if (hasMeaningfulState(state)) {
          saveStatus.textContent = "正在上傳原有紀錄...";
          queueCloudSave();
        } else {
          pendingCloudSave = false;
          saveStatus.textContent = "尚無雲端資料";
        }
      },
      () => {
        cloudReady = false;
        saveStatus.textContent = "目前使用此裝置資料";
      },
    );

    subscribeAddressBook(
      (remoteData) => {
        if (remoteData?.entries) {
          const remoteAddresses = window.StoreCostAddresses.normalize(remoteData.entries);
          window.StoreCostAddresses.save(remoteAddresses);
          return;
        }
        const localAddresses = window.StoreCostAddresses.load();
        if (JSON.stringify(localAddresses) !== JSON.stringify(window.StoreCostAddresses.defaults())) {
          saveAddressBook(localAddresses).catch((error) => console.error("Address migration error:", error));
        }
      },
      () => {},
    );

    window.addEventListener("online", () => {
      if (pendingCloudSave) queueCloudSave();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../../sw.js", { updateViaCache: "none" }).then((registration) => registration.update()).catch(() => {});
      });
    }
  </script>
</body>
</html>
