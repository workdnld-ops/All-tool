<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>打掃統計</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --primary-soft: #e4f0ee;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    button { font: inherit; }

    body,
    button,
    a,
    .button,
    .tab,
    .card,
    .line {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .shell {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      display: grid;
      gap: 8px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: 1.24rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 0.76rem;
      min-height: 16px;
    }

    .button,
    .tab {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-tabs {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .store-tabs {
      margin-top: 2px;
    }

    .view {
      display: grid;
      gap: 8px;
    }

    .view[hidden] { display: none; }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 9px;
      display: grid;
      gap: 6px;
      box-shadow: 0 6px 18px rgba(23, 33, 38, 0.06);
    }

    .card h2 {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .line {
      display: grid;
      gap: 3px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .line:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .history-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .message-text {
      margin: 0;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #f8fbfb;
      font: inherit;
      font-size: 0.86rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
      touch-action: pan-y;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.6);
      padding: 14px;
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      .button,
      .tab { min-height: 32px; padding: 0 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>打掃統計</h1>
        <div class="status" id="status">讀取紀錄中...</div>
      </div>
      <div class="header-actions">
        <a class="button" href="../../index.html">工具箱</a>
        <a class="button" href="index.html">返回</a>
      </div>
    </header>

    <section class="tabs store-tabs" id="store-tabs"></section>

    <section class="tabs stat-tabs">
      <button class="tab active" id="task-tab" type="button">依項目</button>
      <button class="tab" id="staff-tab" type="button">依人員</button>
      <button class="tab" id="history-tab" type="button">歷史文字</button>
    </section>

    <section class="view" id="task-view"></section>
    <section class="view" id="staff-view" hidden></section>
    <section class="view" id="history-view" hidden></section>
  </main>

  <script>
    function markLoadFailure() {
      const status = document.getElementById("status");
      if (!status || !status.textContent.includes("讀取")) return;
      status.textContent = "資料載入失敗，請重新整理";
      status.style.color = "#b42318";
    }

    window.addEventListener("error", markLoadFailure);
    window.addEventListener("unhandledrejection", markLoadFailure);
  </script>

  <script type="module">
    import { STORE_OPTIONS, subscribeCleaningRecords } from "./cleaning-data.js?v=cleaning-v6";

    const status = document.getElementById("status");
    const storeTabs = document.getElementById("store-tabs");
    const taskTab = document.getElementById("task-tab");
    const staffTab = document.getElementById("staff-tab");
    const historyTab = document.getElementById("history-tab");
    const taskView = document.getElementById("task-view");
    const staffView = document.getElementById("staff-view");
    const historyView = document.getElementById("history-view");
    let records = [];
    let selectedStoreId = localStorage.getItem("cleaningStatsStore") || STORE_OPTIONS[0].id;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showTab(type) {
      const isTask = type === "task";
      const isStaff = type === "staff";
      const isHistory = type === "history";
      taskView.hidden = !isTask;
      staffView.hidden = !isStaff;
      historyView.hidden = !isHistory;
      taskTab.classList.toggle("active", isTask);
      staffTab.classList.toggle("active", isStaff);
      historyTab.classList.toggle("active", isHistory);
    }

    function currentStore() {
      return STORE_OPTIONS.find((store) => store.id === selectedStoreId) || STORE_OPTIONS[0];
    }

    function renderStoreTabs() {
      storeTabs.innerHTML = STORE_OPTIONS.map((store) => `
        <button class="tab ${store.id === selectedStoreId ? "active" : ""}" type="button" data-store="${store.id}">
          ${escapeHtml(store.name)}
        </button>
      `).join("");
    }

    function entryDate(record) {
      const time = record.startTime && record.endTime ? ` ${record.startTime}-${record.endTime}` : "";
      return `${record.date || record.createdAt?.slice(0, 10) || "未記錄日期"}${time}`;
    }

    function collectEntries(storeId = selectedStoreId) {
      const entries = [];
      for (const record of records) {
        const store = record.stores?.[storeId];
        if (!store) continue;
        for (const assignment of Object.values(store.assignments || {})) {
          for (let index = 0; index < (assignment.staffIds || []).length; index += 1) {
            entries.push({
              date: record.date || record.createdAt?.slice(0, 10) || "",
              createdAt: record.createdAt || record.date || "",
              storeName: store.storeName || currentStore().name,
              taskId: assignment.taskId,
              taskName: assignment.taskName || "未命名項目",
              staffId: assignment.staffIds[index],
              staffName: assignment.staffNames?.[index] || assignment.staffIds[index],
              label: entryDate(record),
            });
          }
        }
      }
      return entries.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    }

    function averageIntervalText(entries) {
      if (entries.length < 2) return "-";
      const times = entries
        .map((entry) => new Date(entry.createdAt || entry.date).getTime())
        .filter((time) => Number.isFinite(time))
        .sort((a, b) => a - b);
      if (times.length < 2) return "-";
      let totalDays = 0;
      for (let index = 1; index < times.length; index += 1) {
        totalDays += Math.abs(times[index] - times[index - 1]) / 86400000;
      }
      return `${(totalDays / (times.length - 1)).toFixed(1)} 天`;
    }

    function groupBy(items, getKey) {
      const groups = new Map();
      for (const item of items) {
        const key = getKey(item);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      return groups;
    }

    function storeHasActivity(storeRecord) {
      if (!storeRecord) return false;
      if (Object.keys(storeRecord.assignments || {}).length > 0) return true;
      if ((storeRecord.extraTaskNames || []).length > 0) return true;
      return Boolean(storeRecord.extraNote);
    }

    function lineForStoredStore(record, storeOption) {
      const storeRecord = record.stores?.[storeOption.id] || {};
      const lines = [storeRecord.storeName || storeOption.name];
      const groups = new Map();
      const taskIds = [
        ...(storeRecord.taskIds || []),
        ...Object.keys(storeRecord.assignments || {}),
      ];

      for (const taskId of [...new Set(taskIds)]) {
        const assignment = storeRecord.assignments?.[taskId];
        if (!assignment) continue;
        const names = (assignment.staffNames || assignment.staffIds || []).filter(Boolean);
        if (names.length === 0) continue;
        const taskName = assignment.taskName || (storeRecord.taskNames || [])[taskIds.indexOf(taskId)] || "未命名項目";
        const nameText = names.join("、");
        if (!groups.has(nameText)) groups.set(nameText, []);
        groups.get(nameText).push(taskName);
      }

      for (const [nameText, taskNames] of groups) {
        lines.push(`${taskNames.join("、")}：${nameText}`);
      }

      const extraNames = [...(storeRecord.extraTaskNames || [])];
      if (storeRecord.extraNote) extraNames.push(storeRecord.extraNote);
      if (extraNames.length > 0) lines.push(`以上完成去做：${extraNames.join("、")}`);

      if (lines.length === 1) lines.push("尚無分配內容");
      return lines.join("\n");
    }

    function buildHistoryMessage(record) {
      const start = record.startTime || "14:00";
      const end = record.endTime || "15:00";
      return `打掃${start}-${end}\n\n${STORE_OPTIONS.map((store) => lineForStoredStore(record, store)).join("\n\n")}`;
    }

    async function copyText(text, button) {
      try {
        await navigator.clipboard.writeText(text);
        const original = button.textContent;
        button.textContent = "已複製";
        window.setTimeout(() => {
          button.textContent = original;
        }, 1400);
      } catch {
        status.textContent = "複製失敗，請手動選取文字。";
        status.style.color = "#b42318";
      }
    }

    function renderTaskStats(entries) {
      if (entries.length === 0) {
        taskView.innerHTML = '<div class="empty">尚無儲存紀錄。</div>';
        return;
      }
      const byTask = groupBy(entries, (entry) => entry.taskName);
      taskView.innerHTML = [...byTask.entries()].map(([taskName, taskEntries]) => {
        const byStaff = groupBy(taskEntries, (entry) => entry.staffName);
        const lines = [...byStaff.entries()].map(([staffName, staffEntries]) => `
          <div class="line">
            <strong>${escapeHtml(staffName)}</strong>
            <div class="meta">${staffEntries.map((entry) => escapeHtml(entry.label)).join("、")}</div>
          </div>
        `).join("");
        return `
          <article class="card">
            <h2>${escapeHtml(taskName)}</h2>
            ${lines}
          </article>
        `;
      }).join("");
    }

    function renderStaffStats(entries) {
      if (entries.length === 0) {
        staffView.innerHTML = '<div class="empty">尚無儲存紀錄。</div>';
        return;
      }
      const byStaff = groupBy(entries, (entry) => entry.staffName);
      staffView.innerHTML = [...byStaff.entries()].map(([staffName, staffEntries]) => {
        const byTask = groupBy(staffEntries, (entry) => entry.taskName);
        const lines = [...byTask.entries()].map(([taskName, taskEntries]) => `
          <div class="line">
            <strong>${escapeHtml(taskName)}</strong>
            <div class="meta">次數 ${taskEntries.length} · 平均間隔 ${averageIntervalText(taskEntries)}</div>
            <div class="meta">${taskEntries.map((entry) => escapeHtml(entry.label)).join("、")}</div>
          </div>
        `).join("");
        return `
          <article class="card">
            <h2>${escapeHtml(staffName)}</h2>
            ${lines}
          </article>
        `;
      }).join("");
    }

    function renderHistoryMessages() {
      const visibleRecords = records.filter((record) =>
        STORE_OPTIONS.some((store) => storeHasActivity(record.stores?.[store.id]))
      );

      if (visibleRecords.length === 0) {
        historyView.innerHTML = '<div class="empty">尚無儲存紀錄。</div>';
        return;
      }

      historyView.innerHTML = visibleRecords.map((record) => {
        const message = buildHistoryMessage(record);
        return `
          <article class="card">
            <div class="history-head">
              <div>
                <h2>${escapeHtml(entryDate(record))}</h2>
                <div class="meta">兩店分配文字</div>
              </div>
              <button class="button" type="button" data-copy-record="${escapeHtml(record.id)}">複製</button>
            </div>
            <pre class="message-text">${escapeHtml(message)}</pre>
          </article>
        `;
      }).join("");
    }

    function render() {
      renderStoreTabs();
      const entries = collectEntries();
      renderTaskStats(entries);
      renderStaffStats(entries);
      renderHistoryMessages();
      status.textContent = `${currentStore().name}｜已讀取 ${entries.length} 筆分配`;
    }

    storeTabs.addEventListener("click", (event) => {
      const button = event.target.closest("[data-store]");
      if (!button) return;
      selectedStoreId = button.dataset.store;
      localStorage.setItem("cleaningStatsStore", selectedStoreId);
      render();
    });

    taskTab.addEventListener("click", () => showTab("task"));
    staffTab.addEventListener("click", () => showTab("staff"));
    historyTab.addEventListener("click", () => showTab("history"));

    historyView.addEventListener("click", (event) => {
      const button = event.target.closest("[data-copy-record]");
      if (!button) return;
      const record = records.find((candidate) => candidate.id === button.dataset.copyRecord);
      if (!record) return;
      copyText(buildHistoryMessage(record), button);
    });

    subscribeCleaningRecords(
      (loadedRecords) => {
        records = loadedRecords;
        render();
      },
      () => {
        status.textContent = "紀錄讀取失敗，請確認網路。";
        status.style.color = "#b42318";
      },
    );
  </script>
</body>
</html>
