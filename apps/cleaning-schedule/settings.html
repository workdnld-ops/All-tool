<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>打掃設定</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --danger: #b42318;
      --drag: #8a5a00;
      --drag-soft: #fff4d8;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    button,
    input { font: inherit; }

    .shell {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      display: grid;
      gap: 8px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.24rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 0.76rem;
      min-height: 16px;
    }

    .button,
    .tab,
    .drag-handle {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .button.primary,
    .tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.danger {
      border-color: rgba(180, 35, 24, 0.25);
      color: var(--danger);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .panel,
    .row {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 6px 18px rgba(23, 33, 38, 0.06);
    }

    .panel {
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .panel[hidden] { display: none; }

    .add-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 58px;
      gap: 6px;
      align-items: center;
    }

    .row,
    .heading {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 50px 54px 42px;
      gap: 5px;
      align-items: center;
    }

    .row {
      padding: 6px;
      transition: border-color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .row.dragging {
      border-color: var(--drag);
      background: var(--drag-soft);
      opacity: 0.72;
    }

    .row.drag-over {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.14);
    }

    .drag-handle {
      min-width: 34px;
      padding: 0;
      color: var(--drag);
      background: var(--drag-soft);
      border-color: transparent;
      cursor: grab;
      touch-action: none;
      user-select: none;
      font-size: 1.1rem;
      line-height: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    input {
      width: 100%;
      min-height: 32px;
      border: 1px solid #b8c6cc;
      border-radius: 8px;
      padding: 0 8px;
      color: var(--ink);
      background: #fff;
      min-width: 0;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      min-height: 22px;
      justify-self: center;
    }

    .list {
      display: grid;
      gap: 5px;
    }

    .heading {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 850;
      padding: 0 6px;
    }

    @media (max-width: 520px) {
      .shell { gap: 6px; }
      .button,
      .tab { min-height: 32px; padding: 0 7px; }
      .row,
      .heading { grid-template-columns: 34px minmax(0, 1fr) 42px 46px 36px; }
      .button { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>打掃設定</h1>
        <div class="status" id="status">讀取設定中...</div>
      </div>
      <a class="button" href="index.html">返回</a>
    </header>

    <section class="tabs">
      <button class="tab active" id="staff-tab" type="button">同仁名稱</button>
      <button class="tab" id="task-tab" type="button">打掃項目</button>
    </section>

    <section class="panel" id="staff-panel">
      <div class="add-row">
        <input id="new-staff" type="text" placeholder="新增同仁">
        <button class="button primary" id="add-staff" type="button">新增</button>
      </div>
      <div class="heading" aria-hidden="true">
        <span>拖</span><span>名稱</span><span>啟用</span><span>儲存</span><span>刪</span>
      </div>
      <div class="list" id="staff-list"></div>
    </section>

    <section class="panel" id="task-panel" hidden>
      <div class="add-row">
        <input id="new-task" type="text" placeholder="新增項目">
        <button class="button primary" id="add-task" type="button">新增</button>
      </div>
      <div class="heading" aria-hidden="true">
        <span>拖</span><span>項目</span><span>啟用</span><span>儲存</span><span>刪</span>
      </div>
      <div class="list" id="task-list"></div>
    </section>
  </main>

  <script>
    function markLoadFailure() {
      const status = document.getElementById("status");
      if (!status || !status.textContent.includes("讀取")) return;
      status.textContent = "資料載入失敗，請重新整理";
      status.style.color = "var(--danger)";
    }

    window.addEventListener("error", markLoadFailure);
    window.addEventListener("unhandledrejection", markLoadFailure);
  </script>

  <script type="module">
    import {
      deleteStaffMember,
      deleteTask,
      saveStaffMember,
      saveTask,
      subscribeStaff,
      subscribeTasks,
    } from "./cleaning-data.js?v=cleaning-v3";

    const status = document.getElementById("status");
    const staffPanel = document.getElementById("staff-panel");
    const taskPanel = document.getElementById("task-panel");
    const staffTab = document.getElementById("staff-tab");
    const taskTab = document.getElementById("task-tab");
    const staffList = document.getElementById("staff-list");
    const taskList = document.getElementById("task-list");
    const newStaff = document.getElementById("new-staff");
    const newTask = document.getElementById("new-task");
    let staff = [];
    let tasks = [];
    let dragged = null;
    let pointerDrag = null;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showPanel(type) {
      const isStaff = type === "staff";
      staffPanel.hidden = !isStaff;
      taskPanel.hidden = isStaff;
      staffTab.classList.toggle("active", isStaff);
      taskTab.classList.toggle("active", !isStaff);
    }

    function rowTemplate(item, type) {
      return `
        <div class="row" draggable="true" data-row-type="${type}" data-row-id="${item.id}">
          <button class="drag-handle" type="button" data-drag-handle aria-label="拖曳排序">☰</button>
          <input data-${type}-name="${item.id}" type="text" value="${escapeHtml(item.name)}" aria-label="${escapeHtml(item.name)} 名稱">
          <input data-${type}-active="${item.id}" type="checkbox" ${item.active ? "checked" : ""} aria-label="${escapeHtml(item.name)} 啟用">
          <button class="button primary" data-save-${type}="${item.id}" type="button">儲存</button>
          <button class="button danger" data-delete-${type}="${item.id}" type="button">刪</button>
        </div>
      `;
    }

    function renderStaff() {
      staffList.innerHTML = staff.map((item) => rowTemplate(item, "staff")).join("");
    }

    function renderTasks() {
      taskList.innerHTML = tasks.map((item) => rowTemplate(item, "task")).join("");
    }

    function listForType(type) {
      return type === "staff" ? staff : tasks;
    }

    function setListForType(type, nextList) {
      if (type === "staff") {
        staff = nextList;
        renderStaff();
      } else {
        tasks = nextList;
        renderTasks();
      }
    }

    async function saveItemForType(type, item) {
      if (type === "staff") await saveStaffMember(item);
      else await saveTask(item);
    }

    async function reorderItem(type, fromId, toId) {
      if (!fromId || !toId || fromId === toId) return;
      const sourceList = listForType(type);
      const fromIndex = sourceList.findIndex((item) => item.id === fromId);
      const toIndex = sourceList.findIndex((item) => item.id === toId);
      if (fromIndex < 0 || toIndex < 0) return;

      const nextList = [...sourceList];
      const [moved] = nextList.splice(fromIndex, 1);
      nextList.splice(toIndex, 0, moved);
      const ordered = nextList.map((item, index) => ({ ...item, order: index }));
      setListForType(type, ordered);
      setStatus("儲存排序中...");
      try {
        await Promise.all(ordered.map((item) => saveItemForType(type, item)));
        setStatus("排序已儲存");
      } catch (error) {
        console.error(error);
        setStatus("排序儲存失敗，請確認網路。", true);
      }
    }

    function setupDrag(listElement, type) {
      listElement.addEventListener("dragstart", (event) => {
        const row = event.target.closest(`[data-row-type="${type}"]`);
        if (!row) return;
        dragged = { type, id: row.dataset.rowId };
        row.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", row.dataset.rowId);
      });

      listElement.addEventListener("dragover", (event) => {
        const row = event.target.closest(`[data-row-type="${type}"]`);
        if (!row) return;
        event.preventDefault();
        row.classList.add("drag-over");
      });

      listElement.addEventListener("dragleave", (event) => {
        const row = event.target.closest(`[data-row-type="${type}"]`);
        if (row) row.classList.remove("drag-over");
      });

      listElement.addEventListener("drop", async (event) => {
        const row = event.target.closest(`[data-row-type="${type}"]`);
        if (!row || !dragged || dragged.type !== type) return;
        event.preventDefault();
        row.classList.remove("drag-over");
        await reorderItem(type, dragged.id, row.dataset.rowId);
        dragged = null;
      });

      listElement.addEventListener("dragend", () => {
        listElement.querySelectorAll(".dragging,.drag-over").forEach((row) => {
          row.classList.remove("dragging", "drag-over");
        });
        dragged = null;
      });

      listElement.addEventListener("pointerdown", (event) => {
        const handle = event.target.closest("[data-drag-handle]");
        if (!handle) return;
        const row = handle.closest(`[data-row-type="${type}"]`);
        if (!row) return;
        pointerDrag = { type, id: row.dataset.rowId, pointerId: event.pointerId };
        row.classList.add("dragging");
        handle.setPointerCapture?.(event.pointerId);
      });

      listElement.addEventListener("pointerup", async (event) => {
        if (!pointerDrag || pointerDrag.type !== type) return;
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(`[data-row-type="${type}"]`);
        listElement.querySelectorAll(".dragging,.drag-over").forEach((row) => {
          row.classList.remove("dragging", "drag-over");
        });
        const fromId = pointerDrag.id;
        pointerDrag = null;
        if (target) await reorderItem(type, fromId, target.dataset.rowId);
      });

      listElement.addEventListener("pointercancel", () => {
        pointerDrag = null;
        listElement.querySelectorAll(".dragging,.drag-over").forEach((row) => {
          row.classList.remove("dragging", "drag-over");
        });
      });
    }

    staffTab.addEventListener("click", () => showPanel("staff"));
    taskTab.addEventListener("click", () => showPanel("task"));

    document.getElementById("add-staff").addEventListener("click", async () => {
      const name = newStaff.value.trim();
      if (!name) return setStatus("請輸入同仁名稱", true);
      await saveStaffMember({ name, order: staff.length });
      newStaff.value = "";
      setStatus("同仁已新增");
    });

    document.getElementById("add-task").addEventListener("click", async () => {
      const name = newTask.value.trim();
      if (!name) return setStatus("請輸入打掃項目", true);
      await saveTask({ name, order: tasks.length });
      newTask.value = "";
      setStatus("項目已新增");
    });

    staffList.addEventListener("click", async (event) => {
      const save = event.target.closest("[data-save-staff]");
      const del = event.target.closest("[data-delete-staff]");
      if (save) {
        const id = save.dataset.saveStaff;
        const current = staff.find((item) => item.id === id);
        await saveStaffMember({
          id,
          name: document.querySelector(`[data-staff-name="${id}"]`).value.trim(),
          order: current?.order || 0,
          active: document.querySelector(`[data-staff-active="${id}"]`).checked,
        });
        setStatus("同仁已儲存");
      }
      if (del && confirm("確定刪除這位同仁？")) {
        await deleteStaffMember(del.dataset.deleteStaff);
        setStatus("同仁已刪除");
      }
    });

    taskList.addEventListener("click", async (event) => {
      const save = event.target.closest("[data-save-task]");
      const del = event.target.closest("[data-delete-task]");
      if (save) {
        const id = save.dataset.saveTask;
        const current = tasks.find((item) => item.id === id);
        await saveTask({
          id,
          name: document.querySelector(`[data-task-name="${id}"]`).value.trim(),
          order: current?.order || 0,
          active: document.querySelector(`[data-task-active="${id}"]`).checked,
        });
        setStatus("項目已儲存");
      }
      if (del && confirm("確定刪除這個項目？")) {
        await deleteTask(del.dataset.deleteTask);
        setStatus("項目已刪除");
      }
    });

    setupDrag(staffList, "staff");
    setupDrag(taskList, "task");

    subscribeStaff(
      (loadedStaff) => {
        staff = loadedStaff;
        renderStaff();
        setStatus("設定已同步");
      },
      () => setStatus("同仁讀取失敗，請確認網路。", true),
    );

    subscribeTasks(
      (loadedTasks) => {
        tasks = loadedTasks;
        renderTasks();
        setStatus("設定已同步");
      },
      () => setStatus("項目讀取失敗，請確認網路。", true),
    );
  </script>
</body>
</html>
