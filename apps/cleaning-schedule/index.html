<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>打掃安排</title>
  <link rel="icon" href="../../assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #fff;
      --ink: #172126;
      --muted: #63717a;
      --line: #dce4e8;
      --primary: #1f6f64;
      --primary-soft: #e4f0ee;
      --assigned: #8a5a00;
      --assigned-soft: #fff4d8;
      --danger: #b42318;
      --rose: #9a3d55;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    button,
    input { font: inherit; }

    button,
    body,
    .button,
    .tab,
    .chip,
    .mini-button,
    .assignment-row {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    input {
      -webkit-user-select: text;
      user-select: text;
    }

    .shell {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      display: grid;
      gap: 8px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.28rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 0.76rem;
      min-height: 16px;
    }

    .button,
    .tab,
    .chip,
    .mini-button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .button,
    .tab { padding: 0 10px; }

    .button.primary,
    .tab.active,
    .chip.selected {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.feedback {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .button.feedback-error {
      border-color: var(--danger);
      background: #fff5f4;
      color: var(--danger);
    }

    .chip.assigned {
      border-color: var(--assigned);
      background: var(--assigned-soft);
      color: var(--assigned);
    }

    .chip.selected.assigned {
      border-color: var(--assigned);
      background: var(--assigned);
      color: #fff;
    }

    .chip.recent-task {
      border-color: #c47a1b;
      box-shadow: inset 0 0 0 1px rgba(196, 122, 27, 0.3);
    }

    .button.rose {
      border-color: var(--rose);
      background: var(--rose);
      color: #fff;
    }

    .top-actions,
    .store-tabs,
    .flow-actions,
    .time-grid {
      display: grid;
      gap: 6px;
    }

    .top-actions,
    .flow-actions,
    .store-tabs,
    .time-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .top-actions,
    .record-actions {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel,
    .assignment-row {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 6px 18px rgba(23, 33, 38, 0.06);
    }

    .panel {
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .panel-title {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.25;
      color: var(--muted);
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
    }

    input {
      width: 100%;
      min-height: 34px;
      border: 1px solid #b8c6cc;
      border-radius: 8px;
      padding: 0 9px;
      color: var(--ink);
      background: #fff;
    }

    .chip-list,
    .staff-tray,
    .assigned-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      min-height: 30px;
      padding: 0 9px;
      font-size: 0.84rem;
    }

    .chip.staff { touch-action: none; }

    .mini-button {
      min-height: 28px;
      padding: 0 8px;
      font-size: 0.78rem;
      color: var(--primary);
      background: var(--primary-soft);
      border-color: transparent;
    }

    .view {
      display: grid;
      gap: 8px;
    }

    .view[hidden] { display: none; }

    .assignment-row {
      padding: 8px;
      display: grid;
      gap: 7px;
    }

    .assignment-row.recent-task {
      border-color: #c47a1b;
      background: #fff8ec;
      box-shadow: 0 0 0 3px rgba(196, 122, 27, 0.12);
    }

    .recent-label {
      color: #9a5a00;
      font-size: 0.72rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .last-assigned {
      color: #8a5a00;
      font-weight: 850;
    }

    .assignment-row.drag-over {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 100, 0.14);
    }

    .task-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 900;
      line-height: 1.3;
    }

    .assigned-list {
      min-height: 34px;
      align-items: center;
      padding: 4px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .empty {
      color: var(--muted);
      font-size: 0.84rem;
    }

    @media (max-width: 520px) {
      .shell { gap: 6px; }
      h1 { font-size: 1.18rem; }
      .button,
      .tab { min-height: 32px; padding: 0 8px; }
      .panel { padding: 7px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>打掃安排</h1>
        <div class="status" id="status">讀取設定中...</div>
      </div>
      <div class="top-actions">
        <a class="button" href="../../index.html">工具箱</a>
        <a class="button" href="stats.html">統計</a>
        <a class="button" href="settings.html">設定</a>
      </div>
    </header>

    <section class="view" id="setup-view">
      <section class="panel" aria-label="時間">
        <div class="panel-title">選擇時間</div>
        <div class="time-grid">
          <label>
            開始
            <input id="start-time" type="time" value="14:00">
          </label>
          <label>
            結束
            <input id="end-time" type="time" value="15:00">
          </label>
        </div>
      </section>

      <section class="store-tabs" id="store-tabs" aria-label="選擇店別"></section>

      <section class="panel">
        <div class="panel-title">選擇該店人力</div>
        <div class="chip-list" id="staff-list"></div>
      </section>

      <section class="panel">
        <div class="panel-title">選擇打掃項目</div>
        <div class="chip-list" id="task-list"></div>
      </section>

      <div class="flow-actions record-actions">
        <button class="button" id="copy-line-setup" type="button">複製Line</button>
        <button class="button primary" id="go-assign" type="button">分配項目</button>
      </div>
    </section>

    <section class="view" id="assign-view" hidden>
      <section class="panel">
        <div class="panel-title" id="assign-title">分配打掃項目</div>
        <div class="staff-tray" id="staff-tray"></div>
      </section>

      <section class="view" id="assignment-list"></section>

      <section class="panel">
        <div class="task-title">
          <span>以上完成去做</span>
          <button class="mini-button" id="clear-extra" type="button">清空</button>
        </div>
        <div class="chip-list" id="extra-task-list"></div>
        <input id="done-extra-note" type="text" placeholder="其他補充，例如：買零食$325">
      </section>

      <div class="flow-actions">
        <button class="button" id="back-setup" type="button">返回選擇</button>
        <button class="button primary" id="save-record" type="button">儲存紀錄</button>
        <button class="button rose" id="copy-line" type="button">複製Line</button>
      </div>
    </section>
  </main>

  <script>
    function markLoadFailure() {
      const status = document.getElementById("status");
      if (!status || !status.textContent.includes("讀取")) return;
      status.textContent = "資料載入失敗，請重新整理";
      status.style.color = "var(--danger)";
    }

    window.addEventListener("error", markLoadFailure);
    window.addEventListener("unhandledrejection", markLoadFailure);
  </script>

  <script type="module">
    import {
      STORE_OPTIONS,
      saveCleaningRecord,
      subscribeCleaningRecords,
      subscribeStaff,
      subscribeTasks,
    } from "./cleaning-data.js?v=cleaning-v7";

    const status = document.getElementById("status");
    const startTime = document.getElementById("start-time");
    const endTime = document.getElementById("end-time");
    const storeTabs = document.getElementById("store-tabs");
    const staffList = document.getElementById("staff-list");
    const taskList = document.getElementById("task-list");
    const setupView = document.getElementById("setup-view");
    const assignView = document.getElementById("assign-view");
    const assignTitle = document.getElementById("assign-title");
    const staffTray = document.getElementById("staff-tray");
    const assignmentList = document.getElementById("assignment-list");
    const extraTaskList = document.getElementById("extra-task-list");
    const doneExtraNote = document.getElementById("done-extra-note");

    let staff = [];
    let tasks = [];
    let records = [];
    let selectedStoreId = localStorage.getItem("cleaningStore") || STORE_OPTIONS[0].id;
    const plan = Object.fromEntries(STORE_OPTIONS.map((store) => [
      store.id,
      { staffIds: [], taskIds: [], assignments: {}, extraTaskIds: [], extraNote: "" },
    ]));
    let draggedStaffId = "";

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function flashButton(button, label, isError = false) {
      if (!button) return;
      const original = button.dataset.originalLabel || button.textContent;
      button.dataset.originalLabel = original;
      window.clearTimeout(Number(button.dataset.feedbackTimer || 0));
      button.textContent = label;
      button.classList.toggle("feedback", !isError);
      button.classList.toggle("feedback-error", isError);
      button.dataset.feedbackTimer = String(window.setTimeout(() => {
        button.textContent = original;
        button.classList.remove("feedback", "feedback-error");
      }, 1500));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function activeStaff() {
      return staff.filter((member) => member.active);
    }

    function activeTasks() {
      return tasks.filter((task) => task.active);
    }

    function currentStore() {
      return STORE_OPTIONS.find((store) => store.id === selectedStoreId) || STORE_OPTIONS[0];
    }

    function currentPlan() {
      return plan[selectedStoreId];
    }

    function findStaff(id) {
      return staff.find((member) => member.id === id);
    }

    function findTask(id) {
      return tasks.find((task) => task.id === id);
    }

    function storeHasActivity(storeRecord) {
      if (!storeRecord) return false;
      if (Object.keys(storeRecord.assignments || {}).length > 0) return true;
      if ((storeRecord.taskIds || []).length > 0) return true;
      if ((storeRecord.extraTaskIds || []).length > 0) return true;
      return Boolean(storeRecord.extraNote);
    }

    function recordHasStaffTask(record, staffId, taskId, storeId = selectedStoreId) {
      const assignment = record.stores?.[storeId]?.assignments?.[taskId];
      return Array.isArray(assignment?.staffIds) && assignment.staffIds.includes(staffId);
    }

    function recentRecordsForStore(storeId = selectedStoreId) {
      return records
        .filter((record) => storeHasActivity(record.stores?.[storeId]))
        .slice(0, 3);
    }

    function lastRecordForStore(storeId = selectedStoreId) {
      return records.find((record) => storeHasActivity(record.stores?.[storeId]));
    }

    function lastTaskSetForStore(storeId = selectedStoreId) {
      const storeRecord = lastRecordForStore(storeId)?.stores?.[storeId];
      const taskIds = new Set([
        ...Object.keys(storeRecord?.assignments || {}),
        ...(storeRecord?.taskIds || []),
      ]);
      for (const taskId of storeRecord?.extraTaskIds || []) taskIds.add(taskId);
      return taskIds;
    }

    function lastStaffNamesForTask(taskId, storeId = selectedStoreId) {
      const assignment = lastRecordForStore(storeId)?.stores?.[storeId]?.assignments?.[taskId];
      if (!assignment) return [];
      const names = assignment.staffNames || [];
      return (assignment.staffIds || [])
        .map((staffId, index) => names[index] || findStaff(staffId)?.name || staffId)
        .filter(Boolean);
    }

    function repeatWarning(staffId, taskId) {
      const recentRecords = recentRecordsForStore();
      if (recentRecords.length < 3) return "";
      const repeated = recentRecords.every((record) => recordHasStaffTask(record, staffId, taskId));
      if (!repeated) return "";
      const member = findStaff(staffId);
      const task = findTask(taskId);
      return `${member?.name || "此同仁"} 最近三次都有做「${task?.name || "此項目"}」`;
    }

    function assignedStaffSet() {
      return new Set(Object.values(currentPlan().assignments).flat());
    }

    function renderStores() {
      storeTabs.innerHTML = STORE_OPTIONS.map((store) => `
        <button class="tab ${store.id === selectedStoreId ? "active" : ""}" type="button" data-store="${store.id}">
          ${escapeHtml(store.name)}
        </button>
      `).join("");
    }

    function renderChips() {
      const current = currentPlan();
      const assigned = assignedStaffSet();
      const lastTasks = lastTaskSetForStore();
      staffList.innerHTML = activeStaff().map((member) => `
        <button class="chip ${current.staffIds.includes(member.id) ? "selected" : ""} ${assigned.has(member.id) ? "assigned" : ""}" type="button" data-staff="${member.id}">
          ${escapeHtml(member.name)}
        </button>
      `).join("") || '<span class="empty">尚無同仁，請先到設定新增。</span>';

      taskList.innerHTML = activeTasks().map((task) => `
        <button class="chip ${current.taskIds.includes(task.id) ? "selected" : ""} ${lastTasks.has(task.id) ? "recent-task" : ""}" type="button" data-task="${task.id}">
          ${escapeHtml(task.name)}
        </button>
      `).join("") || '<span class="empty">尚無項目，請先到設定新增。</span>';
    }

    function renderExtraTasks() {
      const current = currentPlan();
      extraTaskList.innerHTML = activeTasks().map((task) => `
        <button class="chip ${current.extraTaskIds.includes(task.id) ? "selected" : ""}" type="button" data-extra-task="${task.id}">
          ${escapeHtml(task.name)}
        </button>
      `).join("");
      doneExtraNote.value = current.extraNote || "";
    }

    function cleanupSelections() {
      for (const store of STORE_OPTIONS) {
        const storePlan = plan[store.id];
        storePlan.staffIds = storePlan.staffIds.filter((id) => staff.some((member) => member.id === id && member.active));
        storePlan.taskIds = storePlan.taskIds.filter((id) => tasks.some((task) => task.id === id && task.active));
        storePlan.extraTaskIds = storePlan.extraTaskIds.filter((id) => tasks.some((task) => task.id === id && task.active));
        for (const taskId of Object.keys(storePlan.assignments)) {
          if (!storePlan.taskIds.includes(taskId)) delete storePlan.assignments[taskId];
          else storePlan.assignments[taskId] = (storePlan.assignments[taskId] || []).filter((id) => storePlan.staffIds.includes(id));
        }
      }
    }

    function addStaffToTask(taskId, staffId) {
      const current = currentPlan();
      if (!current.staffIds.includes(staffId)) return;
      current.assignments[taskId] ||= [];
      if (!current.assignments[taskId].includes(staffId)) current.assignments[taskId].push(staffId);
      const warning = repeatWarning(staffId, taskId);
      if (warning) setStatus(`提醒：${warning}`, true);
      renderAssignments();
    }

    function removeStaffFromTask(taskId, staffId) {
      const assigned = currentPlan().assignments[taskId] || [];
      currentPlan().assignments[taskId] = assigned.filter((id) => id !== staffId);
      renderAssignments();
    }

    function renderAssignments() {
      const current = currentPlan();
      const assigned = assignedStaffSet();
      const lastTasks = lastTaskSetForStore();
      assignTitle.textContent = `${currentStore().name} 分配打掃項目`;
      staffTray.innerHTML = current.staffIds.map((id) => {
        const member = findStaff(id);
        if (!member) return "";
        return `<button class="chip staff ${assigned.has(id) ? "assigned" : ""}" draggable="true" data-drag-staff="${id}" type="button">${escapeHtml(member.name)}</button>`;
      }).join("") || '<span class="empty">請先選擇該店人力。</span>';

      assignmentList.innerHTML = current.taskIds.map((taskId) => {
        const task = findTask(taskId);
        const assignedNames = current.assignments[taskId] || [];
        const didLastTime = lastTasks.has(taskId);
        const lastNames = lastStaffNamesForTask(taskId);
        const assignedText = assignedNames.map((staffId) => {
          const member = findStaff(staffId);
          if (!member) return "";
          return `<button class="chip selected assigned" data-remove-staff="${staffId}" data-task-row="${taskId}" type="button">${escapeHtml(member.name)} ×</button>`;
        }).join("");
        const emptyText = lastNames.length > 0
          ? `<span class="empty last-assigned">上次：${escapeHtml(lastNames.join("、"))}</span>`
          : '<span class="empty">未分配</span>';
        return `
          <article class="assignment-row ${didLastTime ? "recent-task" : ""}" data-drop-task="${taskId}">
            <div class="task-title">
              <span>${escapeHtml(task?.name || "未命名項目")}</span>
              ${didLastTime ? '<span class="recent-label">上次項目</span>' : ""}
              <button class="mini-button" data-clear-task="${taskId}" type="button">清空</button>
            </div>
            <div class="assigned-list">
              ${assignedText || emptyText}
            </div>
          </article>
        `;
      }).join("") || '<div class="empty">請先選擇打掃項目。</div>';
      renderExtraTasks();
      renderChips();
    }

    function showAssignView() {
      if (currentPlan().staffIds.length === 0 || currentPlan().taskIds.length === 0) {
        setStatus("請先選擇人力與打掃項目", true);
        return;
      }
      setupView.hidden = true;
      assignView.hidden = false;
      renderAssignments();
      setStatus(`${currentStore().name} 分配中`);
    }

    function showSetupView() {
      setupView.hidden = false;
      assignView.hidden = true;
      renderChips();
      setStatus(`${currentStore().name} 選擇中`);
    }

    function lineForStore(store) {
      const storePlan = plan[store.id];
      const lines = [store.name];
      const groups = new Map();
      for (const taskId of storePlan.taskIds) {
        const task = findTask(taskId);
        const names = (storePlan.assignments[taskId] || [])
          .map((staffId) => findStaff(staffId)?.name)
          .filter(Boolean);
        if (!task || names.length === 0) continue;
        const nameText = names.join("、");
        if (!groups.has(nameText)) groups.set(nameText, []);
        groups.get(nameText).push(task.name);
      }
      for (const [nameText, taskNames] of groups) {
        lines.push(`${taskNames.join("、")}：${nameText}`);
      }

      const extraNames = storePlan.extraTaskIds
        .map((taskId) => findTask(taskId)?.name)
        .filter(Boolean);
      if (storePlan.extraNote) extraNames.push(storePlan.extraNote);
      if (extraNames.length > 0) lines.push(`以上完成去做：${extraNames.join("、")}`);
      return lines.join("\n");
    }

    function buildLineMessage() {
      const start = startTime.value || "14:00";
      const end = endTime.value || "15:00";
      return `打掃${start}-${end}\n\n${STORE_OPTIONS.map(lineForStore).join("\n\n")}`;
    }

    function buildCleaningRecord() {
      const createdAt = new Date().toISOString();
      const stores = Object.fromEntries(STORE_OPTIONS.map((store) => {
        const storePlan = plan[store.id];
        const assignments = {};
        for (const taskId of storePlan.taskIds) {
          const assignedStaffIds = storePlan.assignments[taskId] || [];
          if (assignedStaffIds.length === 0) continue;
          const task = findTask(taskId);
          assignments[taskId] = {
            taskId,
            taskName: task?.name || "",
            staffIds: assignedStaffIds,
            staffNames: assignedStaffIds.map((staffId) => findStaff(staffId)?.name).filter(Boolean),
          };
        }
        const extraTaskNames = storePlan.extraTaskIds
          .map((taskId) => findTask(taskId)?.name)
          .filter(Boolean);
        return [store.id, {
          storeId: store.id,
          storeName: store.name,
          taskIds: storePlan.taskIds,
          taskNames: storePlan.taskIds.map((taskId) => findTask(taskId)?.name).filter(Boolean),
          assignments,
          extraTaskIds: storePlan.extraTaskIds,
          extraTaskNames,
          extraNote: storePlan.extraNote || "",
        }];
      }));
      return {
        date: createdAt.slice(0, 10),
        createdAt,
        startTime: startTime.value || "14:00",
        endTime: endTime.value || "15:00",
        stores,
      };
    }

    async function saveRecord() {
      try {
        await saveCleaningRecord(buildCleaningRecord());
        setStatus("打掃紀錄已儲存");
      } catch (error) {
        console.error(error);
        setStatus("紀錄儲存失敗，請確認網路。", true);
      }
    }

    async function copyLine(button) {
      const message = buildLineMessage();
      try {
        await navigator.clipboard.writeText(message);
        setStatus("Line 訊息已複製");
        flashButton(button, "已複製");
      } catch {
        try {
          const textarea = document.createElement("textarea");
          textarea.value = message;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          document.body.append(textarea);
          textarea.select();
          const copied = document.execCommand("copy");
          textarea.remove();
          if (!copied) throw new Error("Copy command failed");
          setStatus("Line 訊息已複製");
          flashButton(button, "已複製");
        } catch (error) {
          console.error(error);
          setStatus("複製失敗，請再試一次", true);
          flashButton(button, "複製失敗", true);
        }
      }
    }

    storeTabs.addEventListener("click", (event) => {
      const button = event.target.closest("[data-store]");
      if (!button) return;
      currentPlan().extraNote = doneExtraNote.value.trim();
      selectedStoreId = button.dataset.store;
      localStorage.setItem("cleaningStore", selectedStoreId);
      renderStores();
      renderChips();
      if (!assignView.hidden) renderAssignments();
      setStatus(`已切換到${currentStore().name}`);
    });

    staffList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-staff]");
      if (!button) return;
      const ids = currentPlan().staffIds;
      if (ids.includes(button.dataset.staff)) {
        currentPlan().staffIds = ids.filter((id) => id !== button.dataset.staff);
        for (const taskId of Object.keys(currentPlan().assignments)) {
          removeStaffFromTask(taskId, button.dataset.staff);
        }
      } else {
        ids.push(button.dataset.staff);
      }
      renderChips();
    });

    taskList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-task]");
      if (!button) return;
      const ids = currentPlan().taskIds;
      if (ids.includes(button.dataset.task)) {
        currentPlan().taskIds = ids.filter((id) => id !== button.dataset.task);
        delete currentPlan().assignments[button.dataset.task];
      } else {
        ids.push(button.dataset.task);
      }
      renderChips();
    });

    staffTray.addEventListener("dragstart", (event) => {
      const button = event.target.closest("[data-drag-staff]");
      if (!button) return;
      draggedStaffId = button.dataset.dragStaff;
      event.dataTransfer.setData("text/plain", draggedStaffId);
    });

    staffTray.addEventListener("click", (event) => {
      const button = event.target.closest("[data-drag-staff]");
      if (!button) return;
      draggedStaffId = button.dataset.dragStaff;
      setStatus(`已選擇 ${findStaff(draggedStaffId)?.name || ""}，點任務列即可加入`);
    });

    assignmentList.addEventListener("dragover", (event) => {
      const row = event.target.closest("[data-drop-task]");
      if (!row) return;
      event.preventDefault();
      row.classList.add("drag-over");
    });

    assignmentList.addEventListener("dragleave", (event) => {
      const row = event.target.closest("[data-drop-task]");
      if (row) row.classList.remove("drag-over");
    });

    assignmentList.addEventListener("drop", (event) => {
      const row = event.target.closest("[data-drop-task]");
      if (!row) return;
      event.preventDefault();
      row.classList.remove("drag-over");
      addStaffToTask(row.dataset.dropTask, event.dataTransfer.getData("text/plain"));
    });

    assignmentList.addEventListener("click", (event) => {
      const remove = event.target.closest("[data-remove-staff]");
      if (remove) {
        removeStaffFromTask(remove.dataset.taskRow, remove.dataset.removeStaff);
        return;
      }

      const clear = event.target.closest("[data-clear-task]");
      if (clear) {
        currentPlan().assignments[clear.dataset.clearTask] = [];
        renderAssignments();
        return;
      }

      const row = event.target.closest("[data-drop-task]");
      if (row && draggedStaffId) addStaffToTask(row.dataset.dropTask, draggedStaffId);
    });

    extraTaskList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-extra-task]");
      if (!button) return;
      const ids = currentPlan().extraTaskIds;
      if (ids.includes(button.dataset.extraTask)) {
        currentPlan().extraTaskIds = ids.filter((id) => id !== button.dataset.extraTask);
      } else {
        ids.push(button.dataset.extraTask);
      }
      renderExtraTasks();
    });

    doneExtraNote.addEventListener("input", () => {
      currentPlan().extraNote = doneExtraNote.value.trim();
    });

    document.getElementById("clear-extra").addEventListener("click", () => {
      currentPlan().extraTaskIds = [];
      currentPlan().extraNote = "";
      renderExtraTasks();
    });

    document.getElementById("go-assign").addEventListener("click", showAssignView);
    document.getElementById("back-setup").addEventListener("click", showSetupView);
    document.getElementById("save-record").addEventListener("click", saveRecord);
    document.getElementById("copy-line").addEventListener("click", (event) => copyLine(event.currentTarget));
    document.getElementById("copy-line-setup").addEventListener("click", (event) => copyLine(event.currentTarget));

    renderStores();

    subscribeStaff(
      (loadedStaff) => {
        staff = loadedStaff;
        cleanupSelections();
        renderChips();
        if (!assignView.hidden) renderAssignments();
        setStatus("設定已同步");
      },
      () => setStatus("同仁讀取失敗，請確認網路。", true),
    );

    subscribeTasks(
      (loadedTasks) => {
        tasks = loadedTasks;
        cleanupSelections();
        renderChips();
        if (!assignView.hidden) renderAssignments();
        setStatus("設定已同步");
      },
      () => setStatus("項目讀取失敗，請確認網路。", true),
    );

    subscribeCleaningRecords(
      (loadedRecords) => {
        records = loadedRecords;
        renderChips();
        if (!assignView.hidden) renderAssignments();
      },
      () => setStatus("紀錄讀取失敗，連續分配提醒暫時不可用。", true),
    );
  </script>
</body>
</html>
