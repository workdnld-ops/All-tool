<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>庶務工具箱</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #1d252c;
      --muted: #66727c;
      --line: #dfe5e8;
      --primary: #1f6f64;
      --gold: #8a5a00;
      --blue: #245b9b;
      --rose: #9a3d55;
      --shadow: 0 10px 24px rgba(30, 42, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    body.reordering {
      overflow: hidden;
      touch-action: none;
    }

    a,
    button,
    .tool,
    .icon {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .shell {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      flex: 0 0 auto;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .edit-button.active {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    a.edit-button { display: grid; place-items: center; text-decoration: none; }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .date {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .tool {
      min-height: 94px;
      display: grid;
      place-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 8px;
      color: inherit;
      text-align: center;
      text-decoration: none;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
      transition: opacity 140ms ease, transform 140ms ease, border-color 140ms ease;
    }

    .tool:active {
      transform: translateY(1px);
    }

    .tool.dragging {
      opacity: 0.45;
      border-color: var(--primary);
      transform: scale(0.98);
      cursor: grabbing;
    }

    .drag-handle {
      width: 30px;
      height: 30px;
      display: none;
      place-items: center;
      position: absolute;
      top: 5px;
      right: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--primary);
      background: rgba(255, 255, 255, 0.95);
      cursor: grab;
      touch-action: none;
      z-index: 2;
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      line-height: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .color-handle { display:none; position:absolute; top:5px; left:5px; width:30px; height:30px; border:1px solid #c8d2d9; border-radius:50%; background:var(--tool-color,#e5f2ef); cursor:pointer; box-shadow:inset 0 0 0 4px white; }
    .grid.editing .color-handle { display:block; }
    .tool[style*="--tool-color"] .icon { background:var(--tool-color); color:var(--tool-ink); }
    .tool[style*="--tool-color"] h2 { color:var(--tool-ink); }
    #preferences-status { font-size:12px; color:var(--muted); margin:0 0 12px; min-height:18px; }
    #color-picker { border:1px solid var(--line); border-radius:8px; padding:18px; width:min(360px,calc(100% - 32px)); color:var(--ink); }
    #color-picker::backdrop { background:#172d3c66; }
    #color-picker h2 { font-size:18px; margin:0; }
    .palette-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; }
    .palette { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin-bottom:16px; }
    .swatch { aspect-ratio:1; min-height:36px; border:2px solid transparent; border-radius:6px; cursor:pointer; }
    .swatch[aria-pressed="true"] { border-color:#24343d; box-shadow:inset 0 0 0 3px white; }
    .swatch:focus-visible { outline:3px solid #24343d; outline-offset:2px; }
    .grid.editing .tool {
      cursor: default;
      padding-top: 18px;
    }

    .grid.editing .drag-handle {
      display: grid;
    }

    .grid.dragging {
      cursor: grabbing;
    }

    .icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--primary);
      background: #e5f2ef;
    }

    .icon.purchase {
      color: var(--gold);
      background: #fff4d8;
    }

    .icon.drink {
      color: var(--blue);
      background: #e7f0fb;
    }

    .icon.cleaning {
      color: var(--rose);
      background: #fbe8ee;
    }

    .icon.celebration {
      color: #7b4f00;
      background: #fff3cf;
    }

    .icon.schedule {
      color: #1f6f64;
      background: #e5f2ef;
    }

    .icon.todo {
      color: #2f6f5e;
      background: #e5f1ed;
    }

    .icon.cash {
      color: #245b9b;
      background: #e7f0fb;
    }

    .icon.sharing {
      color: #8c4a1d;
      background: #f9eadf;
    }

    .icon.acceptance {
      color: #6c3f82;
      background: #f0e8f4;
    }

    .icon.lottery {
      color: #286356;
      background: #e5f2ec;
    }

    .icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    @media (max-width: 420px) {
      .shell { padding-left: 10px; padding-right: 10px; }
      header { align-items: flex-start; flex-direction: column; }
      .header-actions { width: 100%; justify-content: space-between; }
      .date { white-space: normal; }
      .tool { min-height: 84px; padding: 9px 5px; gap: 6px; }
      .icon { width: 36px; height: 36px; }
      .icon svg { width: 21px; height: 21px; }
      h2 { font-size: 0.78rem; }
    }
  </style>
</head>

  <dialog id="color-picker" aria-labelledby="color-title"><div class="palette-head"><h2 id="color-title">縮圖顏色</h2><button type="button" class="edit-button" id="close-color" aria-label="關閉">×</button></div><div class="palette" id="palette"></div><button type="button" class="edit-button" id="reset-color">恢復原色</button></dialog>
  <script type="module">
    import { PALETTE, paletteInk, connectPreferences, orderedIds } from './assets/toolbox-preferences.mjs?v=2';
    const today = new Intl.DateTimeFormat("zh-TW", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "short"
    }).format(new Date());

    document.getElementById("today").textContent = today;

    const toolGrid = document.getElementById("tool-grid");
    const editButton = document.getElementById("edit-tools");
    const TOOL_ORDER_KEY = "opsToolboxToolOrder";
    let editMode = false;
    let dragState = null;
    let preferences = {version:1,order:[],colors:{}}, preferencesRepo, colorTool = null, canEdit = false;
    const preferencesStatus = document.createElement('p');
    preferencesStatus.id = 'preferences-status';
    preferencesStatus.setAttribute('role','status');
    toolGrid.before(preferencesStatus);
    editButton.disabled = true;
    const colorPicker = document.getElementById('color-picker');
    document.getElementById('close-color').onclick = () => colorPicker.close();
    colorPicker.addEventListener('click', event => { if (event.target === colorPicker && (event.clientX < colorPicker.getBoundingClientRect().left || event.clientX > colorPicker.getBoundingClientRect().right || event.clientY < colorPicker.getBoundingClientRect().top || event.clientY > colorPicker.getBoundingClientRect().bottom)) colorPicker.close(); });
    async function savePreference(command) {
      if (!canEdit || !preferencesRepo) return;
      preferencesStatus.textContent = '儲存中…';
      try { await preferencesRepo.commit(command); preferencesStatus.textContent = '設定已儲存'; }
      catch (error) { preferencesStatus.textContent = error.message; applyToolOrder(); }
    }
    function openColors(link) {
      if (!canEdit) return;
      colorTool = link.dataset.toolId;
      document.getElementById('color-title').textContent = link.querySelector('h2').textContent + ' · 顏色';
      document.getElementById('palette').replaceChildren(...PALETTE.map(([name,hex]) => {
        const swatch=document.createElement('button');
        swatch.type='button'; swatch.className='swatch'; swatch.style.background=hex;
        swatch.title=`${name} ${hex}`; swatch.setAttribute('aria-label',swatch.title);
        swatch.setAttribute('aria-pressed',String(preferences.colors[colorTool] === hex));
        swatch.onclick=() => { savePreference({type:'color',id:colorTool,color:hex}); colorPicker.close(); };
        return swatch;
      }));
      colorPicker.showModal();
    }
    document.getElementById('reset-color').onclick = () => { savePreference({type:'color',id:colorTool,color:null}); colorPicker.close(); };

    function toolLinks() {
      return Array.from(toolGrid.querySelectorAll("[data-tool-url]"));
    }

    function saveToolOrder() {
      const order = toolLinks()
        .map((link) => link.getAttribute("data-tool-id"))
        .filter(Boolean);
      try { localStorage.setItem(TOOL_ORDER_KEY, JSON.stringify(order)); } catch { /* Cloud saving is independent of local cache. */ }
      savePreference({type:'order',order});
    }

    function applyToolOrder() {
      try {
        const savedOrder = orderedIds(toolLinks().map(link => link.dataset.toolId), preferences.order);
        for (const link of toolLinks()) {
          const color = preferences.colors[link.dataset.toolId];
          if (color) {
            link.style.setProperty('--tool-color',color);
            link.style.setProperty('--tool-ink',paletteInk(color));
          } else {
            link.style.removeProperty('--tool-color');
            link.style.removeProperty('--tool-ink');
          }
        }
        const orderIndex = new Map(savedOrder.map((id, index) => [id, index]));
        toolLinks()
          .sort((a, b) => {
            const aIndex = orderIndex.has(a.dataset.toolId) ? orderIndex.get(a.dataset.toolId) : Number.MAX_SAFE_INTEGER;
            const bIndex = orderIndex.has(b.dataset.toolId) ? orderIndex.get(b.dataset.toolId) : Number.MAX_SAFE_INTEGER;
            return aIndex - bIndex;
          })
          .forEach((link) => toolGrid.append(link));
      } catch {
        localStorage.removeItem(TOOL_ORDER_KEY);
      }
    }

    function installDragHandles() {
      toolLinks().forEach((link) => {
        if (link.querySelector(".drag-handle")) return;
        const handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "↕";
        handle.setAttribute("role", "button");
        handle.setAttribute("tabindex", "0");
        handle.setAttribute("aria-label", `拖曳排序：${link.textContent.trim()}`);
        link.append(handle);
        const colorHandle = document.createElement('span');
        colorHandle.className='color-handle'; colorHandle.tabIndex=0; colorHandle.setAttribute('role','button');
        colorHandle.setAttribute('aria-label',`調整顏色：${link.querySelector('h2').textContent}`);
        colorHandle.title='縮圖顏色';
        colorHandle.onclick=event => { event.preventDefault(); event.stopPropagation(); openColors(link); };
        colorHandle.onkeydown=event => { if (['Enter',' '].includes(event.key)) { event.preventDefault(); event.stopPropagation(); openColors(link); } };
        link.append(colorHandle);
        handle.addEventListener('keydown',event => {
          if (!editMode || !['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) return;
          event.preventDefault(); event.stopPropagation();
          const links=toolLinks(), index=links.indexOf(link), delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3}[event.key], target=links[index+delta];
          if (!target) return;
          if (delta>0) target.after(link); else target.before(link);
          saveToolOrder(); handle.focus();
        });
      });
    }

    function setEditMode(nextMode) {
      if (nextMode && !canEdit) return;
      editMode = nextMode;
      toolGrid.classList.toggle("editing", editMode);
      editButton.classList.toggle("active", editMode);
      editButton.textContent = editMode ? "完成" : "編輯";
      if (!editMode) finishDrag();
    }

    function finishDrag() {
      if (!dragState) return;
      const { link, handle, didDrag, pointerId } = dragState;
      try {
        handle.releasePointerCapture(pointerId);
      } catch {
        // Pointer capture may already be released by the browser.
      }
      link.classList.remove("dragging");
      link.dataset.dragging = didDrag ? "true" : "";
      toolGrid.classList.remove("dragging");
      document.body.classList.remove("reordering");
      if (didDrag) {
        saveToolOrder();
        window.setTimeout(() => {
          link.dataset.dragging = "";
        }, 250);
      }
      dragState = null;
      if (!didDrag) applyToolOrder();
    }

    applyToolOrder();
    installDragHandles();
    connectPreferences(data => {
      preferences=data;
      if (!dragState) applyToolOrder();
    }, (ready,message) => {
      canEdit=ready; editButton.disabled=!ready; preferencesStatus.textContent=message;
      if (!ready && editMode) { setEditMode(false); colorPicker.close(); }
    }).then(repo => { preferencesRepo=repo; }).catch(() => { preferencesStatus.textContent='同步失敗，請重新整理後重試'; });

    toolLinks().forEach((link) => {
      const handle = link.querySelector(".drag-handle");

      handle.addEventListener("pointerdown", (event) => {
        if (!editMode) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        handle.setPointerCapture(event.pointerId);
        dragState = {
          link,
          handle,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          didDrag: false,
        };
        document.body.classList.add("reordering");
      }, { passive: false });

      link.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });

      link.addEventListener("click", (event) => {
        if (editMode || link.dataset.dragging === "true") {
          event.preventDefault();
          return;
        }
        const toolUrl = link.getAttribute("data-tool-url");
        if (!toolUrl) return;
        event.preventDefault();
        window.location.replace(toolUrl);
      });
    });

    editButton.addEventListener("click", () => {
      setEditMode(!editMode);
    });

    window.addEventListener("pointermove", (event) => {
      if (!dragState) return;
      if (event.pointerId !== dragState.pointerId) return;
      const distance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
      if (!dragState.didDrag && distance < 4) return;

      dragState.didDrag = true;
      dragState.link.classList.add("dragging");
      toolGrid.classList.add("dragging");
      event.preventDefault();

      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".tool");
      if (!target || target === dragState.link || !toolGrid.contains(target)) return;

      const tools = toolLinks();
      const targetIndex = tools.indexOf(target);
      const draggedIndex = tools.indexOf(dragState.link);
      if (targetIndex < 0 || draggedIndex < 0) return;

      if (targetIndex > draggedIndex) {
        target.after(dragState.link);
      } else {
        target.before(dragState.link);
      }
    }, { passive: false });

    window.addEventListener("pointerup", finishDrag);
    window.addEventListener("pointercancel", finishDrag);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js", { updateViaCache: "none" })
          .then((registration) => registration.update())
          .catch(() => undefined);
      });
    }
  </script>
</body>
</html>
