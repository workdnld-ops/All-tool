<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>庶務工具箱</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #1d252c;
      --muted: #66727c;
      --line: #dfe5e8;
      --primary: #1f6f64;
      --gold: #8a5a00;
      --blue: #245b9b;
      --rose: #9a3d55;
      --shadow: 0 10px 24px rgba(30, 42, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    a,
    button,
    .tool,
    .icon {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .shell {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .date {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .tool {
      min-height: 104px;
      display: grid;
      place-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 8px;
      color: inherit;
      text-align: center;
      text-decoration: none;
      box-shadow: var(--shadow);
    }

    .tool:active {
      transform: translateY(1px);
    }

    .icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--primary);
      background: #e5f2ef;
    }

    .icon.purchase {
      color: var(--gold);
      background: #fff4d8;
    }

    .icon.drink {
      color: var(--blue);
      background: #e7f0fb;
    }

    .icon.cleaning {
      color: var(--rose);
      background: #fbe8ee;
    }

    .icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 420px) {
      .shell { padding-left: 10px; padding-right: 10px; }
      header { align-items: flex-start; flex-direction: column; }
      .date { white-space: normal; }
      .tool { min-height: 94px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <img src="assets/toolbox-icon.svg" alt="">
        <h1>庶務工具箱</h1>
      </div>
      <div class="date" id="today"></div>
    </header>

    <section class="grid" aria-label="工具清單">
      <a class="tool" href="apps/credit-card-slip-stats/index.html" data-tool-url="apps/credit-card-slip-stats/index.html">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 19V5"/>
            <path d="M4 19h16"/>
            <path d="M8 16v-5"/>
            <path d="M12 16V8"/>
            <path d="M16 16v-7"/>
          </svg>
        </div>
        <h2>簽單統計</h2>
      </a>

      <a class="tool" href="apps/purchase-accounting/dist/" data-tool-url="apps/purchase-accounting/dist/">
        <div class="icon purchase" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6 3h12v18H6z"/>
            <path d="M9 7h6"/>
            <path d="M9 11h6"/>
            <path d="M9 15h3"/>
          </svg>
        </div>
        <h2>採購記帳</h2>
      </a>

      <a class="tool" href="apps/drink-calculator/index.html" data-tool-url="apps/drink-calculator/index.html">
        <div class="icon drink" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 3h8"/>
            <path d="M10 3v4l-2 2v10a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V9l-2-2V3"/>
            <path d="M8 13h8"/>
          </svg>
        </div>
        <h2>飲料計算器</h2>
      </a>

      <a class="tool" href="apps/cleaning-schedule/index.html" data-tool-url="apps/cleaning-schedule/index.html">
        <div class="icon cleaning" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3 21h18"/>
            <path d="M7 21V9"/>
            <path d="M17 21V9"/>
            <path d="M6 9h12"/>
            <path d="M8 5h8"/>
            <path d="M10 5V3h4v2"/>
          </svg>
        </div>
        <h2>打掃安排</h2>
      </a>
    </section>
  </main>

  <script>
    const today = new Intl.DateTimeFormat("zh-TW", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "short"
    }).format(new Date());

    document.getElementById("today").textContent = today;

    document.querySelectorAll("[data-tool-url]").forEach((link) => {
      link.addEventListener("click", (event) => {
        const toolUrl = link.getAttribute("data-tool-url");
        if (!toolUrl) return;
        event.preventDefault();
        window.location.replace(toolUrl);
      });
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js", { updateViaCache: "none" })
          .then((registration) => registration.update())
          .catch(() => undefined);
      });
    }
  </script>
</body>
</html>
