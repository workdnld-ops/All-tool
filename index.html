<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>庶務工具箱</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/toolbox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/toolbox-icon.svg">
  <meta name="theme-color" content="#1f6f64">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #1d252c;
      --muted: #66727c;
      --line: #dfe5e8;
      --primary: #1f6f64;
      --gold: #8a5a00;
      --blue: #245b9b;
      --rose: #9a3d55;
      --shadow: 0 10px 24px rgba(30, 42, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    body.reordering {
      overflow: hidden;
      touch-action: none;
    }

    a,
    button,
    .tool,
    .icon {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .shell {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      flex: 0 0 auto;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .edit-button.active {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .date {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .tool {
      min-height: 94px;
      display: grid;
      place-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 8px;
      color: inherit;
      text-align: center;
      text-decoration: none;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
      transition: opacity 140ms ease, transform 140ms ease, border-color 140ms ease;
    }

    .tool:active {
      transform: translateY(1px);
    }

    .tool.dragging {
      opacity: 0.45;
      border-color: var(--primary);
      transform: scale(0.98);
      cursor: grabbing;
    }

    .drag-handle {
      width: 30px;
      height: 30px;
      display: none;
      place-items: center;
      position: absolute;
      top: 5px;
      right: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--primary);
      background: rgba(255, 255, 255, 0.95);
      cursor: grab;
      touch-action: none;
      z-index: 2;
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      line-height: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .grid.editing .tool {
      cursor: default;
      padding-top: 18px;
    }

    .grid.editing .drag-handle {
      display: grid;
    }

    .grid.dragging {
      cursor: grabbing;
    }

    .icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--primary);
      background: #e5f2ef;
    }

    .icon.purchase {
      color: var(--gold);
      background: #fff4d8;
    }

    .icon.drink {
      color: var(--blue);
      background: #e7f0fb;
    }

    .icon.cleaning {
      color: var(--rose);
      background: #fbe8ee;
    }

    .icon.celebration {
      color: #7b4f00;
      background: #fff3cf;
    }

    .icon.schedule {
      color: #1f6f64;
      background: #e5f2ef;
    }

    .icon.todo {
      color: #2f6f5e;
      background: #e5f1ed;
    }

    .icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    @media (max-width: 420px) {
      .shell { padding-left: 10px; padding-right: 10px; }
      header { align-items: flex-start; flex-direction: column; }
      .header-actions { width: 100%; justify-content: space-between; }
      .date { white-space: normal; }
      .tool { min-height: 84px; padding: 9px 5px; gap: 6px; }
      .icon { width: 36px; height: 36px; }
      .icon svg { width: 21px; height: 21px; }
      h2 { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <img src="assets/toolbox-icon.svg" alt="">
        <h1>庶務工具箱</h1>
      </div>
      <div class="header-actions">
        <div class="date" id="today"></div>
        <button class="edit-button" id="edit-tools" type="button">編輯</button>
      </div>
    </header>

    <section class="grid" id="tool-grid" aria-label="工具清單">
      <a class="tool" href="apps/credit-card-slip-stats/index.html" data-tool-id="credit-card-slip-stats" data-tool-url="apps/credit-card-slip-stats/index.html">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 19V5"/>
            <path d="M4 19h16"/>
            <path d="M8 16v-5"/>
            <path d="M12 16V8"/>
            <path d="M16 16v-7"/>
          </svg>
        </div>
        <h2>簽單統計</h2>
      </a>

      <a class="tool" href="apps/purchase-accounting/dist/" data-tool-id="purchase-accounting" data-tool-url="apps/purchase-accounting/dist/">
        <div class="icon purchase" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6 3h12v18H6z"/>
            <path d="M9 7h6"/>
            <path d="M9 11h6"/>
            <path d="M9 15h3"/>
          </svg>
        </div>
        <h2>採購記帳</h2>
      </a>

      <a class="tool" href="apps/drink-calculator/index.html" data-tool-id="drink-calculator" data-tool-url="apps/drink-calculator/index.html">
        <div class="icon drink" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 3h8"/>
            <path d="M10 3v4l-2 2v10a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V9l-2-2V3"/>
            <path d="M8 13h8"/>
          </svg>
        </div>
        <h2>飲料計算器</h2>
      </a>

      <a class="tool" href="apps/cleaning-schedule/index.html" data-tool-id="cleaning-schedule" data-tool-url="apps/cleaning-schedule/index.html">
        <div class="icon cleaning" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3 21h18"/>
            <path d="M7 21V9"/>
            <path d="M17 21V9"/>
            <path d="M6 9h12"/>
            <path d="M8 5h8"/>
            <path d="M10 5V3h4v2"/>
          </svg>
        </div>
        <h2>打掃安排</h2>
      </a>

      <a class="tool" href="apps/celebration-calculator/index.html" data-tool-id="celebration-calculator" data-tool-url="apps/celebration-calculator/index.html">
        <div class="icon celebration" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 21h8"/>
            <path d="M12 17v4"/>
            <path d="M7 4h10v3a5 5 0 0 1-10 0V4z"/>
            <path d="M5 5H3v2a4 4 0 0 0 4 4"/>
            <path d="M19 5h2v2a4 4 0 0 1-4 4"/>
          </svg>
        </div>
        <h2>慶功宴計算器</h2>
      </a>

      <a class="tool" href="apps/schedule-record/index.html" data-tool-id="schedule-record" data-tool-url="apps/schedule-record/index.html">
        <div class="icon schedule" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 2v4"/>
            <path d="M16 2v4"/>
            <path d="M3 10h18"/>
            <path d="M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
            <path d="M8 14h5"/>
            <path d="M8 18h8"/>
          </svg>
        </div>
        <h2>排班紀錄</h2>
      </a>

      <a class="tool" href="apps/todo-board/index.html" data-tool-id="todo-board" data-tool-url="apps/todo-board/index.html">
        <div class="icon todo" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 6h13"/>
            <path d="M8 12h13"/>
            <path d="M8 18h13"/>
            <path d="M3 6l1 1 2-2"/>
            <path d="M3 12l1 1 2-2"/>
            <path d="M3 18l1 1 2-2"/>
          </svg>
        </div>
        <h2>待辦事項</h2>
      </a>
    </section>
  </main>

  <script>
    const today = new Intl.DateTimeFormat("zh-TW", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "short"
    }).format(new Date());

    document.getElementById("today").textContent = today;

    const toolGrid = document.getElementById("tool-grid");
    const editButton = document.getElementById("edit-tools");
    const TOOL_ORDER_KEY = "opsToolboxToolOrder";
    let editMode = false;
    let dragState = null;

    function toolLinks() {
      return Array.from(toolGrid.querySelectorAll("[data-tool-url]"));
    }

    function saveToolOrder() {
      const order = toolLinks()
        .map((link) => link.getAttribute("data-tool-id"))
        .filter(Boolean);
      localStorage.setItem(TOOL_ORDER_KEY, JSON.stringify(order));
    }

    function applyToolOrder() {
      try {
        const savedOrder = JSON.parse(localStorage.getItem(TOOL_ORDER_KEY) || "[]");
        if (!Array.isArray(savedOrder) || savedOrder.length === 0) return;
        const orderIndex = new Map(savedOrder.map((id, index) => [id, index]));
        toolLinks()
          .sort((a, b) => {
            const aIndex = orderIndex.has(a.dataset.toolId) ? orderIndex.get(a.dataset.toolId) : Number.MAX_SAFE_INTEGER;
            const bIndex = orderIndex.has(b.dataset.toolId) ? orderIndex.get(b.dataset.toolId) : Number.MAX_SAFE_INTEGER;
            return aIndex - bIndex;
          })
          .forEach((link) => toolGrid.append(link));
      } catch {
        localStorage.removeItem(TOOL_ORDER_KEY);
      }
    }

    function installDragHandles() {
      toolLinks().forEach((link) => {
        if (link.querySelector(".drag-handle")) return;
        const handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "↕";
        handle.setAttribute("role", "button");
        handle.setAttribute("tabindex", "0");
        handle.setAttribute("aria-label", `拖曳排序：${link.textContent.trim()}`);
        link.append(handle);
      });
    }

    function setEditMode(nextMode) {
      editMode = nextMode;
      toolGrid.classList.toggle("editing", editMode);
      editButton.classList.toggle("active", editMode);
      editButton.textContent = editMode ? "完成" : "編輯";
      if (!editMode) finishDrag();
    }

    function finishDrag() {
      if (!dragState) return;
      const { link, handle, didDrag, pointerId } = dragState;
      try {
        handle.releasePointerCapture(pointerId);
      } catch {
        // Pointer capture may already be released by the browser.
      }
      link.classList.remove("dragging");
      link.dataset.dragging = didDrag ? "true" : "";
      toolGrid.classList.remove("dragging");
      document.body.classList.remove("reordering");
      if (didDrag) {
        saveToolOrder();
        window.setTimeout(() => {
          link.dataset.dragging = "";
        }, 250);
      }
      dragState = null;
    }

    applyToolOrder();
    installDragHandles();

    toolLinks().forEach((link) => {
      const handle = link.querySelector(".drag-handle");

      handle.addEventListener("pointerdown", (event) => {
        if (!editMode) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        handle.setPointerCapture(event.pointerId);
        dragState = {
          link,
          handle,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          didDrag: false,
        };
        document.body.classList.add("reordering");
      }, { passive: false });

      link.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });

      link.addEventListener("click", (event) => {
        if (editMode || link.dataset.dragging === "true") {
          event.preventDefault();
          return;
        }
        const toolUrl = link.getAttribute("data-tool-url");
        if (!toolUrl) return;
        event.preventDefault();
        window.location.replace(toolUrl);
      });
    });

    editButton.addEventListener("click", () => {
      setEditMode(!editMode);
    });

    window.addEventListener("pointermove", (event) => {
      if (!dragState) return;
      if (event.pointerId !== dragState.pointerId) return;
      const distance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
      if (!dragState.didDrag && distance < 4) return;

      dragState.didDrag = true;
      dragState.link.classList.add("dragging");
      toolGrid.classList.add("dragging");
      event.preventDefault();

      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".tool");
      if (!target || target === dragState.link || !toolGrid.contains(target)) return;

      const tools = toolLinks();
      const targetIndex = tools.indexOf(target);
      const draggedIndex = tools.indexOf(dragState.link);
      if (targetIndex < 0 || draggedIndex < 0) return;

      if (targetIndex > draggedIndex) {
        target.after(dragState.link);
      } else {
        target.before(dragState.link);
      }
    }, { passive: false });

    window.addEventListener("pointerup", finishDrag);
    window.addEventListener("pointercancel", finishDrag);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js", { updateViaCache: "none" })
          .then((registration) => registration.update())
          .catch(() => undefined);
      });
    }
  </script>
</body>
</html>
